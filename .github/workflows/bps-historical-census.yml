name: BPS Historical Census Anchors

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bps-historical-census.yml"
      - "scripts/harvest_bps_series.py"
      - "scripts/normalize_bps_dynamic.py"
      - "scripts/bps_client.py"

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require BPS API key
        run: test -n "$BPS_API_KEY"

      - name: Harvest official census and SUPAS population anchors
        run: >-
          python scripts/harvest_bps_series.py
          --domain 1300
          --var 484
          --period 1971
          --period 1980
          --period 1990
          --period 1995
          --period 2000
          --period 2005
          --period 2010
          --period 2015
          --period 2020
          --output-dir /tmp/bps-census-var-484

      - name: Upload sanitized census snapshots
        uses: actions/upload-artifact@v4
        with:
          name: bps-census-supas-var-484
          path: /tmp/bps-census-var-484/
          if-no-files-found: error
          retention-days: 14
