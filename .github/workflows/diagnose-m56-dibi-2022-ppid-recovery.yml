name: Diagnose M56 DIBI 2022 PPID recovery

on:
  push:
    branches:
      - research/evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded PDF parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir pypdf==6.0.0

      - name: Download recovered current PPID UUID artifact
        run: |
          set -euo pipefail
          url='https://ppid.sumbarprov.go.id/home/download/faf18bd0-76d9-44b2-8092-b89f70f29e6e'
          curl --fail --silent --show-error --location --max-time 180 "$url" -o /tmp/dibi-2022.pdf
          test "$(head -c 5 /tmp/dibi-2022.pdf)" = '%PDF-'
          test "$(sha256sum /tmp/dibi-2022.pdf | cut -d' ' -f1)" = 'f0ce706388d54c361ecd36f7c5da2a3bd749f59b32f807c9e8c5bb25fef67ba3'
          wc -c /tmp/dibi-2022.pdf
          sha256sum /tmp/dibi-2022.pdf
          file /tmp/dibi-2022.pdf

      - name: Inspect page count and source-native table locators
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          import json, re

          path=Path('/tmp/dibi-2022.pdf')
          reader=PdfReader(str(path))
          print('PAGE_COUNT=',len(reader.pages))
          hits=[]
          target_patterns=[
              r'Tabel\s+3\.1', r'Tabel\s+3\.2', r'Tabel\s+3\.3', r'Tabel\s+3\.4',
              r'Tabel\s+3\.5', r'Tabel\s+3\.6', r'Tabel\s+3\.7', r'Tabel\s+3\.8',
              r'Tabel\s+3\.9', r'Tabel\s+3\.10', r'1[\.,]021', r'1[\.,]136[\.,]849[\.,]586[\.,]796'
          ]
          for i,page in enumerate(reader.pages, start=1):
              text=(page.extract_text() or '').replace('\x00',' ')
              folded=re.sub(r'\s+',' ',text)
              matched=[pat for pat in target_patterns if re.search(pat,folded,re.I)]
              if matched:
                  hits.append({'pdf_page':i,'patterns':matched,'excerpt':folded[:2500]})
          print('TABLE_HITS_JSON='+json.dumps(hits,ensure_ascii=False,sort_keys=True))
          PY

      - name: Extract compact text around Tables 3.1-3.10 and loss appendix
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          import re

          reader=PdfReader('/tmp/dibi-2022.pdf')
          wanted=[]
          for i,page in enumerate(reader.pages,start=1):
              text=(page.extract_text() or '').replace('\x00',' ')
              norm=re.sub(r'\s+',' ',text)
              if re.search(r'Tabel\s+3\.(?:[1-9]|10)\b',norm,re.I) or '1.136.849.586.796' in norm or '1,136,849,586,796' in norm:
                  wanted.append((i,norm))
          for i,text in wanted:
              print(f'\n===== PDF PAGE {i} =====')
              print(text[:6000])
          PY
