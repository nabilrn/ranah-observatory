name: Milestone 26 Stage 2 event-impact preflight

on:
  pull_request:
    paths:
      - scripts/probe_milestone26_event_impact_retrieval.py
      - data/manifests/milestone26_stage2_event_impact_contract.json
      - data/processed/bnpb/m26_source_qualification/bnpb_event_impact_table.html
      - .github/workflows/milestone26-stage2-event-impact-preflight.yml
  push:
    branches:
      - agent/milestone26-disaster-risk-chain
    paths:
      - .github/workflows/milestone26-stage2-event-impact-preflight.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile preflight
        run: python -m py_compile scripts/probe_milestone26_event_impact_retrieval.py
      - name: Run frozen-surface preflight
        run: python -m scripts.probe_milestone26_event_impact_retrieval
      - name: Verify fail-closed preflight semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/analysis/engine/disaster_risk_chain_v1/m26-stage2-event-impact-preflight.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          assert x['schema'] == 'ranah-observatory/milestone26-stage2-event-impact-preflight/v1'
          assert x['header_contract_match'] is True
          assert x['locked_event_types_present'] is True
          assert x['target_period_live_retrieval_performed'] is False
          assert x['impact_aggregation_performed'] is False
          assert x['blank_interpreted_as_zero'] is False
          assert x['automatic_duplicate_collapse_performed'] is False
          assert x['risk_synthesis_authorized'] is False
          assert x['causal_claim_created'] is False
          assert x['monetary_loss_inferred'] is False
          PY
      - name: Commit deterministic preflight artifact
        run: |
          git add data/analysis/engine/disaster_risk_chain_v1/m26-stage2-event-impact-preflight.json
          if git diff --cached --quiet; then
            echo 'Preflight artifact unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm26: freeze Stage 2 event-impact preflight'
          git push origin HEAD:agent/milestone26-disaster-risk-chain
