name: Milestone 10 Analytical Panel Build

on:
  push:
    branches:
      - agent/phase2-m10-analytical-panel-v1
    paths:
      - "scripts/build_milestone10_analytical_panel.py"
      - "research/MILESTONE10_ANALYTICAL_PANEL_SPEC.md"
      - "data/registries/geographies.csv"
      - "data/registries/indicators.csv"
      - "data/processed/bps/panel/**"
      - "data/processed/bps/expansion/**"
      - "data/processed/climate/rainfall/**"
      - "data/processed/bnpb/disaster/**"
      - ".github/workflows/milestone10-analytical-panel-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone10-analytical-panel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Milestone 10 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-m10-analytical-panel-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build preregistered Analytical Panel v1
        run: python -m scripts.build_milestone10_analytical_panel

      - name: Commit deterministic panel artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/panel_v1 \
            data/manifests/milestone10_analytical_panel.json
          if git diff --cached --quiet; then
            echo "Milestone 10 analytical panel unchanged."
            exit 0
          fi
          git commit -m "analysis: materialize milestone10 analytical panel v1"
          git pull --rebase origin agent/phase2-m10-analytical-panel-v1
          git push origin HEAD:agent/phase2-m10-analytical-panel-v1
