name: Milestone 26 population stats geometry

on:
  pull_request:
    paths:
      - data/manifests/milestone26_population_stats_geometry_contract.json
      - scripts/build_milestone26_population_stats_geometry.py
      - tests/test_milestone26_population_stats_geometry.py
      - .github/workflows/milestone26-population-stats-geometry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stats-geometries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused spatial dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy shapely pyproj rasterio

      - name: Compile geometry builder
        run: python -m py_compile scripts/build_milestone26_population_stats_geometry.py

      - name: Run geometry tests
        run: python -m pytest -q tests/test_milestone26_population_stats_geometry.py

      - name: Build URI-safe pixel-mask-equivalent geometries
        run: python -m scripts.build_milestone26_population_stats_geometry

      - name: Assert geometry-only evidence boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/manifests/milestone26_population_stats_geometry.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-population-stats-geometry/v1'
          assert manifest['geography_count'] == 19
          assert len(manifest['geographies']) == 19
          assert manifest['resolved_geometry_count'] + manifest['unresolved_geometry_count'] == 19
          assert manifest['source_values_accessed'] is False
          assert manifest['statistics_live_request_performed'] is False
          assert manifest['numeric_source_value_extraction_performed'] is False
          assert manifest['stage1_population_aggregation_authorized'] is False
          assert manifest['substantive_value_promotion_performed'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          for row in manifest['geographies']:
              candidate = row['selected_candidate']
              if candidate is not None:
                  assert candidate['pixel_mask_equal'] is True
                  assert candidate['pixel_mask_sha256'] == row['original_pixel_mask_sha256']
                  assert candidate['encoded_url_length'] <= 6000
          PY

      - name: Re-run focused tests
        run: python -m pytest -q tests/test_milestone26_population_stats_geometry.py

      - name: Commit frozen stats geometry evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/manifests/milestone26_population_stats_geometry.json
          if git diff --cached --quiet; then
            echo 'No stats geometry changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 population stats geometries"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
