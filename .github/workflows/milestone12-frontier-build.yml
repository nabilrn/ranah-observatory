name: Milestone 12 Frontier Build

on:
  push:
    branches:
      - agent/phase2-m12-attainable-frontier
    paths:
      - "scripts/build_milestone12_attainable_frontier.py"
      - "research/MILESTONE12_ATTAINABLE_FRONTIER_SPEC.md"
      - "data/manifests/milestone12_design_gate.json"
      - "data/registries/milestone12_frontier_method_qualification.csv"
      - "data/analysis/engine/expected_performance_v2/**"
      - "data/manifests/milestone11_expected_performance_v2.json"
      - "data/analysis/expected_performance/**"
      - "data/manifests/milestone7_expected_performance_audit.json"
      - ".github/workflows/milestone12-frontier-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone12-frontier-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Milestone 12 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-m12-attainable-frontier
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build preregistered frontier engine
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.build_milestone12_attainable_frontier 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 14 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 12 build failure::$message"
          exit 1

      - name: Commit deterministic M12 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/frontier_v1 \
            data/manifests/milestone12_attainable_frontier.json
          if git diff --cached --quiet; then
            echo "Milestone 12 artifacts unchanged."
            exit 0
          fi
          git commit -m "analysis: materialize milestone12 attainable frontier"
          git pull --rebase origin agent/phase2-m12-attainable-frontier
          git push origin HEAD:agent/phase2-m12-attainable-frontier
