name: Milestone 27 BKPM Public Data Zero-Row Probe

on:
  push:
    branches:
      - agent/milestone27-bkpm-investment-history
    paths:
      - .github/workflows/milestone27-bkpm-public-data-zero-row.yml
      - data/manifests/milestone27_public_data_zero_row_contract.json
      - scripts/probe_milestone27_bkpm_public_data_zero_row.py
  workflow_dispatch:

concurrency:
  group: milestone27-bkpm-public-data-zero-row
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe-zero-row:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone27-bkpm-investment-history
          fetch-depth: 0

      - name: Compile probe
        run: python -m py_compile scripts/probe_milestone27_bkpm_public_data_zero_row.py

      - name: Run zero-row schema probe
        run: python scripts/probe_milestone27_bkpm_public_data_zero_row.py

      - name: Verify fail-closed boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone27_bkpm_public_data_zero_row_probe.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone27-bkpm-public-data-zero-row-probe/v1'
          assert m['pilot_count'] == 3
          assert {(r['year'], r['quarter']) for r in m['pilot_results']} == {(2010, 'I'), (2025, 'II'), (2025, 'IV')}
          assert all(r['request_method'] == 'GET' for r in m['pilot_results'])
          assert all(r['response_body_persisted'] is False for r in m['pilot_results'])
          assert all(r['raw_json_persisted'] is False for r in m['pilot_results'])
          assert all(r['data_array_elements_inspected'] is False for r in m['pilot_results'])
          assert all(r['target_investment_values_inspected'] is False for r in m['pilot_results'])
          assert all(r['period_values_inspected'] is False for r in m['pilot_results'])
          assert m['response_body_persisted'] is False
          assert m['raw_json_persisted'] is False
          assert m['data_array_elements_inspected'] is False
          assert m['target_investment_values_inspected'] is False
          assert m['period_values_inspected'] is False
          assert m['source_selection_uses_response_values'] is False
          assert m['investment_value_aggregation_performed'] is False
          assert m['quarterly_flow_interpretation_authorized'] is False
          assert m['cross_quarter_additivity_authorized'] is False
          assert m['annual_sum_authorized'] is False
          assert m['geography_mapping_authorized'] is False
          assert m['statistical_model_fit'] is False
          assert m['causal_claim_created'] is False
          assert m['monetary_wasted_potential_estimated'] is False
          print({
              'classifications': [r['classification'] for r in m['pilot_results']],
              'schema_qualified': m['schema_qualified'],
              'qualified_declared_column_count': m['qualified_declared_column_count'],
          })
          PY

      - name: Commit sanitized zero-row evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/milestone27_bkpm_public_data_zero_row_probe.json
          if git diff --cached --quiet; then
            echo "No zero-row evidence changes to commit"
            exit 0
          fi
          git commit -m "Freeze M27 BKPM public data zero-row evidence"
          git push origin HEAD:agent/milestone27-bkpm-investment-history
