name: Milestone 25 final DJPK fiscal freeze

# Temporary same-repo PR writer for public DJPK evidence. Remove before merge.
on:
  pull_request:
    paths:
      - .github/workflows/milestone25-final-freeze.yml
      - scripts/materialize_milestone25_djpk_exact_panel.py
      - scripts/finalize_milestone25_djpk_public_finance.py
      - tests/test_milestone25_djpk_materializer.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run M25 offline unit tests before live retrieval
        run: >-
          python -m pytest -q
          tests/test_milestone25_djpk_taxonomy.py
          tests/test_milestone25_djpk_stage1.py
          tests/test_milestone25_djpk_materializer.py

      - name: Stage 0 — freeze Kota Padang taxonomy evidence before cross-geography extraction
        run: python scripts/probe_milestone25_djpk_taxonomy.py

      - name: Lock Stage 1 exact-label contracts
        run: python scripts/lock_milestone25_stage1_contracts.py

      - name: Assert exact contracts were locked before any cross-geography extraction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone25_stage1_contracts.json').read_text())
          assert m['contracts_locked'] is True
          assert m['cross_geography_values_inspected_before_lock'] is False
          assert m['explicit_bridge_promoted'] is False
          assert m['derived_ratio_authorized'] is False
          assert m['promoted_exact_label_family_count'] >= 1
          PY

      - name: Pilot gate — all 19 pemda for 2024 only
        run: >-
          python scripts/probe_milestone25_djpk_stage1.py
          --years 2024
          --coverage /tmp/m25-pilot/coverage.csv
          --values /tmp/m25-pilot/values.csv
          --manifest /tmp/m25-pilot/manifest.json
          --raw-dir /tmp/m25-pilot/raw

      - name: Assert pilot before full 2018-2025 retrieval
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          m = json.loads(Path('/tmp/m25-pilot/manifest.json').read_text())
          with Path('/tmp/m25-pilot/coverage.csv').open(newline='', encoding='utf-8') as h:
              rows = list(csv.DictReader(h))
          assert m['years'] == [2024]
          assert m['jurisdiction_year_page_count'] == 19
          assert m['all_pages_pass'] is True
          assert len(rows) == 19 and all(r['page_pass'] == 'True' for r in rows)
          assert m['cross_geography_probe_completed_after_contract_lock'] is True
          assert m['explicit_bridge_used'] is False
          assert m['derived_ratio_created'] is False
          assert m['imputation_performed'] is False
          assert m['statistical_model_fit'] is False
          PY

      - name: Full Stage 1 — freeze 19 pemda × 2018-2025 exact-label evidence
        run: >-
          python scripts/probe_milestone25_djpk_stage1.py
          --years 2018 2019 2020 2021 2022 2023 2024 2025
          --coverage data/analysis/engine/djpk_finance_v1/m25-stage1-full-coverage.csv
          --values data/analysis/engine/djpk_finance_v1/m25-stage1-full-values.csv
          --manifest /tmp/m25-full-manifest.json
          --raw-dir data/processed/djpk/public_finance/source

      - name: Materialize exact-label canonical fiscal panel offline from frozen HTML
        run: python scripts/materialize_milestone25_djpk_exact_panel.py

      - name: Build strict M25 completion manifest
        run: python scripts/finalize_milestone25_djpk_public_finance.py

      - name: Assert final scientific boundaries and dynamic footprint
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          final = json.loads(Path('data/manifests/milestone25_djpk_public_finance_complete.json').read_text())
          panel = json.loads(Path('data/processed/djpk/public_finance/djpk-fiscal-panel.manifest.json').read_text())
          assert final['milestone25_complete'] is True
          assert final['stage0_taxonomy_complete'] is True
          assert final['stage1_exact_panel_complete'] is True
          assert final['jurisdiction_year_count'] == 152
          assert final['promoted_exact_label_family_count'] >= 1
          assert final['observation_count'] == 152 * final['promoted_exact_label_family_count']
          assert final['provenance_count'] == 152
          assert final['frozen_stage0_page_count'] == 8
          assert final['frozen_stage1_page_count'] == 152
          assert final['explicit_bridge_used'] is False
          assert final['derived_ratio_created'] is False
          assert final['imputation_performed'] is False
          assert final['historical_boundary_reconstruction_performed'] is False
          assert final['posthoc_account_family_search_performed'] is False
          assert final['statistical_model_fit'] is False
          assert panel['observation_count'] == final['observation_count']
          with Path('data/processed/djpk/public_finance/djpk-fiscal-canonical-observations.csv').open(newline='', encoding='utf-8') as h:
              observations = list(csv.DictReader(h))
          assert len(observations) == final['observation_count']
          assert len({(r['fiscal_account_id'], r['geography_id'], r['year']) for r in observations}) == len(observations)
          PY

      - name: Commit only credential-free frozen DJPK evidence and exact panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/djpk_finance_v1/m25-taxonomy-discovery.csv \
            data/analysis/engine/djpk_finance_v1/m25-account-presence.csv \
            data/analysis/engine/djpk_finance_v1/m25-stage1-full-coverage.csv \
            data/analysis/engine/djpk_finance_v1/m25-stage1-full-values.csv \
            data/manifests/milestone25_taxonomy_discovery.json \
            data/manifests/milestone25_stage1_contracts.json \
            data/manifests/milestone25_djpk_public_finance_complete.json \
            data/registries/djpk_m25_stage1_account_contracts.csv \
            data/processed/djpk/taxonomy_probe \
            data/processed/djpk/public_finance
          if git diff --cached --quiet; then
            echo 'No M25 freeze changes'
            exit 0
          fi
          git commit -m "Materialize Milestone 25 DJPK public-finance panel"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
