permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository test dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            rasterio==1.5.0 \
            shapely==2.1.2 \
            pyproj==3.7.2

      - name: Validate canonical data foundation
        run: python scripts/validate_data_foundation.py

      - name: Validate BPS ingestion foundation
        run: python scripts/validate_bps_foundation.py

      - name: Validate historical reconstruction foundation
        run: python scripts/validate_historical_reconstruction.py

      - name: Validate historical acquisition batch
        run: python scripts/validate_historical_batch.py

      - name: Validate BPS-backed 1971 historical population anchor
        run: python scripts/validate_bps_historical_anchor.py

      - name: Validate official SP1961 historical population anchor
        run: python scripts/validate_sp1961_official_anchor.py

      - name: Validate bounded Sumbar 1970 official artifact checkpoint
        run: python scripts/validate_sumbar1970_official_artifact.py

      - name: Validate incomplete official Sumbar 1980 artifact finding
        run: python scripts/validate_sumbar1980_incomplete_artifact.py

      - name: Validate incomplete official Sumbar 1990 artifact finding
        run: python scripts/validate_sumbar1990_incomplete_artifact.py

      - name: Validate complete Sumbar 2000 artifact and population anchor
        run: python scripts/validate_sumbar2000_official_anchor.py

      - name: Validate Sumbar 2000 APBD-financed construction source-native anchor
        run: python scripts/validate_sumbar2000_apbd_construction_anchor.py

      - name: Validate Sumbar 2000 construction financing composition
        run: python scripts/validate_sumbar2000_construction_financing_composition.py

      - name: Validate Sumbar 1998-2003 construction financing revision audit
        run: python scripts/validate_sumbar_construction_financing_revision_audit.py

      - name: Validate Sumbar 2002-2003 construction major release break
        run: python scripts/validate_sumbar_construction_major_release_break.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
