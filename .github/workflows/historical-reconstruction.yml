name: Historical Reconstruction

on:
  push:
    paths:
      - "catalog/**"
      - "data/acquisition_requests/**"
      - "data/manifests/**"
      - "data/processed/bps/historical_population_source_native.csv"
      - "data/processed/bps/historical_population_1961_source_native.csv"
      - "data/validation/historical/sp1961/**"
      - "data/registries/geographies.csv"
      - "data/registries/historical_*.csv"
      - "data/snapshots/bps/var-484-1971.json"
      - "data/snapshots/bps/var-484-1971.json.sha256"
      - "schemas/historical-extraction.schema.json"
      - "scripts/historical_batch_collect.py"
      - "scripts/historical_batch_ingest.py"
      - "scripts/normalize_bps_dynamic.py"
      - "scripts/validate_bps_historical_anchor.py"
      - "scripts/validate_sp1961_official_anchor.py"
      - "scripts/validate_historical_batch.py"
      - "scripts/validate_historical_reconstruction.py"
      - "tests/test_bps_historical_anchor.py"
      - "tests/test_sp1961_official_anchor.py"
      - "tests/test_historical_batch.py"
      - "tests/test_historical_reconstruction.py"
      - "docs/HISTORICAL_ACQUISITION.md"
      - "docs/HISTORICAL_RECONSTRUCTION.md"
      - ".github/workflows/historical-reconstruction.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "data/acquisition_requests/**"
      - "data/manifests/**"
      - "data/processed/bps/historical_population_source_native.csv"
      - "data/processed/bps/historical_population_1961_source_native.csv"
      - "data/validation/historical/sp1961/**"
      - "data/registries/geographies.csv"
      - "data/registries/historical_*.csv"
      - "data/snapshots/bps/var-484-1971.json"
      - "data/snapshots/bps/var-484-1971.json.sha256"
      - "schemas/historical-extraction.schema.json"
      - "scripts/historical_batch_collect.py"
      - "scripts/historical_batch_ingest.py"
      - "scripts/normalize_bps_dynamic.py"
      - "scripts/validate_bps_historical_anchor.py"
      - "scripts/validate_sp1961_official_anchor.py"
      - "scripts/validate_historical_batch.py"
      - "scripts/validate_historical_reconstruction.py"
      - "tests/test_bps_historical_anchor.py"
      - "tests/test_sp1961_official_anchor.py"
      - "tests/test_historical_batch.py"
      - "tests/test_historical_reconstruction.py"
      - "docs/HISTORICAL_ACQUISITION.md"
      - "docs/HISTORICAL_RECONSTRUCTION.md"
      - ".github/workflows/historical-reconstruction.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository test dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            rasterio==1.5.0 \
            shapely==2.1.2 \
            pyproj==3.7.2

      - name: Validate canonical data foundation
        run: python scripts/validate_data_foundation.py

      - name: Validate BPS ingestion foundation
        run: python scripts/validate_bps_foundation.py

      - name: Validate historical reconstruction foundation
        run: python scripts/validate_historical_reconstruction.py

      - name: Validate historical acquisition batch
        run: python scripts/validate_historical_batch.py

      - name: Validate BPS-backed 1971 historical population anchor
        run: python scripts/validate_bps_historical_anchor.py

      - name: Validate official SP1961 historical population anchor
        run: python scripts/validate_sp1961_official_anchor.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
