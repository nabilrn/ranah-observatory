name: Milestone 25 authoritative DJPK fiscal freeze

# Temporary authoritative recovery writer. Remove before merge.
on:
  pull_request:
    paths:
      - .github/workflows/milestone25-final-freeze-v2.yml
      - data/registries/djpk_sumbar_pemda.csv
      - data/manifests/milestone25_transport_amendment.json
      - scripts/milestone25_djpk_html_compat.py
      - scripts/milestone25_djpk_export.py
      - scripts/probe_milestone25_djpk_stage1_export.py
      - scripts/materialize_milestone25_djpk_exact_panel.py
      - scripts/finalize_milestone25_djpk_public_finance.py
      - scripts/build_milestone25_documentation.py
      - scripts/audit_milestone25_djpk_public_finance.py
      - tests/test_milestone25_djpk_export.py
      - tests/test_milestone25_djpk_html_compat.py
      - tests/test_milestone25_djpk_identity_aliases.py
      - tests/test_milestone25_djpk_materialized.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run offline pre-freeze tests
        run: >-
          python -m pytest -q
          tests/test_milestone25_djpk_taxonomy.py
          tests/test_milestone25_djpk_stage1.py
          tests/test_milestone25_djpk_materializer.py
          tests/test_milestone25_djpk_html_compat.py
          tests/test_milestone25_djpk_identity_aliases.py
          tests/test_milestone25_djpk_export.py

      - name: Stage 0 — freeze reference taxonomy first
        run: >-
          python scripts/run_milestone25_djpk_compat.py
          probe_milestone25_djpk_taxonomy

      - name: Lock exact-label Stage 1 contracts before cross-geography inspection
        run: python scripts/lock_milestone25_stage1_contracts.py

      - name: Assert taxonomy and transport boundaries before pilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contracts = json.loads(Path('data/manifests/milestone25_stage1_contracts.json').read_text())
          transport = json.loads(Path('data/manifests/milestone25_transport_amendment.json').read_text())
          assert contracts['contracts_locked'] is True
          assert contracts['cross_geography_values_inspected_before_lock'] is False
          assert contracts['explicit_bridge_promoted'] is False
          assert contracts['derived_ratio_authorized'] is False
          assert contracts['posthoc_account_family_search_performed'] is False
          assert contracts['statistical_model_fit'] is False
          assert set(contracts['promoted_exact_label_families']) == {
              'total_revenue', 'own_source_revenue_pad', 'total_expenditure', 'capital_expenditure'
          }
          assert set(contracts['held_families']) == {'central_transfer_revenue'}
          assert transport['representation_amendment_after_transport_failure'] is True
          assert transport['scientific_design_changed'] is False
          assert transport['account_family_set_changed'] is False
          assert transport['target_years_changed'] is False
          assert transport['geography_set_changed'] is False
          assert transport['period_selector_changed'] is False
          assert transport['posthoc_account_family_search_performed'] is False
          PY

      - name: Pilot gate — all 19 pemda, 2024, dual representation
        run: >-
          python scripts/probe_milestone25_djpk_stage1_export.py
          --years 2024
          --coverage /tmp/m25-pilot/coverage.csv
          --values /tmp/m25-pilot/values.csv
          --manifest /tmp/m25-pilot/manifest.json
          --raw-dir /tmp/m25-pilot/raw

      - name: Assert dual-representation pilot gate
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          m = json.loads(Path('/tmp/m25-pilot/manifest.json').read_text())
          with Path('/tmp/m25-pilot/coverage.csv').open(newline='', encoding='utf-8') as h:
              coverage = list(csv.DictReader(h))
          assert m['years'] == [2024]
          assert m['jurisdiction_year_page_count'] == 19
          assert m['value_row_count'] == 76
          assert m['html_snapshot_count'] == 19
          assert m['spreadsheetml_snapshot_count'] == 19
          assert m['all_pages_pass'] is True
          assert len(coverage) == 19 and all(r['page_pass'] == 'True' for r in coverage)
          assert {r['same_selector_export_link_match'] for r in coverage} == {'True'}
          assert {r['export_valid_spreadsheetml'] for r in coverage} == {'True'}
          assert {r['html_value_crosscheck_failure_count'] for r in coverage} == {'0'}
          PY

      - name: Full Stage 1 — freeze 19 × 2018-2025 HTML plus exact SpreadsheetML
        run: >-
          python scripts/probe_milestone25_djpk_stage1_export.py
          --years 2018 2019 2020 2021 2022 2023 2024 2025
          --coverage data/analysis/engine/djpk_finance_v1/m25-stage1-full-coverage.csv
          --values data/analysis/engine/djpk_finance_v1/m25-stage1-full-values.csv
          --manifest data/manifests/milestone25_stage1_full_export.json
          --raw-dir data/processed/djpk/public_finance/source

      - name: Materialize canonical panel from frozen exact exports
        run: python scripts/materialize_milestone25_djpk_exact_panel.py

      - name: Finalize strict M25 completion manifest
        run: python scripts/finalize_milestone25_djpk_public_finance.py

      - name: Build data-driven M25 documentation
        run: python scripts/build_milestone25_documentation.py

      - name: Run materialized tests and analytical audit
        run: |
          python -m pytest -q \
            tests/test_milestone25_djpk_materialized.py \
            tests/test_milestone25_djpk_html_compat.py \
            tests/test_milestone25_djpk_identity_aliases.py \
            tests/test_milestone25_djpk_export.py
          python scripts/audit_milestone25_djpk_public_finance.py

      - name: Assert final fail-closed footprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          final = json.loads(Path('data/manifests/milestone25_djpk_public_finance_complete.json').read_text())
          assert final['milestone25_complete'] is True
          assert final['geography_count'] == 19
          assert final['year_count'] == 8
          assert final['jurisdiction_year_count'] == 152
          assert final['promoted_exact_label_family_count'] == 4
          assert final['observation_count'] == 608
          assert final['provenance_count'] == 152
          assert final['frozen_stage0_page_count'] == 8
          assert final['frozen_stage1_html_page_count'] == 152
          assert final['frozen_stage1_spreadsheetml_count'] == 152
          assert final['html_table_parseable_page_count'] + final['html_table_unparseable_page_count'] == 152
          assert final['primary_numeric_evidence'] == 'djpk_csv_apbd_spreadsheetml_exact_rupiah'
          assert final['scientific_design_changed_by_transport_amendment'] is False
          assert final['explicit_bridge_used'] is False
          assert final['derived_ratio_created'] is False
          assert final['imputation_performed'] is False
          assert final['historical_boundary_reconstruction_performed'] is False
          assert final['posthoc_account_family_search_performed'] is False
          assert final['statistical_model_fit'] is False
          assert final['user_contribution_required'] is False
          PY

      - name: Commit complete credential-free M25 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/djpk_finance_v1/m25-taxonomy-discovery.csv \
            data/analysis/engine/djpk_finance_v1/m25-account-presence.csv \
            data/analysis/engine/djpk_finance_v1/m25-stage1-full-coverage.csv \
            data/analysis/engine/djpk_finance_v1/m25-stage1-full-values.csv \
            data/manifests/milestone25_taxonomy_discovery.json \
            data/manifests/milestone25_stage1_contracts.json \
            data/manifests/milestone25_stage1_full_export.json \
            data/manifests/milestone25_djpk_public_finance_complete.json \
            data/registries/djpk_m25_stage1_account_contracts.csv \
            data/processed/djpk/taxonomy_probe \
            data/processed/djpk/public_finance \
            docs/MILESTONE25_DJPK_PUBLIC_FINANCE.md
          if git diff --cached --quiet; then
            echo 'No M25 freeze changes'
            exit 0
          fi
          git commit -m "Materialize Milestone 25 DJPK dual-representation fiscal panel"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
