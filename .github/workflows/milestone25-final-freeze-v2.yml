name: Milestone 25 authoritative DJPK fiscal freeze

# Temporary diagnostic mode. Restore authoritative freeze after alias audit.
on:
  pull_request:
    paths:
      - .github/workflows/milestone25-final-freeze-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact source naming for pilot failures
        run: python scripts/diagnose_milestone25_pilot_failures.py
