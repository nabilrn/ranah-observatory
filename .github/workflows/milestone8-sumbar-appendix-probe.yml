name: Milestone 8 Sumbar Appendix Probe

on:
  push:
    branches:
      - agent/milestone8-earthquake-quasi-causal
    paths:
      - "scripts/probe_milestone8_sumbar_appendix.py"
      - ".github/workflows/milestone8-sumbar-appendix-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone8-sumbar-appendix-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Milestone 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone8-earthquake-quasi-causal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe district/city appendix pages
        run: python -m scripts.probe_milestone8_sumbar_appendix

      - name: Commit deterministic appendix discovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/manifests/milestone8_sumbar_appendix_probe.json \
            data/processed/milestone8/source_text/appendix-candidates
          if git diff --cached --quiet; then
            echo "Milestone 8 Sumbar appendix probe unchanged."
            exit 0
          fi
          git commit -m "research: record M8 Sumbar appendix candidates"
          git pull --rebase origin agent/milestone8-earthquake-quasi-causal
          git push origin HEAD:agent/milestone8-earthquake-quasi-causal
