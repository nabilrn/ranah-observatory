name: Milestone 26 capacity transport preflight

on:
  pull_request:
    paths:
      - scripts/preflight_milestone26_capacity_transport.py
      - data/manifests/milestone26_capacity_production_contract.json
      - data/processed/bnpb/m26_source_qualification/inarisk_capacity_2021.json
      - data/snapshots/big/milestone8/big-june-2026-sumbar.geojson
      - .github/workflows/milestone26-capacity-transport-preflight.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capacity-export-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy shapely pyproj

      - name: Compile preflight
        run: python -m py_compile scripts/preflight_milestone26_capacity_transport.py

      - name: Run live representative export preflight
        run: python -m scripts.preflight_milestone26_capacity_transport --fetch-sample

      - name: Verify preflight gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('data/manifests/milestone26_capacity_transport_preflight.json').read_text(encoding='utf-8'))
          assert p['schema'] == 'ranah-observatory/milestone26-capacity-transport-preflight/v1'
          assert p['source_id'] == 'inarisk_capacity_2021'
          assert p['reference_year'] == 2021
          assert p['geography_count'] == 19
          assert p['big_boundary_probe_qualified'] is True
          assert p['all_windows_within_imageserver_limits'] is True
          assert p['representative_transport_sample']['performed'] is True
          assert p['representative_transport_sample']['within_single_file_byte_gate'] is True
          assert p['capacity_component_materialized'] is False
          assert p['population_component_reextracted'] is False
          assert p['substantive_interpretation_performed'] is False
          assert p['risk_synthesis_authorized'] is False
          assert p['statistical_model_fit'] is False
          assert p['causal_claim_created'] is False
          assert p['monetary_wasted_potential_estimated'] is False
          PY

      - name: Commit frozen preflight manifest
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- data/manifests/milestone26_capacity_transport_preflight.json; then
            echo 'Capacity preflight manifest unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/manifests/milestone26_capacity_transport_preflight.json
          git commit -m 'm26: freeze capacity transport preflight'
          git push origin HEAD:agent/milestone26-disaster-risk-chain
