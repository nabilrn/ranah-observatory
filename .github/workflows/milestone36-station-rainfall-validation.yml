name: Milestone 36 Station Rainfall Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - research/MILESTONE36_STATION_RAINFALL_VALIDATION_SPEC.md
      - scripts/probe_milestone36_station_archive.py
      - scripts/build_milestone36_station_overlap.py
      - tests/test_milestone36_station_archive.py
      - tests/test_milestone36_station_overlap.py
      - data/validation/climate/station/**
      - data/manifests/milestone36_*.json
      - docs/MILESTONE36_STATION_RAINFALL_VALIDATION.md
      - .github/workflows/milestone36-station-rainfall-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-archive-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require M36 evidence-validation-only scope
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          allowed_exact = {
              '.github/workflows/milestone36-station-rainfall-validation.yml',
              'research/MILESTONE36_STATION_RAINFALL_VALIDATION_SPEC.md',
              'scripts/probe_milestone36_station_archive.py',
              'scripts/build_milestone36_station_overlap.py',
              'tests/test_milestone36_station_archive.py',
              'tests/test_milestone36_station_overlap.py',
              'docs/MILESTONE36_STATION_RAINFALL_VALIDATION.md',
          }
          changed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          offenders = [
              p for p in changed
              if p not in allowed_exact
              and not p.startswith('data/validation/climate/station/')
              and not p.startswith('data/manifests/milestone36_')
          ]
          assert not offenders, offenders
          print({'changed_files': len(changed), 'unauthorized_paths': 0})
          PY

      - name: Run offline station-history and archive-probe tests
        run: python -m unittest tests.test_milestone36_station_archive -v

      - name: Probe BMKG station history guard and NCEI archive representations
        run: |
          mkdir -p artifacts/m36
          python scripts/probe_milestone36_station_archive.py --output artifacts/m36/stage0-station-archive-probe.json

      - name: Enforce Stage 0 fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/m36/stage0-station-archive-probe.json').read_text(encoding='utf-8'))
          c = p['conclusions']
          assert p['locked_candidate_order'] == ['IDM00096163', '96163099999']
          assert p['target_station']['traditional_wmo_identifier'] == '96163'
          assert p['target_station']['target_years'] == [1997, 1998]
          assert c['station_history_break_guard_triggered'] is True, p['bmkg_current_station']
          assert c['precipitation_values_inspected_in_stage0'] is False
          assert c['safe_to_mark_chirps_station_validation_complete'] is False
          assert c['safe_to_merge_96163_across_station_history'] is False
          accepted = c['accepted_stage1_representation']
          assert accepted in {None, 'ncei_daily_summaries_ghcn_IDM00096163', 'ncei_gsod_96163099999'}
          print({
              'ghcn_identity': c['ghcn_historical_identity_qualified'],
              'ghcn_coverage': c['ghcn_1997_1998_coverage_metadata_available'],
              'gsod_identity': c['gsod_historical_identity_qualified_both_years'],
              'accepted_stage1_representation': accepted,
              'stage1_numeric_inspection_authorized': c['stage1_numeric_inspection_authorized'],
          })
          PY

      - name: Require no change to frozen CHIRPS or publication outputs
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code origin/main...HEAD -- \
            data/processed/climate/rainfall \
            publication/v0.1

      - name: Upload Stage 0 qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone36-stage0-station-archive-probe
          path: artifacts/m36/stage0-station-archive-probe.json
          if-no-files-found: ignore
          retention-days: 7
