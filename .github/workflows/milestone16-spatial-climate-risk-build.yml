name: Milestone 16 Spatial Climate Risk Build

on:
  push:
    branches:
      - agent/milestone16-spatial-climate-risk
    paths:
      - "research/MILESTONE16_SPATIAL_CLIMATE_RISK_SPEC.md"
      - "scripts/build_milestone16_spatial_climate_risk.py"
      - ".github/workflows/milestone16-spatial-climate-risk-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone16-spatial-climate-risk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out M16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone16-spatial-climate-risk
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fail-closed spatial/climate component engine
        run: python -m scripts.build_milestone16_spatial_climate_risk

      - name: Commit deterministic M16 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/engine/spatial_climate_risk_v1 data/manifests/milestone16_spatial_climate_risk.json
          if git diff --cached --quiet; then
            echo "Milestone 16 outputs unchanged."
            exit 0
          fi
          git commit -m "research: materialize milestone16 spatial climate evidence"
          git pull --rebase origin agent/milestone16-spatial-climate-risk
          git push origin HEAD:agent/milestone16-spatial-climate-risk
