name: Milestone 8 USGS ShakeMap Probe

on:
  push:
    branches:
      - agent/milestone8-earthquake-quasi-causal
    paths:
      - "scripts/probe_milestone8_usgs_shakemap.py"
      - ".github/workflows/milestone8-usgs-shakemap-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone8-usgs-shakemap-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Milestone 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone8-earthquake-quasi-causal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze exact USGS event and preferred ShakeMap grid
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.probe_milestone8_usgs_shakemap 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 12 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 8 USGS ShakeMap probe failure::$message"
          exit 1

      - name: Verify immutable ShakeMap snapshots
        shell: bash
        run: |
          set -euo pipefail
          dir="data/snapshots/usgs/milestone8/padang-2009"
          (cd "$dir" && sha256sum -c event-query.geojson.sha256)
          (cd "$dir" && sha256sum -c event-detail.geojson.sha256)
          grid="$(find "$dir" -maxdepth 1 -type f -name 'shakemap-grid.*' ! -name '*.sha256' | head -n 1)"
          test -n "$grid"
          (cd "$dir" && sha256sum -c "$(basename "$grid").sha256")

      - name: Commit frozen USGS evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/snapshots/usgs/milestone8 \
            data/manifests/milestone8_usgs_shakemap_probe.json
          if git diff --cached --quiet; then
            echo "Milestone 8 USGS ShakeMap evidence unchanged."
            exit 0
          fi
          git commit -m "data: freeze milestone8 USGS ShakeMap candidate"
          git pull --rebase origin agent/milestone8-earthquake-quasi-causal
          git push origin HEAD:agent/milestone8-earthquake-quasi-causal
