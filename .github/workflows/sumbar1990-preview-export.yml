name: Export Sumbar 1990 Completeness Preview

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar1990-preview-export.yml

permissions:
  contents: write

env:
  PREVIEW: data/validation/historical/sumbar1990/temporary_completeness_preview.pdf

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - name: Require bounded preview
        run: |
          test -f "$PREVIEW"
          size="$(stat -c %s "$PREVIEW")"
          test "$size" -lt 5000000
          echo "preview_bytes=$size"

      - uses: actions/upload-artifact@v4
        with:
          name: sumbar1990-completeness-preview
          path: ${{ env.PREVIEW }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retire exporter
        run: |
          rm .github/workflows/sumbar1990-preview-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sumbar1990-preview-export.yml
          git commit -m 'Retire Sumbar 1990 preview exporter'
          git push origin HEAD:research/evidence
