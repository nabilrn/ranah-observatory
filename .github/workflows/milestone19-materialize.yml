name: Milestone 19 materialize

on:
  push:
    branches:
      - agent/milestone19-dynamic-forecast-engine
    paths:
      - research/MILESTONE19_DYNAMIC_FORECAST_ENGINE_SPEC.md
      - data/manifests/milestone19_design_gate.json
      - scripts/build_milestone19_dynamic_forecast_engine.py
      - tests/test_milestone19_dynamic_forecast_engine.py
      - .github/workflows/milestone19-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build M19 artifacts
        run: python scripts/build_milestone19_dynamic_forecast_engine.py

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused M19 tests
        run: python -m pytest -q tests/test_milestone19_dynamic_forecast_engine.py

      - name: Commit deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/dynamic_forecast_v1/m19-model-frame.csv \
            data/analysis/engine/dynamic_forecast_v1/m19-backtest-predictions.csv \
            data/analysis/engine/dynamic_forecast_v1/m19-target-summary.csv \
            data/analysis/engine/dynamic_forecast_v1/m19-outer-fold-coefficients.csv \
            data/analysis/engine/dynamic_forecast_v1/m19-forecast-2026.csv \
            data/manifests/milestone19_dynamic_forecast_engine.json
          if git diff --cached --quiet; then
            echo "No materialization changes"
            exit 0
          fi
          git commit -m "Materialize Milestone 19 dynamic forecast outputs"
          git push origin HEAD:${GITHUB_REF_NAME}
