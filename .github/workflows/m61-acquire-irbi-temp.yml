name: M61 Acquire IRBI TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/acquire_milestone61_irbi_sumbar_2015_2024.py'
      - 'scripts/finalize_milestone61_irbi_sumbar_2015_2024.py'
      - '.github/workflows/m61-acquire-irbi-temp.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and finalize official IRBI table
        run: |
          python scripts/acquire_milestone61_irbi_sumbar_2015_2024.py
          python scripts/finalize_milestone61_irbi_sumbar_2015_2024.py
      - name: Commit frozen M61 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bnpb/irbi_sumbar_2015_2024 \
                  data/manifests/milestone61_irbi_sumbar_2015_2024_acquisition.json \
                  data/manifests/milestone61_irbi_sumbar_2015_2024_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize M61 IRBI Sumbar 2015-2024'
          git push origin HEAD:research/evidence
