name: M64 Materialize Hazard Actions TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/materialize_milestone64_krb_hazard_actions.py'
      - '.github/workflows/m64-acquire-krb-recommendations-temp.yml'

permissions:
  contents: write

jobs:
  materialize-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize top-level hazard mitigation actions
        run: python scripts/materialize_milestone64_krb_hazard_actions.py
      - name: Commit M64 hazard action outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bnpb/krb_sumbar_2022_2026/krb-hazard-mitigation-actions-2022-2026.csv \
                  data/processed/bnpb/krb_sumbar_2022_2026/krb-hazard-recommendation-context-2022-2026.csv \
                  data/manifests/milestone64_krb_recommendations_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize M64 hazard mitigation actions'
          git push origin HEAD:research/evidence
