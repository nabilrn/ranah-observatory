name: M64 Rebuild Recommendation Sections TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/materialize_milestone64_krb_recommendation_sections.py'
      - '.github/workflows/m64-acquire-krb-recommendations-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild M64 recommendation sections from reading-order evidence
        run: python scripts/materialize_milestone64_krb_recommendation_sections.py
      - name: Commit repaired M64 recommendation sections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bnpb/krb_sumbar_2022_2026/krb-specific-recommendation-sections.csv \
                  data/manifests/milestone64_krb_recommendations_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair M64 recommendation section reading order'
          git push origin HEAD:research/evidence
