name: M64 Register Catalog TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/register_milestone64_catalog_temp.py'
      - '.github/workflows/m64-acquire-krb-recommendations-temp.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register M64 public datasets
        run: python scripts/register_milestone64_catalog_temp.py
      - name: Commit M64 catalog entries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/public-datasets.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Register M64 KRB recommendation datasets'
          git push origin HEAD:research/evidence
