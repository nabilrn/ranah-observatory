name: Milestone 25 DJPK CSV fallback diagnostic

on:
  pull_request:
    paths:
      - scripts/diagnose_milestone25_djpk_csv_fallback.py
      - .github/workflows/milestone25-csv-fallback-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/diagnose_milestone25_djpk_csv_fallback.py
