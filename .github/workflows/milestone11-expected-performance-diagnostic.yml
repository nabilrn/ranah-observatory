name: Milestone 11 Expected Performance Diagnostic

on:
  pull_request:
    paths:
      - "scripts/build_milestone11_expected_performance_v2.py"
      - "research/MILESTONE11_EXPECTED_PERFORMANCE_V2_SPEC.md"
      - "data/manifests/milestone11_design_gate.json"
      - "data/analysis/engine/panel_v1/**"
      - "data/manifests/milestone10_analytical_panel.json"
      - ".github/workflows/milestone11-expected-performance-diagnostic.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build preregistered M11 engine
        run: python -m scripts.build_milestone11_expected_performance_v2

      - name: Require structural M11 footprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/manifests/milestone11_expected_performance_v2.json').read_text())
          assert p['schema'] == 'ranah-observatory/milestone11-expected-performance-v2/v1', p
          assert p['geography_count'] == 19, p
          assert p['target_year_count'] == 6, p
          assert p['model_frame_row_count'] == 114, p
          assert p['crossfit_prediction_count'] == 342, p
          assert p['expected_crossfit_prediction_count'] == 342, p
          assert p['primary_predictions_cross_fitted_by_geography'] is True, p
          assert p['focal_geography_excluded_from_own_model_fit'] is True, p
          assert p['nested_inner_cv_used'] is True, p
          assert p['imputation_performed'] is False, p
          assert p['milestone11_complete'] is True, p
          PY
