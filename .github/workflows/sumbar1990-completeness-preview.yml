name: Sumbar 1990 Official Artifact Completeness Preview

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar1990-completeness-preview.yml

permissions:
  contents: write

env:
  SUMBAR1990_URL: 'https://web-api.bps.go.id/download.php?%3D'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch exact official BPS bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 180 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence acquisition' \
            "$SUMBAR1990_URL" -o /tmp/sumbar1990.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sumbar1990.pdf')
          b = p.read_bytes()
          assert p.stat().st_size > 5_000_000, p.stat().st_size
          assert b.startswith(b'%PDF-')
          assert b'%%EOF' in b[-16384:]
          print({'bytes': p.stat().st_size})
          PY

      - name: Build small visual-completeness preview
        run: |
          python -m pip install --quiet pypdf==6.0.0
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          pdf = Path('/tmp/sumbar1990.pdf')
          reader = PdfReader(str(pdf))
          page_count = len(reader.pages)
          assert page_count > 20, page_count

          chosen = []
          for idx in [0, 1, 2, page_count - 3, page_count - 2, page_count - 1]:
              if 0 <= idx < page_count and idx not in chosen:
                  chosen.append(idx)
          writer = PdfWriter()
          for idx in chosen:
              writer.add_page(reader.pages[idx])

          out_dir = Path('data/validation/historical/sumbar1990')
          out_dir.mkdir(parents=True, exist_ok=True)
          preview = out_dir / 'temporary_completeness_preview.pdf'
          with preview.open('wb') as handle:
              writer.write(handle)

          text_chars = 0
          for page in reader.pages:
              try:
                  text_chars += len(page.extract_text() or '')
              except Exception:
                  pass

          manifest = {
              'schema': 'ranah-observatory/sumbar1990-official-artifact-probe/v1',
              'source': 'Kantor Statistik Provinsi Sumatera Barat + Bappeda TK I Sumatera Barat / BPS',
              'title': 'Sumatera Barat Dalam Angka Tahun 1990',
              'catalog_number': '1102001.13',
              'publication_number': '13000.1991',
              'issn_isbn': '0303-5328',
              'release_date': '1991-09-03',
              'official_page_url': 'https://sumbar.bps.go.id/id/publication/1991/09/03/418d5c50d440245a49e4b21f/sumatera-barat-dalam-angka-tahun-1990.html',
              'official_direct_artifact_url': os.environ['SUMBAR1990_URL'],
              'artifact_sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'artifact_bytes': pdf.stat().st_size,
              'pdf_page_count': page_count,
              'retrieved_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'retrieval_surface': 'web-api.bps.go.id public direct download',
              'raw_pdf_committed': False,
              'builtin_text_char_count': text_chars,
              'temporary_preview_pdf_pages': [i + 1 for i in chosen],
              'temporary_preview_role': 'visual completeness review only; must be deleted before merge',
              'visual_completeness_review_pending': True,
              'full_publication_artifact_acquired': None,
              'numeric_extraction_started': False,
              'numeric_promotion_authorized': False,
          }
          (out_dir / 'artifact_probe_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print({'sha256': manifest['artifact_sha256'], 'bytes': manifest['artifact_bytes'], 'pages': page_count, 'text_chars': text_chars, 'preview_bytes': preview.stat().st_size})
          PY

      - name: Validate preview is bounded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/validation/historical/sumbar1990/artifact_probe_manifest.json').read_text())
          preview = Path('data/validation/historical/sumbar1990/temporary_completeness_preview.pdf')
          assert len(m['artifact_sha256']) == 64
          assert m['artifact_bytes'] > 5_000_000
          assert m['pdf_page_count'] > 20
          assert m['visual_completeness_review_pending'] is True
          assert m['full_publication_artifact_acquired'] is None
          assert m['numeric_promotion_authorized'] is False
          assert preview.stat().st_size < 10_000_000, preview.stat().st_size
          print({'preview': 'bounded', 'bytes': preview.stat().st_size})
          PY

      - name: Commit probe evidence and retire workflow
        run: |
          rm .github/workflows/sumbar1990-completeness-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/historical/sumbar1990/artifact_probe_manifest.json \
            data/validation/historical/sumbar1990/temporary_completeness_preview.pdf \
            .github/workflows/sumbar1990-completeness-preview.yml
          git commit -m 'Stage official Sumbar 1990 completeness review'
          git push origin HEAD:research/evidence
