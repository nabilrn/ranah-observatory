name: Milestone 25 pilot failure diagnostic

on:
  pull_request:
    paths:
      - scripts/diagnose_milestone25_pilot_failures.py
      - .github/workflows/milestone25-pilot-failure-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact source naming for pemda 01 and 10
        run: python scripts/diagnose_milestone25_pilot_failures.py
