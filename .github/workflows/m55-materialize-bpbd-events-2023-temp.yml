name: M55 Materialize BPBD Events 2023 TEMP

on:
  push:
    branches:
      - research/evidence
    paths:
      - 'scripts/acquire_milestone55_bpbd_events_2023.py'
      - 'scripts/finalize_milestone55_bpbd_events_2023.py'
      - '.github/workflows/m55-materialize-bpbd-events-2023-temp.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire official CKAN DataStore table
        run: python scripts/acquire_milestone55_bpbd_events_2023.py

      - name: Finalize canonical district-by-hazard table
        run: python scripts/finalize_milestone55_bpbd_events_2023.py

      - name: Commit deterministic M55 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/processed/bpbd/disaster_events_2023 \
            data/manifests/milestone55_bpbd_events_2023.json \
            data/manifests/milestone55_bpbd_events_2023_final.json
          if git diff --cached --quiet; then
            echo 'No M55 materialization changes'
            exit 0
          fi
          git commit -m 'Finalize BPBD 2023 district-by-hazard events'
          git push origin HEAD:research/evidence
