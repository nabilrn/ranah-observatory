name: Milestone 27 BKPM Period Homogeneity Evidence

on:
  pull_request:
    paths:
      - .github/workflows/milestone27-bkpm-period-homogeneity.yml
      - data/manifests/milestone27_period_homogeneity_contract.json
      - data/manifests/milestone27_bkpm_period_homogeneity_probe.json
      - scripts/probe_milestone27_bkpm_period_homogeneity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-period-homogeneity-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen fail-closed result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone27_bkpm_period_homogeneity_probe.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone27-bkpm-period-homogeneity-probe/v1'
          assert m['pilot_count'] == 3
          assert m['all_pilots_period_homogeneous'] is False
          assert m['source_2025_q2_resource_wide_period_identity_qualified'] is False
          for r in m['pilot_results']:
              assert r['exact_period_filter']['records_filtered'] == r['baseline_records_total']
              assert r['negative_control_filter']['records_filtered'] == r['baseline_records_total']
              assert r['period_homogeneous'] is False
              assert r['data_array_elements_inspected'] is False
              assert r['target_investment_values_inspected'] is False
          assert m['target_investment_values_inspected'] is False
          assert m['non_period_observation_values_inspected'] is False
          assert m['annual_sum_authorized'] is False
          PY
