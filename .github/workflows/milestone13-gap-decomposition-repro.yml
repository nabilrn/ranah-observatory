name: Milestone 13 Gap Decomposition Reproducibility

on:
  pull_request:
    paths:
      - ".github/workflows/milestone13-gap-decomposition-repro.yml"
      - "research/MILESTONE13_DEVELOPMENT_GAP_DECOMPOSITION_SPEC.md"
      - "scripts/build_milestone13_development_gap_decomposition.py"
      - "scripts/audit_milestone13_development_gap_decomposition.py"
      - "tests/test_milestone13_development_gap_decomposition.py"
      - "docs/MILESTONE13_DEVELOPMENT_GAP_DECOMPOSITION.md"
      - "data/manifests/milestone13_design_gate.json"
      - "data/manifests/milestone13_development_gap_decomposition.json"
      - "data/analysis/engine/gap_decomposition_v1/**"
      - "data/analysis/engine/frontier_v1/**"
      - "data/analysis/engine/expected_performance_v2/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/milestone13-gap-decomposition-repro.yml"
      - "research/MILESTONE13_DEVELOPMENT_GAP_DECOMPOSITION_SPEC.md"
      - "scripts/build_milestone13_development_gap_decomposition.py"
      - "scripts/audit_milestone13_development_gap_decomposition.py"
      - "tests/test_milestone13_development_gap_decomposition.py"
      - "docs/MILESTONE13_DEVELOPMENT_GAP_DECOMPOSITION.md"
      - "data/manifests/milestone13_design_gate.json"
      - "data/manifests/milestone13_development_gap_decomposition.json"
      - "data/analysis/engine/gap_decomposition_v1/**"
      - "data/analysis/engine/frontier_v1/**"
      - "data/analysis/engine/expected_performance_v2/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Research Foundation 9/9 remains complete
        run: python -m scripts.audit_research_foundation_complete --require-complete

      - name: Require Milestone 10 remains complete
        run: python -m scripts.audit_milestone10_analytical_panel --require-complete

      - name: Require Milestone 11 remains complete
        run: python -m scripts.audit_milestone11_expected_performance_v2 --require-complete

      - name: Require Milestone 12 remains complete
        run: python -m scripts.audit_milestone12_attainable_frontier --require-complete

      - name: Rebuild Milestone 13 gap decomposition
        run: python -m scripts.build_milestone13_development_gap_decomposition

      - name: Enforce Milestone 13 completion audit
        run: python -m scripts.audit_milestone13_development_gap_decomposition --require-complete

      - name: Run Milestone 13 focused tests
        run: python -m unittest tests.test_milestone13_development_gap_decomposition -v

      - name: Revalidate canonical data foundation
        run: python scripts/validate_data_foundation.py

      - name: Revalidate historical reconstruction foundation
        run: python scripts/validate_historical_reconstruction.py

      - name: Require byte-identical committed M13 outputs
        run: |
          git diff --exit-code -- \
            data/analysis/engine/gap_decomposition_v1 \
            data/manifests/milestone13_development_gap_decomposition.json
