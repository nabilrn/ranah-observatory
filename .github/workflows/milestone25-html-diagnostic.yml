name: Milestone 25 DJPK HTML diagnostic

on:
  pull_request:
    paths:
      - scripts/diagnose_milestone25_djpk_html.py
      - .github/workflows/milestone25-html-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect current DJPK 2024 Kota Padang HTML structure
        run: python scripts/diagnose_milestone25_djpk_html.py
