name: Milestone 8 GRDP Anomaly Resolution

on:
  push:
    branches:
      - agent/milestone8-earthquake-quasi-causal
    paths:
      - "scripts/resolve_milestone8_grdp_source_anomalies.py"
      - "data/processed/milestone8/anomaly_crosschecks/**"
      - "data/analysis/quasi_causal/m8-real-grdp-panel-2005-2013.csv"
      - ".github/workflows/milestone8-grdp-anomaly-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone8-grdp-anomaly-resolution
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Milestone 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone8-earthquake-quasi-causal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve source anomalies from frozen local BPS text
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.resolve_milestone8_grdp_source_anomalies 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 16 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 8 GRDP anomaly resolution failure::$message"
          exit 1

      - name: Commit deterministic resolution and resolved panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/quasi_causal/m8-grdp-source-anomaly-resolution.csv \
            data/analysis/quasi_causal/m8-real-grdp-panel-2005-2013-resolved.csv \
            data/manifests/milestone8_grdp_source_anomaly_resolution.json
          if git diff --cached --quiet; then
            echo "Milestone 8 GRDP anomaly resolution unchanged."
            exit 0
          fi
          git commit -m "data: resolve M8 GRDP source anomalies"
          git pull --rebase origin agent/milestone8-earthquake-quasi-causal
          git push origin HEAD:agent/milestone8-earthquake-quasi-causal
