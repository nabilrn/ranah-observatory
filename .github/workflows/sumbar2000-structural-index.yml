name: Sumbar 2000 Structural Discovery Index

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar2000-structural-index.yml

permissions:
  contents: write

env:
  SUMBAR2000_URL: 'https://web-api.bps.go.id/download.php?f=LohU2NCB0%2BCnYSh%%3D'
  EXPECTED_SHA256: '689318d0760f99ff82a54866295b580a0159ed0e39051b4342b8b7e9d13648cf'

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch exact frozen artifact
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 240 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence acquisition' \
            "$SUMBAR2000_URL" -o /tmp/sumbar2000.pdf
          test "$(sha256sum /tmp/sumbar2000.pdf | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Extract built-in text layer only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -layout /tmp/sumbar2000.pdf /tmp/sumbar2000.txt
          test "$(wc -c < /tmp/sumbar2000.txt)" -gt 500000

      - name: Build bounded discovery index
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          page_count = 646
          raw = Path('/tmp/sumbar2000.txt').read_text(encoding='utf-8', errors='replace')
          chunks = raw.split('\f')[:page_count]
          assert len(chunks) == page_count, len(chunks)

          domains = {
              'population': ['penduduk', 'population'],
              'education': ['sekolah', 'murid', 'guru', 'education'],
              'health': ['rumah sakit', 'puskesmas', 'dokter', 'health'],
              'agriculture': ['padi', 'rice', 'pertanian', 'agriculture'],
              'industry': ['industri', 'industry'],
              'public_finance': ['keuangan', 'anggaran', 'budget', 'finance'],
              'transport': ['kendaraan', 'jalan', 'pelabuhan', 'transport'],
              'trade': ['perdagangan', 'ekspor', 'impor', 'trade'],
          }

          def compact_snippet(text: str, terms: list[str]) -> str:
              lines = [' '.join(line.split()) for line in text.splitlines() if line.strip()]
              low_terms = [t.lower() for t in terms]
              for i, line in enumerate(lines):
                  low = line.lower()
                  if any(t in low for t in low_terms):
                      start = max(0, i - 1)
                      end = min(len(lines), i + 3)
                      return ' | '.join(lines[start:end])[:700]
              return ' | '.join(lines[:3])[:700]

          result = {}
          for domain, terms in domains.items():
              matches = []
              for page_no, text in enumerate(chunks, start=1):
                  low = text.lower()
                  found = [t for t in terms if t in low]
                  if not found:
                      continue
                  matches.append({
                      'pdf_page': page_no,
                      'matched_terms': found,
                      'snippet': compact_snippet(text, found),
                  })
                  if len(matches) >= 12:
                      break
              result[domain] = matches

          out = {
              'schema': 'ranah-observatory/sumbar2000-structural-discovery-index/v1',
              'artifact_sha256': '689318d0760f99ff82a54866295b580a0159ed0e39051b4342b8b7e9d13648cf',
              'source_pdf_page_count': page_count,
              'text_layer_char_count': len(raw),
              'extraction_method': 'pdftotext-layout-built-in-text-layer-only-no-ocr',
              'evidentiary_role': 'page/table discovery only; snippets are not canonical numeric observations',
              'numeric_promotion_authorized': False,
              'domains': result,
          }
          path = Path('data/validation/historical/sumbar2000/structural_index.json')
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          total = sum(len(v) for v in result.values())
          assert total >= 20, total
          assert result['population']
          assert result['industry']
          print({'domain_matches': {k: len(v) for k, v in result.items()}, 'total_matches': total})
          PY

      - name: Validate bounded index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/validation/historical/sumbar2000/structural_index.json')
          x = json.loads(p.read_text())
          assert x['artifact_sha256'] == '689318d0760f99ff82a54866295b580a0159ed0e39051b4342b8b7e9d13648cf'
          assert x['source_pdf_page_count'] == 646
          assert x['text_layer_char_count'] > 500000
          assert x['numeric_promotion_authorized'] is False
          assert 'no-ocr' in x['extraction_method']
          for rows in x['domains'].values():
              assert len(rows) <= 12
          PY

      - name: Commit index and retire one-time workflow
        run: |
          rm .github/workflows/sumbar2000-structural-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/historical/sumbar2000/structural_index.json \
            .github/workflows/sumbar2000-structural-index.yml
          git commit -m 'Materialize bounded Sumbar 2000 structural index'
          git push origin HEAD:research/evidence
