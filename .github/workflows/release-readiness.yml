name: Final Release Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - docs/FINAL_10_DAY_DELIVERY.md
      - docs/FINAL_OPEN_GATES.md
      - docs/FINAL_MODEL_VALIDATION.md
      - docs/PRODUCT_V0_1_SPEC.md
      - publication/v0.1/**
      - publication/final-open-gates.json
      - publication/pages-deployment.json
      - site/**
      - data/manifests/milestone11_expected_performance_v2.json
      - data/manifests/milestone19_dynamic_forecast_engine.json
      - scripts/validate_public_product.py
      - scripts/validate_public_readiness.py
      - scripts/validate_public_history.py
      - scripts/validate_final_model_testing.py
      - scripts/validate_final_open_gates.py
      - scripts/validate_release_readiness.py
      - tests/test_final_model_testing.py
      - tests/test_final_open_gates.py
      - tests/test_release_readiness.py
      - .github/workflows/milestone11-expected-performance-repro.yml
      - .github/workflows/milestone19-dynamic-forecast-repro.yml
      - .github/workflows/deploy-public-product.yml
      - .github/workflows/release-readiness.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/FINAL_10_DAY_DELIVERY.md
      - docs/FINAL_OPEN_GATES.md
      - docs/FINAL_MODEL_VALIDATION.md
      - docs/PRODUCT_V0_1_SPEC.md
      - publication/v0.1/**
      - publication/final-open-gates.json
      - publication/pages-deployment.json
      - site/**
      - data/manifests/milestone11_expected_performance_v2.json
      - data/manifests/milestone19_dynamic_forecast_engine.json
      - scripts/validate_public_product.py
      - scripts/validate_public_readiness.py
      - scripts/validate_public_history.py
      - scripts/validate_final_model_testing.py
      - scripts/validate_final_open_gates.py
      - scripts/validate_release_readiness.py
      - tests/test_final_model_testing.py
      - tests/test_final_open_gates.py
      - tests/test_release_readiness.py
      - .github/workflows/milestone11-expected-performance-repro.yml
      - .github/workflows/milestone19-dynamic-forecast-repro.yml
      - .github/workflows/deploy-public-product.yml
      - .github/workflows/release-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate final model testing contract
        run: python scripts/validate_final_model_testing.py

      - name: Validate final open gate classification
        run: python scripts/validate_final_open_gates.py

      - name: Validate final repository-internal release readiness
        run: python scripts/validate_release_readiness.py

      - name: Run finalization regression tests
        run: |
          python -m unittest tests.test_final_model_testing -v
          python -m unittest tests.test_final_open_gates -v
          python -m unittest tests.test_release_readiness -v

      - name: Confirm Pages deployment is recorded as resolved
        run: |
          grep -q 'https://nabilrn.github.io/ranah-observatory/' docs/FINAL_10_DAY_DELIVERY.md
          grep -q '"deploy_pages": "success"' publication/pages-deployment.json
          grep -q '"must_close_blocked_external": 0' publication/final-open-gates.json
          grep -q 'enablement: true' .github/workflows/deploy-public-product.yml
