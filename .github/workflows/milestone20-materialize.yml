name: Milestone 20 materialize

on:
  push:
    branches:
      - agent/milestone20-historical-climate-trend
    paths:
      - research/MILESTONE20_HISTORICAL_CLIMATE_TREND_SPEC.md
      - data/manifests/milestone20_design_gate.json
      - scripts/build_milestone20_historical_climate_trend.py
      - tests/test_milestone20_historical_climate_trend.py
      - .github/workflows/milestone20-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build M20 artifacts
        run: python scripts/build_milestone20_historical_climate_trend.py

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused M20 tests
        run: python -m pytest -q tests/test_milestone20_historical_climate_trend.py

      - name: Commit deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/historical_climate_trend_v1/m20-geography-trends.csv \
            data/analysis/engine/historical_climate_trend_v1/m20-leave-one-year-out.csv \
            data/analysis/engine/historical_climate_trend_v1/m20-regional-annual-mean.csv \
            data/analysis/engine/historical_climate_trend_v1/m20-regional-trend.csv \
            data/manifests/milestone20_historical_climate_trend.json
          if git diff --cached --quiet; then
            echo "No materialization changes"
            exit 0
          fi
          git commit -m "Materialize Milestone 20 historical climate trend outputs"
          git push origin HEAD:${GITHUB_REF_NAME}
