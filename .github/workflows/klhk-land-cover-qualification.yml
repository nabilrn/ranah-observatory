name: KLHK land-cover qualification

on:
  push:
    branches: [main]
    paths:
      - scripts/probe_klhk_land_cover_2022.py
      - scripts/probe_forestry_land_cover_publications.py
      - scripts/materialize_forestry_land_cover_sumbar.py
      - .github/workflows/klhk-land-cover-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klhk-land-cover-qualification-main
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.16.2
      - name: Probe official forestry transport paths
        run: python scripts/probe_klhk_land_cover_2022.py
      - name: Inspect official 2022 and 2023 land-cover publication tables
        run: python scripts/probe_forestry_land_cover_publications.py
      - name: Validate province-level Sumbar land-cover materialization
        run: python scripts/materialize_forestry_land_cover_sumbar.py
