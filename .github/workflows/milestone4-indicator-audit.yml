name: Milestone 4 Indicator Audit

on:
  pull_request:
    paths:
      - "data/processed/**"
      - "data/registries/indicators.csv"
      - "data/manifests/milestone4_indicator_inventory.json"
      - "scripts/audit_milestone4_indicators.py"
      - ".github/workflows/milestone4-indicator-audit.yml"
  push:
    branches:
      - main
    paths:
      - "data/processed/**"
      - "data/registries/indicators.csv"
      - "data/manifests/milestone4_indicator_inventory.json"
      - "scripts/audit_milestone4_indicators.py"
      - ".github/workflows/milestone4-indicator-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild provenance-resolved Milestone 4 inventory
        run: >-
          python scripts/audit_milestone4_indicators.py
          --output /tmp/milestone4_indicator_inventory.json
          --require-complete

      - name: Require committed inventory snapshot to be current
        run: cmp /tmp/milestone4_indicator_inventory.json data/manifests/milestone4_indicator_inventory.json

      - name: Enforce integrity guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('/tmp/milestone4_indicator_inventory.json').read_text())
          assert 40 <= p['qualified_indicator_count'] <= 60, p
          assert p['remaining_to_minimum'] == 0, p
          assert p['milestone4_complete'] is True, p
          assert p['duplicate_observation_ids'] == [], p
          assert p['unresolved_provenance'] == [], p
          assert p['unregistered_observed_indicator_ids'] == [], p
          PY
