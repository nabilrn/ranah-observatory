name: Milestone 25 DJPK full Stage 1 probe

on:
  pull_request:
    paths:
      - scripts/probe_milestone25_djpk_stage1.py
      - scripts/lock_milestone25_stage1_contracts.py
      - .github/workflows/milestone25-stage1-full-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run M25 offline tests
        run: >-
          python -m pytest -q
          tests/test_milestone25_djpk_taxonomy.py
          tests/test_milestone25_djpk_stage1.py
      - name: Rebuild Stage 0 taxonomy before any cross-geography probe
        run: python scripts/probe_milestone25_djpk_taxonomy.py
      - name: Lock exact-label fiscal contracts
        run: python scripts/lock_milestone25_stage1_contracts.py
      - name: Pilot gate — all 19 pemda, 2024 only
        run: >-
          python scripts/probe_milestone25_djpk_stage1.py
          --years 2024
          --coverage /tmp/m25-pilot/coverage.csv
          --values /tmp/m25-pilot/values.csv
          --manifest /tmp/m25-pilot/manifest.json
          --raw-dir /tmp/m25-pilot/raw
      - name: Assert pilot passes before full probe
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          m = json.loads(Path('/tmp/m25-pilot/manifest.json').read_text())
          with Path('/tmp/m25-pilot/coverage.csv').open(newline='', encoding='utf-8') as h:
              coverage = list(csv.DictReader(h))
          assert m['years'] == [2024]
          assert m['jurisdiction_year_page_count'] == 19
          assert m['all_pages_pass'] is True
          assert len(coverage) == 19
          assert all(r['page_pass'] == 'True' for r in coverage)
          assert m['cross_geography_probe_completed_after_contract_lock'] is True
          assert m['explicit_bridge_used'] is False
          PY
      - name: Full Stage 1 probe — 19 pemda × 2018-2025
        run: >-
          python scripts/probe_milestone25_djpk_stage1.py
          --years 2018 2019 2020 2021 2022 2023 2024 2025
          --coverage /tmp/m25-full/m25-stage1-full-coverage.csv
          --values /tmp/m25-full/m25-stage1-full-values.csv
          --manifest /tmp/m25-full/milestone25_stage1_full_probe.json
          --raw-dir /tmp/m25-full/raw
      - name: Assert full exact-label footprint
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          m = json.loads(Path('/tmp/m25-full/milestone25_stage1_full_probe.json').read_text())
          with Path('/tmp/m25-full/m25-stage1-full-coverage.csv').open(newline='', encoding='utf-8') as h:
              coverage = list(csv.DictReader(h))
          with Path('/tmp/m25-full/m25-stage1-full-values.csv').open(newline='', encoding='utf-8') as h:
              values = list(csv.DictReader(h))
          assert m['years'] == list(range(2018, 2026))
          assert m['geography_count'] == 19
          assert m['jurisdiction_year_page_count'] == 152
          assert m['all_pages_pass'] is True
          assert len(coverage) == 152
          assert all(r['page_pass'] == 'True' for r in coverage)
          assert len(values) == 152 * m['promoted_exact_label_family_count']
          assert m['cross_geography_probe_completed_after_contract_lock'] is True
          assert m['explicit_bridge_used'] is False
          assert m['derived_ratio_created'] is False
          assert m['imputation_performed'] is False
          assert m['statistical_model_fit'] is False
          PY
      - name: Upload full credential-free DJPK probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone25-djpk-stage1-full
          path: /tmp/m25-full
          if-no-files-found: error
          retention-days: 14
