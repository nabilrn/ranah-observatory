name: M67 Product Preflight TEMP

on:
  push:
    branches: [release/publication]
    paths:
      - '.github/workflows/m67-wire-mitigation-plan-temp.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/publication
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type and Svelte checks
        run: npm run check
      - name: Build static product with v5 data promotion
        run: npm run build
      - name: Validate generated public v5 artifact
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('web/static/data/disaster-summary.json').read_text(encoding='utf-8'))
          assert data['schema'] == 'ranah-observatory/public-disaster-summary/v5'
          assert data['risk_mitigation_2024']['risk']['row_count'] == 124
          assert data['risk_mitigation_2024']['recommendations']['action_count'] == 49
          plan = data['mitigation_plan_2026']
          assert plan['plan_year'] == 2026
          assert plan['targets']['count'] == 13
          assert plan['gaps']['count'] == 18
          assert plan['boundaries']['targets_are_forward_planning_commitments'] is True
          assert plan['boundaries']['gaps_are_official_qualitative_diagnostics'] is True
          for key in (
              'targets_are_actual_achievements',
              'gaps_are_numeric_capacity_scores',
              'municipality_gap_attribution_authorized',
              'prediction_claim_authorized',
              'unmitigated_probability_inference_authorized',
          ):
              assert plan['boundaries'][key] is False
          print({'schema': data['schema'], 'targets': 13, 'gaps': 18})
          PY
