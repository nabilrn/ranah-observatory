name: M67 Forward Compatibility Repair TEMP

on:
  push:
    branches: [release/publication]
    paths:
      - '.github/workflows/m67-wire-mitigation-plan-temp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/publication
      - name: Patch M66 validator for successor public schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_public_disaster_risk_mitigation.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'EXPECTED_SCHEMA = "ranah-observatory/public-disaster-summary/v4"',
                  'PUBLIC_SCHEMA_PREFIX = "ranah-observatory/public-disaster-summary/v"',
              ),
              (
                  '    require(public.get("schema") == EXPECTED_SCHEMA, f"M66 public schema drift: {public.get(\'schema\')!r}")',
                  '    schema = public.get("schema", "")\n    require(schema.startswith(PUBLIC_SCHEMA_PREFIX), f"M66 public schema namespace drift: {schema!r}")\n    require(int(schema.removeprefix(PUBLIC_SCHEMA_PREFIX)) >= 4, f"M66 risk layer requires public schema v4+, got {schema!r}")',
              ),
              (
                  '    require(data_script.endswith("python3 ../scripts/promote_public_disaster_risk_mitigation.py"), "M66 promoter missing from web data chain")',
                  '    require("python3 ../scripts/promote_public_disaster_risk_mitigation.py" in data_script, "M66 promoter missing from web data chain")',
              ),
              (
                  '    require(EXPECTED_SCHEMA in PAGE_TS.read_text(encoding="utf-8"), "M66 page loader does not require v4")',
                  '    require(PUBLIC_SCHEMA_PREFIX in PAGE_TS.read_text(encoding="utf-8"), "M66 page loader schema guard missing")',
              ),
              (
                  '        "schema": EXPECTED_SCHEMA,',
                  '        "schema": public["schema"],',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'M66 validator patch marker drift: {old[:72]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit forward-compatible M66 validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_public_disaster_risk_mitigation.py
          git commit -m 'Allow M66 validation under successor public schemas'
          git push origin HEAD:release/publication
