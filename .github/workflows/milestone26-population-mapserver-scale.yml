name: Milestone 26 population MapServer scale

on:
  pull_request:
    paths:
      - data/manifests/milestone26_population_mapserver_scale_contract.json
      - scripts/probe_milestone26_population_mapserver_scale.py
      - tests/test_milestone26_population_mapserver_scale.py
      - .github/workflows/milestone26-population-mapserver-scale.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-scale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile scale probe
        run: python -m py_compile scripts/probe_milestone26_population_mapserver_scale.py

      - name: Run locked tests before live probe
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_milestone26_population_mapserver_scale.py

      - name: Probe 16, repeated 64, and 128 point batches
        run: python -m scripts.probe_milestone26_population_mapserver_scale

      - name: Assert diagnostic boundaries and frozen evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('data/manifests/milestone26_population_mapserver_scale.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-population-mapserver-scale/v1'
          assert manifest['accepted_pixel_field'] == 'Stretch.Pixel Value'
          assert len(manifest['attempts']) == 4
          assert set(manifest['batch_summary']) == {'16', '64', '128'}
          assert manifest['stage1_population_aggregation_authorized'] is False
          assert manifest['numeric_aggregation_performed'] is False
          assert manifest['substantive_value_promotion_performed'] is False
          assert manifest['cross_geography_numeric_extraction_performed'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          if manifest['production_batch_transport_qualified']:
              assert manifest['qualified_production_batch_size'] == 64
              assert manifest['reproducibility_64']['both_attempts_passed'] is True
              assert manifest['reproducibility_64']['point_value_mapping_reproducible'] is True
          else:
              assert manifest['qualified_production_batch_size'] is None
          for attempt in manifest['attempts']:
              response = attempt['response']
              evidence = Path(response['body_path'])
              assert evidence.exists()
              assert hashlib.sha256(evidence.read_bytes()).hexdigest() == response['body_sha256']
          PY

      - name: Re-run focused tests after live probe
        run: python -m pytest -q tests/test_milestone26_population_mapserver_scale.py

      - name: Commit frozen scale evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            data/processed/bnpb/m26_population_mapserver_scale \
            data/manifests/milestone26_population_mapserver_scale.json
          if git diff --cached --quiet; then
            echo 'No MapServer scale evidence changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 population MapServer scale"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
