name: Milestone 26 Stage 2 BNPB CKAN 2024 resource discovery

on:
  pull_request:
    paths:
      - scripts/harvest_bnpb.py
      - scripts/bnpb_client.py
      - scripts/build_milestone26_stage2_ckan_resource_catalog_2024.py
      - data/manifests/milestone26_stage2_ckan_resource_discovery_2024_amendment.json
      - .github/workflows/milestone26-stage2-ckan-resource-discovery-2024.yml
  push:
    branches:
      - agent/milestone26-disaster-risk-chain
    paths:
      - scripts/build_milestone26_stage2_ckan_resource_catalog_2024.py
      - data/manifests/milestone26_stage2_ckan_resource_discovery_2024_amendment.json
      - .github/workflows/milestone26-stage2-ckan-resource-discovery-2024.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile metadata discovery tools
        run: |
          python -m py_compile scripts/bnpb_client.py
          python -m py_compile scripts/harvest_bnpb.py
          python -m py_compile scripts/build_milestone26_stage2_ckan_resource_catalog.py
          python -m py_compile scripts/build_milestone26_stage2_ckan_resource_catalog_2024.py
      - name: Freeze dedicated 2024 official BNPB package metadata only
        run: |
          python scripts/harvest_bnpb.py \
            --output data/processed/bnpb/m26_stage2_ckan_discovery_2024/package-metadata.json \
            package --id 36d9a6b5-9755-4515-8f8d-16e29843abc4
      - name: Build value-blind 2024 resource catalog
        run: python -m scripts.build_milestone26_stage2_ckan_resource_catalog_2024
      - name: Verify discovery remains metadata-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone26_stage2_ckan_resource_discovery_2024.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone26-stage2-ckan-resource-discovery-2024/v1'
          assert m['package_id'] == '36d9a6b5-9755-4515-8f8d-16e29843abc4'
          assert m['resource_count'] > 0
          assert m['package_metadata_only'] is True
          assert m['datastore_records_retrieved'] is False
          assert m['resource_files_downloaded'] is False
          assert m['target_impact_values_inspected'] is False
          assert m['resource_selected_for_promotion'] is False
          assert m['impact_aggregation_performed'] is False
          assert m['blank_interpreted_as_zero'] is False
          assert m['automatic_duplicate_collapse_performed'] is False
          assert m['risk_synthesis_authorized'] is False
          assert m['statistical_model_fit'] is False
          assert m['causal_claim_created'] is False
          assert m['monetary_loss_inferred'] is False
          assert m['monetary_wasted_potential_estimated'] is False
          PY
      - name: Commit frozen 2024 package metadata and catalog
        run: |
          git add \
            data/processed/bnpb/m26_stage2_ckan_discovery_2024/package-metadata.json \
            data/processed/bnpb/m26_stage2_ckan_discovery_2024/package-metadata.json.sha256 \
            data/analysis/engine/disaster_risk_chain_v1/m26-stage2-ckan-resource-catalog-2024.json \
            data/manifests/milestone26_stage2_ckan_resource_discovery_2024.json
          if git diff --cached --quiet; then
            echo 'Dedicated 2024 CKAN resource metadata unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm26: freeze dedicated 2024 BNPB CKAN resource metadata'
          git push origin HEAD:agent/milestone26-disaster-risk-chain
