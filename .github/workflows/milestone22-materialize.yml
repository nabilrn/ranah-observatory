name: Milestone 22 materialize

on:
  push:
    branches:
      - agent/milestone22-hierarchical-socioeconomic-trajectory
    paths:
      - research/MILESTONE22_HIERARCHICAL_SOCIOECONOMIC_TRAJECTORY_SPEC.md
      - data/manifests/milestone22_design_gate.json
      - scripts/build_milestone22_hierarchical_socioeconomic_trajectory.py
      - tests/test_milestone22_hierarchical_socioeconomic_trajectory.py
      - .github/workflows/milestone22-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build M22 artifacts
        run: python scripts/build_milestone22_hierarchical_socioeconomic_trajectory.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused M22 tests
        run: python -m pytest -q tests/test_milestone22_hierarchical_socioeconomic_trajectory.py
      - name: Commit deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/hierarchical_trajectory_v1/m22-model-frame.csv \
            data/analysis/engine/hierarchical_trajectory_v1/m22-outer-predictions.csv \
            data/analysis/engine/hierarchical_trajectory_v1/m22-indicator-summary.csv \
            data/analysis/engine/hierarchical_trajectory_v1/m22-geography-trajectories.csv \
            data/analysis/engine/hierarchical_trajectory_v1/m22-loo-slopes.csv \
            data/manifests/milestone22_hierarchical_socioeconomic_trajectory.json
          if git diff --cached --quiet; then
            echo "No materialization changes"
            exit 0
          fi
          git commit -m "Materialize Milestone 22 hierarchical trajectory outputs"
          git push origin HEAD:${GITHUB_REF_NAME}
