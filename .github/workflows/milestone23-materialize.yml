name: Milestone 23 materialize

on:
  push:
    branches:
      - agent/milestone23-data-value-model-readiness
    paths:
      - research/MILESTONE23_DATA_VALUE_MODEL_READINESS_SPEC.md
      - data/registries/m23-official-source-candidates.csv
      - scripts/build_milestone23_data_value_model_readiness.py
      - tests/test_milestone23_data_value_model_readiness.py
      - .github/workflows/milestone23-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_milestone23_data_value_model_readiness.py
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_milestone23_data_value_model_readiness.py
      - name: Freeze deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/engine/data_value_readiness_v1 data/manifests/milestone23_data_value_model_readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize Milestone 23 data-value readiness outputs"
          git push origin HEAD:${GITHUB_REF_NAME}
