name: Milestone 8 ShakeMap Exposure Candidate

on:
  push:
    branches:
      - agent/milestone8-earthquake-quasi-causal
    paths:
      - "scripts/build_milestone8_shakemap_exposure_candidate.py"
      - "scripts/probe_big_sumbar_boundaries.py"
      - "data/snapshots/usgs/milestone8/**"
      - "data/manifests/milestone8_usgs_shakemap_probe.json"
      - "data/registries/big_geography_map.csv"
      - ".github/workflows/milestone8-shakemap-exposure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone8-shakemap-exposure
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Milestone 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone8-earthquake-quasi-causal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spatial dependencies
        run: python -m pip install numpy==2.3.5 shapely==2.1.2

      - name: Build 19-geography physical shaking candidate
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.build_milestone8_shakemap_exposure_candidate 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 12 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 8 ShakeMap exposure failure::$message"
          exit 1

      - name: Commit frozen geometry and derived exposure candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/snapshots/big/milestone8/big-june-2026-sumbar.geojson \
            data/analysis/quasi_causal/m8-shakemap-exposure-candidate.csv \
            data/manifests/milestone8_shakemap_exposure_candidate.json
          if git diff --cached --quiet; then
            echo "Milestone 8 ShakeMap exposure candidate unchanged."
            exit 0
          fi
          git commit -m "data: build milestone8 physical shaking exposure candidate"
          git pull --rebase origin agent/milestone8-earthquake-quasi-causal
          git push origin HEAD:agent/milestone8-earthquake-quasi-causal
