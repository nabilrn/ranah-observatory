name: Milestone 9 Hydroclimate Build

on:
  push:
    branches:
      - agent/milestone9-hydroclimate-case-study
    paths:
      - "scripts/build_milestone9_hydroclimate_case_study.py"
      - "research/MILESTONE9_HYDROCLIMATE_CASE_STUDY_SPEC.md"
      - "data/manifests/milestone9_design_gate.json"
      - ".github/workflows/milestone9-hydroclimate-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone9-hydroclimate-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Milestone 9 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone9-hydroclimate-case-study
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build preregistered case study
        run: python -m scripts.build_milestone9_hydroclimate_case_study

      - name: Commit deterministic analysis outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/climate_disaster data/manifests/milestone9_hydroclimate_case_study.json
          if git diff --cached --quiet; then
            echo "Milestone 9 analysis unchanged."
            exit 0
          fi
          git commit -m "analysis: materialize milestone9 hydroclimate case study"
          git pull --rebase origin agent/milestone9-hydroclimate-case-study
          git push origin HEAD:agent/milestone9-hydroclimate-case-study
