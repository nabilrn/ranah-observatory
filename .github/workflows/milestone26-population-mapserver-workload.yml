name: Milestone 26 population MapServer workload

on:
  pull_request:
    paths:
      - data/manifests/milestone26_population_mapserver_workload_contract.json
      - scripts/build_milestone26_population_mapserver_workload.py
      - tests/test_milestone26_population_mapserver_workload.py
      - .github/workflows/milestone26-population-mapserver-workload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  size-workload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused spatial dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy shapely pyproj rasterio

      - name: Compile workload builder
        run: python -m py_compile scripts/build_milestone26_population_mapserver_workload.py

      - name: Run geometry-only tests
        run: python -m pytest -q tests/test_milestone26_population_mapserver_workload.py

      - name: Build exact 19-geography workload sizing
        run: python -m scripts.build_milestone26_population_mapserver_workload

      - name: Assert geometry-only workload boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/manifests/milestone26_population_mapserver_workload.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-population-mapserver-workload/v1'
          assert manifest['geography_count'] == 19
          assert len(manifest['geographies']) == 19
          assert manifest['batch64_qualified'] is True
          assert manifest['source_values_accessed'] is False
          assert manifest['numeric_source_value_extraction_performed'] is False
          assert manifest['stage1_population_aggregation_authorized'] is False
          assert manifest['substantive_value_promotion_performed'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          assert all(row['inside_boundary_native_cell_count'] > 0 for row in manifest['geographies'])
          assert sum(row['inside_boundary_native_cell_count'] for row in manifest['geographies']) == manifest['totals']['inside_boundary_native_cell_count']
          assert sum(row['batch64_request_count_ceiling'] for row in manifest['geographies']) == manifest['totals']['batch64_request_count_ceiling']
          PY

      - name: Re-run focused tests
        run: python -m pytest -q tests/test_milestone26_population_mapserver_workload.py

      - name: Commit frozen workload sizing
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/manifests/milestone26_population_mapserver_workload.json
          if git diff --cached --quiet; then
            echo 'No workload sizing changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 population MapServer workload"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
