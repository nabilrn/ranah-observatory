name: Milestone 58 BPBD Events 2024

on:
  pull_request:
    paths:
      - 'data/manifests/milestone58_bpbd_events_2024*.json'
      - 'data/processed/bpbd/disaster_events_2024/**'
      - 'scripts/acquire_milestone58_bpbd_events_2024.py'
      - 'scripts/finalize_milestone58_bpbd_events_2024.py'
      - 'scripts/validate_milestone58_bpbd_events_2024.py'
      - 'tests/test_milestone58_bpbd_events_2024.py'
      - 'research/MILESTONE58_BPBD_EVENTS_2024.md'
      - 'catalog/public-datasets.csv'
      - '.github/workflows/milestone58-bpbd-events-2024.yml'
  push:
    branches:
      - main
    paths:
      - 'data/manifests/milestone58_bpbd_events_2024*.json'
      - 'data/processed/bpbd/disaster_events_2024/**'
      - 'scripts/finalize_milestone58_bpbd_events_2024.py'
      - 'scripts/validate_milestone58_bpbd_events_2024.py'
      - 'tests/test_milestone58_bpbd_events_2024.py'
      - 'research/MILESTONE58_BPBD_EVENTS_2024.md'
      - 'catalog/public-datasets.csv'
      - '.github/workflows/milestone58-bpbd-events-2024.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen M58 materialization
        run: python scripts/validate_milestone58_bpbd_events_2024.py

      - name: Run focused M58 test
        run: python -m unittest tests.test_milestone58_bpbd_events_2024 -v

      - name: Require deterministic district rebuild
        run: |
          python scripts/finalize_milestone58_bpbd_events_2024.py
          git diff --exit-code -- \
            data/processed/bpbd/disaster_events_2024/bpbd-disaster-events-2024-canonical-district.csv \
            data/manifests/milestone58_bpbd_events_2024_final.json

      - name: Revalidate existing BPBD 2024 context
        run: |
          python scripts/materialize_bpbd_priority_context.py
          git diff --exit-code -- \
            data/processed/bpbd/disaster_impact_2023 \
            data/processed/bpbd/disaster_context_2024
