name: Milestone 8 GRDP Overlap Reconciliation

on:
  push:
    branches:
      - agent/milestone8-earthquake-quasi-causal
    paths:
      - "scripts/reconcile_milestone8_grdp_overlap.py"
      - "data/analysis/quasi_causal/m8-preperiod-real-grdp-2005-2009.csv"
      - "data/analysis/quasi_causal/m8-postperiod-real-grdp-2009-2013.csv"
      - ".github/workflows/milestone8-grdp-overlap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone8-grdp-overlap
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Milestone 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone8-earthquake-quasi-causal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile exact 19-geography 2009 overlap
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.reconcile_milestone8_grdp_overlap 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 16 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 8 GRDP overlap reconciliation failure::$message"
          exit 1

      - name: Commit deterministic overlap evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/quasi_causal/m8-grdp-2009-overlap.csv \
            data/manifests/milestone8_grdp_overlap.json
          if git diff --cached --quiet; then
            echo "Milestone 8 overlap evidence unchanged."
            exit 0
          fi
          git commit -m "data: reconcile milestone8 2009 GRDP overlap"
          git pull --rebase origin agent/milestone8-earthquake-quasi-causal
          git push origin HEAD:agent/milestone8-earthquake-quasi-causal
