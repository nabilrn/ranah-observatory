name: Milestone 25 DJPK Stage 1 pilot

on:
  pull_request:
    paths:
      - research/MILESTONE25_DJPK_PUBLIC_FINANCE_SPEC.md
      - data/manifests/milestone25_design_gate.json
      - data/registries/djpk_sumbar_pemda.csv
      - scripts/probe_milestone25_djpk_taxonomy.py
      - scripts/lock_milestone25_stage1_contracts.py
      - scripts/probe_milestone25_djpk_stage1.py
      - tests/test_milestone25_djpk_taxonomy.py
      - tests/test_milestone25_djpk_stage1.py
      - .github/workflows/milestone25-stage1-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Stage 0 and Stage 1 offline tests
        run: >-
          python -m pytest -q
          tests/test_milestone25_djpk_taxonomy.py
          tests/test_milestone25_djpk_stage1.py
      - name: Rebuild Stage 0 taxonomy before cross-geography inspection
        run: python scripts/probe_milestone25_djpk_taxonomy.py
      - name: Lock exact-label Stage 1 contracts
        run: python scripts/lock_milestone25_stage1_contracts.py
      - name: Probe all 19 Sumbar pemda for 2024 only
        run: >-
          python scripts/probe_milestone25_djpk_stage1.py
          --years 2024
          --coverage /tmp/m25-pilot/m25-stage1-pilot-coverage.csv
          --values /tmp/m25-pilot/m25-stage1-pilot-values.csv
          --manifest /tmp/m25-pilot/milestone25_stage1_pilot.json
          --raw-dir /tmp/m25-pilot/raw
      - name: Assert pilot footprint and no bridge usage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/m25-pilot/milestone25_stage1_pilot.json').read_text())
          with Path('/tmp/m25-pilot/m25-stage1-pilot-coverage.csv').open(newline='', encoding='utf-8') as handle:
              coverage = list(csv.DictReader(handle))
          with Path('/tmp/m25-pilot/m25-stage1-pilot-values.csv').open(newline='', encoding='utf-8') as handle:
              values = list(csv.DictReader(handle))
          assert manifest['years'] == [2024]
          assert manifest['geography_count'] == 19
          assert manifest['jurisdiction_year_page_count'] == 19
          assert manifest['all_pages_pass'] is True
          assert manifest['cross_geography_probe_completed_after_contract_lock'] is True
          assert manifest['explicit_bridge_used'] is False
          assert manifest['derived_ratio_created'] is False
          assert manifest['imputation_performed'] is False
          assert manifest['statistical_model_fit'] is False
          assert len(coverage) == 19
          assert all(row['page_pass'] == 'True' for row in coverage)
          expected_values = 19 * manifest['promoted_exact_label_family_count']
          assert len(values) == expected_values
          PY
      - name: Upload credential-free Stage 1 pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone25-djpk-stage1-pilot
          path: /tmp/m25-pilot
          if-no-files-found: error
          retention-days: 14
