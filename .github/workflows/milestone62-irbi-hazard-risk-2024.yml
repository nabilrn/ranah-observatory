name: Milestone 62 IRBI Hazard Risk 2024

on:
  pull_request:
    paths:
      - 'data/manifests/milestone62_irbi_hazard_risk_2024_acquisition.json'
      - 'data/manifests/milestone62_irbi_hazard_risk_2024_final.json'
      - 'data/processed/bnpb/irbi_hazard_risk_2024/**'
      - 'data/registries/geographies.csv'
      - 'catalog/public-datasets.csv'
      - 'scripts/finalize_milestone62_irbi_hazard_risk_2024.py'
      - 'scripts/validate_milestone62_irbi_hazard_risk_2024.py'
      - 'tests/test_milestone62_irbi_hazard_risk_2024.py'
      - '.github/workflows/milestone62-irbi-hazard-risk-2024.yml'
  push:
    branches: [main]
    paths:
      - 'data/manifests/milestone62_irbi_hazard_risk_2024_acquisition.json'
      - 'data/manifests/milestone62_irbi_hazard_risk_2024_final.json'
      - 'data/processed/bnpb/irbi_hazard_risk_2024/**'
      - 'data/registries/geographies.csv'
      - 'catalog/public-datasets.csv'
      - 'scripts/finalize_milestone62_irbi_hazard_risk_2024.py'
      - 'scripts/validate_milestone62_irbi_hazard_risk_2024.py'
      - 'tests/test_milestone62_irbi_hazard_risk_2024.py'
      - '.github/workflows/milestone62-irbi-hazard-risk-2024.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen M62 hazard-risk materialization
        run: python scripts/validate_milestone62_irbi_hazard_risk_2024.py
      - name: Run focused M62 test
        run: python -m pytest -q tests/test_milestone62_irbi_hazard_risk_2024.py
      - name: Require deterministic canonical rebuild
        run: |
          cp data/processed/bnpb/irbi_hazard_risk_2024/irbi-sumbar-hazard-risk-2024-canonical.csv /tmp/m62-canonical.csv
          cp data/manifests/milestone62_irbi_hazard_risk_2024_final.json /tmp/m62-final.json
          python scripts/finalize_milestone62_irbi_hazard_risk_2024.py
          cmp /tmp/m62-canonical.csv data/processed/bnpb/irbi_hazard_risk_2024/irbi-sumbar-hazard-risk-2024-canonical.csv
          cmp /tmp/m62-final.json data/manifests/milestone62_irbi_hazard_risk_2024_final.json
          git diff --exit-code -- data/processed/bnpb/irbi_hazard_risk_2024/irbi-sumbar-hazard-risk-2024-canonical.csv data/manifests/milestone62_irbi_hazard_risk_2024_final.json
