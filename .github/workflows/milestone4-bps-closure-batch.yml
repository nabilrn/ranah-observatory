name: Milestone 4 BPS Closure Batch

on:
  push:
    branches:
      - agent/milestone4-indicator-batch-1
    paths:
      - "data/registries/bps_milestone4_batch1_series.csv"
      - "scripts/extend_milestone4_indicator_registry.py"
      - "scripts/materialize_bps_milestone4_batch1.py"
      - "scripts/audit_milestone4_indicators.py"
      - ".github/workflows/milestone4-bps-closure-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone4-bps-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-close-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone4-indicator-batch-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require BPS API key
        run: test -n "$BPS_API_KEY"

      - name: Harden zero-denominator road-share semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/materialize_bps_milestone4_batch1.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'expected materializer patch anchor not found: {old[:80]!r}')

          replace_once(
              'EXPECTED_BATCH_OBSERVATIONS = 417',
              'EXPECTED_BATCH_OBSERVATIONS = 415',
          )
          replace_once(
              'def transformed_value(config: dict[str, str], rows_by_turvar: dict[str, dict[str, str]]) -> tuple[Decimal, str]:',
              'def transformed_value(config: dict[str, str], rows_by_turvar: dict[str, dict[str, str]]) -> tuple[Decimal | None, str]:',
          )
          replace_once(
              '''        denominator = sum((part for _, part in parts), Decimal("0"))
        if denominator <= 0:
            raise ValueError(f"{config['series_id']}: non-positive road-length denominator")
        value = (numerator / denominator * Decimal("100")).quantize(Decimal("0.000001"))
        detail = (
            f"numerator={selected}:{decimal_text(numerator)}; denominator_components="
            + "|".join(f"{tid}:{decimal_text(part)}" for tid, part in parts)
        )''',
              '''        denominator = sum((part for _, part in parts), Decimal("0"))
        detail = (
            f"numerator={selected}:{decimal_text(numerator)}; denominator_components="
            + "|".join(f"{tid}:{decimal_text(part)}" for tid, part in parts)
        )
        if denominator < 0:
            raise ValueError(f"{config['series_id']}: negative road-length denominator")
        if denominator == 0:
            return None, detail + "; undefined_zero_denominator=true"
        value = (numerator / denominator * Decimal("100")).quantize(Decimal("0.000001"))''',
          )
          replace_once(
              '''        produced = 0
        for code in sorted(actual_codes):
            geography_id = geo[code]
            value, transform_detail = transformed_value(config, grouped[code])
            observation_id = stable_id(''',
              '''        produced = 0
        undefined_codes: list[str] = []
        for code in sorted(actual_codes):
            geography_id = geo[code]
            value, transform_detail = transformed_value(config, grouped[code])
            if value is None:
                undefined_codes.append(code)
                continue
            observation_id = stable_id(''',
          )
          replace_once(
              '''        if produced != expected_count:
            raise ValueError(f"{config['series_id']}: produced {produced} rows instead of {expected_count}")
        series_summary.append({''',
              '''        expected_produced = expected_count
        if config["series_id"] == "m4_road_good_2024":
            expected_undefined = {"1374", "1375"}
            if set(undefined_codes) != expected_undefined:
                raise ValueError(
                    f"{config['series_id']}: undefined geography set drifted: {sorted(undefined_codes)}"
                )
            expected_produced = 17
        elif undefined_codes:
            raise ValueError(
                f"{config['series_id']}: unexpected undefined geography values: {sorted(undefined_codes)}"
            )
        if produced != expected_produced:
            raise ValueError(
                f"{config['series_id']}: produced {produced} rows instead of {expected_produced}"
            )
        series_summary.append({''',
          )
          replace_once(
              '''            "missing_current_geographies": sorted(EXPECTED_CODES - actual_codes),
        })''',
              '''            "missing_current_geographies": sorted(EXPECTED_CODES - actual_codes),
            "undefined_current_geographies": sorted(undefined_codes),
        })''',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile closure tooling
        run: >-
          python -m py_compile
          scripts/extend_milestone4_indicator_registry.py
          scripts/materialize_bps_milestone4_batch1.py
          scripts/audit_milestone4_indicators.py

      - name: Extend indicator registry with reviewed closure indicators
        run: python scripts/extend_milestone4_indicator_registry.py

      - name: Re-harvest exact qualified BPS source periods
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/milestone4-bps-closure
          mkdir -p /tmp/milestone4-bps-closure
          while IFS=, read -r var year; do
            echo "Harvesting BPS var=${var} period=${year}"
            python scripts/harvest_bps_series.py \
              --var "${var}" \
              --period "${year}" \
              --output-dir "/tmp/milestone4-bps-closure/var-${var}"
          done <<'EOF'
          512,2020
          883,2025
          877,2025
          320,2025
          555,2024
          774,2025
          319,2025
          289,2024
          875,2025
          876,2025
          878,2025
          879,2025
          884,2025
          727,2024
          729,2024
          492,2024
          760,2024
          473,2025
          773,2022
          EOF

      - name: Materialize 22-indicator canonical closure batch
        run: >-
          python scripts/materialize_bps_milestone4_batch1.py
          --input-root /tmp/milestone4-bps-closure

      - name: Revalidate frozen closure batch
        run: python scripts/materialize_bps_milestone4_batch1.py --validate-only

      - name: Build and hard-gate Milestone 4 inventory
        run: python scripts/audit_milestone4_indicators.py --require-complete

      - name: Enforce exact Milestone 4 closure contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(Path('data/processed/bps/milestone4/bps-milestone4-batch1.manifest.json').read_text())
          audit = json.loads(Path('data/manifests/milestone4_indicator_inventory.json').read_text())

          assert batch['indicator_count'] == 22, batch
          assert batch['observation_count'] == 415, batch
          assert batch['provenance_count'] == 19, batch
          assert batch['source_snapshot_count'] == 19, batch
          assert batch['semantic_source_locks_enforced'] is True, batch
          assert batch['canonical_promotion_performed'] is True, batch

          road = next(item for item in batch['series'] if item['series_id'] == 'm4_road_good_2024')
          assert road['row_count'] == 17, road
          assert road['missing_current_geographies'] == [], road
          assert road['undefined_current_geographies'] == ['1374', '1375'], road

          assert audit['qualified_indicator_count'] == 40, audit
          assert audit['remaining_to_minimum'] == 0, audit
          assert audit['milestone4_complete'] is True, audit
          assert audit['duplicate_observation_ids'] == [], audit
          assert audit['unresolved_provenance'] == [], audit
          assert audit['unregistered_observed_indicator_ids'] == [], audit
          PY

      - name: Commit reviewed canonical closure batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/materialize_bps_milestone4_batch1.py \
            data/registries/indicators.csv \
            data/processed/bps/milestone4/ \
            data/manifests/milestone4_indicator_inventory.json
          if git diff --cached --quiet; then
            echo "Milestone 4 closure outputs already match Git."
            exit 0
          fi
          git commit -m "data: complete milestone 4 indicator foundation"
          git push origin HEAD:agent/milestone4-indicator-batch-1
