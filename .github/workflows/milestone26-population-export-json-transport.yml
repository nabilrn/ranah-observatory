name: Milestone 26 population export JSON transport

on:
  pull_request:
    paths:
      - data/manifests/milestone26_population_export_json_transport_contract.json
      - scripts/probe_milestone26_population_export_json_transport.py
      - tests/test_milestone26_population_export_json_transport.py
      - .github/workflows/milestone26-population-export-json-transport.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused spatial dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy shapely pyproj rasterio

      - name: Compile export JSON transport probe
        run: python -m py_compile scripts/probe_milestone26_population_export_json_transport.py

      - name: Run locked transport tests before live probe
        run: python -m pytest -q tests/test_milestone26_population_export_json_transport.py

      - name: Probe exportImage JSON indirection
        run: python -m scripts.probe_milestone26_population_export_json_transport

      - name: Assert diagnostic footprint and non-promotion boundary
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('data/manifests/milestone26_population_export_json_transport.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-population-export-json-transport/v1'
          assert manifest['numeric_aggregation_performed'] is False
          assert manifest['substantive_value_promotion_performed'] is False
          assert manifest['equivalence_decision_performed'] is False
          assert manifest['cross_geography_numeric_extraction_performed'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          export = manifest['export_json_response']
          export_path = Path(export['body_path'])
          assert export_path.exists()
          assert hashlib.sha256(export_path.read_bytes()).hexdigest() == export['body_sha256']
          if manifest['href_response'] is not None:
              href = manifest['href_response']
              href_path = Path(href['body_path'])
              assert href_path.exists()
              assert hashlib.sha256(href_path.read_bytes()).hexdigest() == href['body_sha256']
          PY

      - name: Re-run focused tests after live probe
        run: python -m pytest -q tests/test_milestone26_population_export_json_transport.py

      - name: Commit frozen export JSON transport evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            data/processed/bnpb/m26_population_export_json_transport \
            data/manifests/milestone26_population_export_json_transport.json
          if git diff --cached --quiet; then
            echo 'No export JSON transport changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 export JSON transport probe"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
