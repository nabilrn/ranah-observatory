name: Milestone 26 Stage 2a event-impact live qualification v2

on:
  pull_request:
    paths:
      - scripts/probe_milestone26_stage2a_event_impact_live_v2.py
      - scripts/probe_milestone26_event_impact_retrieval.py
      - data/manifests/milestone26_stage2_event_impact_contract.json
      - data/manifests/milestone26_stage2a_geography_crosswalk_contract.json
      - data/registries/bnpb_geography_map.csv
      - data/analysis/engine/spatial_climate_risk_v1/m16-spatial-component-frame.csv
      - .github/workflows/milestone26-stage2a-event-impact-live-v2.yml
  push:
    branches:
      - agent/milestone26-disaster-risk-chain
    paths:
      - scripts/probe_milestone26_stage2a_event_impact_live_v2.py
      - data/manifests/milestone26_stage2a_geography_crosswalk_contract.json
      - .github/workflows/milestone26-stage2a-event-impact-live-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-stage2a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile crosswalk-safe retriever
        run: |
          python -m py_compile scripts/probe_milestone26_event_impact_retrieval.py
          python -m py_compile scripts/probe_milestone26_stage2a_event_impact_live_v2.py
      - name: Retrieve target-period BNPB rows live
        run: python -m scripts.probe_milestone26_stage2a_event_impact_live_v2 --mode live
      - name: Capture live derived hashes
        run: |
          sha256sum \
            data/analysis/engine/disaster_risk_chain_v1/m26-stage2a-event-impact-row-diagnostics.jsonl \
            data/manifests/milestone26_stage2a_event_impact_retrieval.json \
            > /tmp/m26-stage2a-v2-live.sha256
      - name: Rebuild diagnostics offline
        run: python -m scripts.probe_milestone26_stage2a_event_impact_live_v2 --mode offline
      - name: Require byte-identical live/offline derived outputs
        run: sha256sum -c /tmp/m26-stage2a-v2-live.sha256
      - name: Verify Stage 2a qualification boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path('data/manifests/milestone26_stage2a_event_impact_retrieval.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone26-stage2a-event-impact-retrieval/v2'
          assert m['target_regime']['year'] == 2024
          assert m['target_regime']['event_types'] == ['BANJIR', 'TANAH LONGSOR']
          assert m['source_id_assumed_canonical'] is False
          assert m['all_retained_sumbar_rows_crosswalked'] is True
          assert m['source_name_crosscheck_passed'] is True
          assert m['target_date_range_validation_passed'] is True
          assert m['source_event_type_validation_passed'] is True
          assert m['impact_cell_type_profile_completed'] is True
          assert m['blank_interpreted_as_zero'] is False
          assert m['automatic_duplicate_collapse_performed'] is False
          assert m['duplicate_resolution_decision'] == 'pending_explicit_stage2b_decision'
          assert m['stage2b_promotion_authorized'] is False
          assert m['impact_aggregation_performed'] is False
          assert m['historical_boundary_reconstruction_performed'] is False
          assert m['cross_component_temporal_aggregation_performed'] is False
          assert m['risk_synthesis_authorized'] is False
          assert m['statistical_model_fit'] is False
          assert m['causal_claim_created'] is False
          assert m['monetary_loss_inferred'] is False
          assert m['monetary_wasted_potential_estimated'] is False
          assert len(m['retrievals']) == 2
          for retrieval in m['retrievals']:
              assert Path(retrieval['raw_html_path']).exists()
              assert Path(retrieval['request_sidecar_path']).exists()
          assert Path(m['row_diagnostics']['path']).exists()
          PY
      - name: Commit frozen Stage 2a evidence
        run: |
          git add \
            data/processed/bnpb/m26_stage2_event_impact_2024 \
            data/analysis/engine/disaster_risk_chain_v1/m26-stage2a-event-impact-row-diagnostics.jsonl \
            data/manifests/milestone26_stage2a_event_impact_retrieval.json
          if git diff --cached --quiet; then
            echo 'Stage 2a evidence unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm26: freeze crosswalk-safe 2024 BNPB event-impact diagnostics'
          git push origin HEAD:agent/milestone26-disaster-risk-chain
