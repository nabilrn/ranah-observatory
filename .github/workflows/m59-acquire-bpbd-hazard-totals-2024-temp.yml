name: M59 Acquire BPBD Hazard Totals 2024 TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/acquire_milestone59_bpbd_hazard_totals_2024.py'
      - '.github/workflows/m59-acquire-bpbd-hazard-totals-2024-temp.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire official M59 DataStore table
        run: python scripts/acquire_milestone59_bpbd_hazard_totals_2024.py
      - name: Commit frozen M59 source-native output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bpbd/disaster_events_2024_hazard_totals data/manifests/milestone59_bpbd_hazard_totals_2024_acquisition.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze M59 BPBD 2024 hazard totals'
          git push origin HEAD:research/evidence
