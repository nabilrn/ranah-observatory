name: Climate rainfall materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/materialize_chirps_rainfall.py"
      - "tests/test_chirps_rainfall_materialization.py"
      - ".github/workflows/climate-rainfall-materialization.yml"
      - "scripts/build_chirps_rainfall_production.py"
      - "scripts/build_chirps_rainfall_sample.py"
      - "data/registries/big_geography_map.csv"
      - "docs/CLIMATE_RAINFALL_MATERIALIZATION.md"

permissions:
  contents: read

jobs:
  validate-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            rasterio==1.5.0 \
            shapely==2.1.2 \
            pyproj==3.7.2

      - name: Run materialization unit tests
        run: python -m unittest tests.test_chirps_rainfall_materialization -v

      - name: Rebuild full rainfall production candidates
        run: python -m scripts.build_chirps_rainfall_production --output-dir artifacts/chirps-rainfall-production

      - name: Materialize canonical-format annual rainfall
        run: |
          python -m scripts.materialize_chirps_rainfall \
            artifacts/chirps-rainfall-production/chirps_rainfall_production_annual.csv \
            artifacts/chirps-rainfall-production/chirps_rainfall_production_manifest.json \
            --output-dir artifacts/chirps-rainfall-materialization

      - name: Enforce canonical-format materialization contract
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/chirps-rainfall-materialization")
          manifest = json.loads((root / "chirps-rainfall-materialization.manifest.json").read_text(encoding="utf-8"))
          with (root / "chirps-annual-rainfall-observations.csv").open(encoding="utf-8", newline="") as handle:
              observations = list(csv.DictReader(handle))
          with (root / "chirps-annual-rainfall-provenance.csv").open(encoding="utf-8", newline="") as handle:
              provenance = list(csv.DictReader(handle))
          with (root / "chirps-source-contract.csv").open(encoding="utf-8", newline="") as handle:
              contract = list(csv.DictReader(handle))

          assert len(observations) == 855, len(observations)
          assert len(provenance) == 45, len(provenance)
          assert len(contract) == 541, len(contract)
          assert len({row["observation_id"] for row in observations}) == 855
          assert len({(row["geography_id"], row["time_start"][:4]) for row in observations}) == 855
          assert {row["indicator_id"] for row in observations} == {"annual_rainfall"}
          assert {row["frequency"] for row in observations} == {"annual"}
          assert {row["unit"] for row in observations} == {"millimetres"}
          assert {row["claim_type"] for row in observations} == {"model_estimate"}
          assert {row["suppressed"] for row in observations} == {"false"}
          assert {row["comparable"] for row in observations} == {"true"}
          assert all("fixed_current_boundary_june_2026" in row["notes"] for row in observations)
          assert all("observed_station_equivalence=false" in row["notes"] for row in observations)
          assert all("independent_station_validation=pending" in row["notes"] for row in observations)

          contract_bytes = (root / "chirps-source-contract.csv").read_bytes()
          contract_sha = hashlib.sha256(contract_bytes).hexdigest()
          assert manifest["source_contract_sha256"] == contract_sha
          assert {row["checksum_sha256"] for row in provenance} == {contract_sha}
          assert sum(row["source_id"] == "chirps_v3" for row in contract) == 540
          assert sum(row["source_id"] == "big_admin_boundaries_june_2026" for row in contract) == 1
          assert all(
              row["identity_scope"] == "sha256_first_16384_bytes_not_full_file_checksum"
              for row in contract if row["source_id"] == "chirps_v3"
          )
          assert manifest["independent_station_validation"] == "pending"
          assert manifest["eligible_as_observed_station_data"] is False
          assert manifest["historical_boundary_continuity_claimed"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chirps-annual-rainfall-canonical-candidate
          path: artifacts/chirps-rainfall-materialization/
