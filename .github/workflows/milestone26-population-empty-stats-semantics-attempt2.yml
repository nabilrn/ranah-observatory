name: Milestone 26 population empty-stats semantics attempt 2 (frozen verifier)

# Frozen after recovery succeeded and the exact Kota Pariaman native cell was
# independently confirmed as NoData by both qualified transports.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-attempt-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen exact-cell NoData qualification
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest = json.loads(Path('data/manifests/milestone26_population_empty_stats_semantics_attempt2.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-population-empty-stats-semantics-attempt2/v1'
          assert manifest['recovery_gate']['all_repeats_both_services_passed'] is True
          assert manifest['semantic_probe_performed'] is True
          assert manifest['decision'] == 'deterministic_no_valid_source_value_for_exact_native_cell'
          assert manifest['exact_cell_no_valid_source_value_qualified'] is True
          assert [row['classification'] for row in manifest['image_server_repeats']] == ['empty_statistics'] * 3
          assert [row['finite_accepted_pixel_value_count'] for row in manifest['mapserver_repeats']] == [0, 0, 0]
          assert [row['raw_result_count'] for row in manifest['mapserver_repeats']] == [1, 1, 1]
          for row in manifest['recovery_gate']['responses'] + manifest['image_server_repeats'] + manifest['mapserver_repeats']:
              response = row['response']
              raw = Path(response['raw_path'])
              assert hashlib.sha256(raw.read_bytes()).hexdigest() == response['raw_sha256']
          assert manifest['empty_statistics_global_semantics_qualified'] is False
          assert manifest['other_empty_partitions_authorized_without_reference_confirmation'] is False
          assert manifest['stage1_population_production_extraction_authorized'] is False
          assert manifest['risk_synthesis_authorized'] is False
          PY
