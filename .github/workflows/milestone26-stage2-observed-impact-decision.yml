name: Milestone 26 Stage 2 observed-impact decision

on:
  pull_request:
    paths:
      - scripts/build_milestone26_stage2_observed_impact_decision.py
      - data/manifests/milestone26_stage2a_transport_diagnostic.json
      - data/manifests/milestone26_stage2_ckan_resource_discovery.json
      - data/manifests/milestone26_stage2_ckan_resource_discovery_2024.json
      - data/manifests/milestone26_stage2_event_impact_contract.json
      - research/MILESTONE26_DISASTER_RISK_CHAIN_SPEC.md
      - .github/workflows/milestone26-stage2-observed-impact-decision.yml
  push:
    branches:
      - agent/milestone26-disaster-risk-chain
    paths:
      - scripts/build_milestone26_stage2_observed_impact_decision.py
      - data/manifests/milestone26_stage2a_transport_diagnostic.json
      - data/manifests/milestone26_stage2_ckan_resource_discovery.json
      - data/manifests/milestone26_stage2_ckan_resource_discovery_2024.json
      - .github/workflows/milestone26-stage2-observed-impact-decision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile decision builder
        run: python -m py_compile scripts/build_milestone26_stage2_observed_impact_decision.py
      - name: Build fail-closed observed-impact decision
        run: python -m scripts.build_milestone26_stage2_observed_impact_decision
      - name: Verify observed impact remains held
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone26_stage2_observed_impact_decision.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone26-stage2-observed-impact-decision/v1'
          assert m['decision'] == 'held_deterministic_event_level_transport_unqualified'
          assert m['legacy_html_evidence']['classification'] == 'post_filter_transport_not_proven'
          assert m['legacy_html_evidence']['default_get_row_count'] > 0
          assert m['legacy_html_evidence']['post_banjir_2024_row_count'] == 0
          assert m['ckan_primary_package_evidence']['metadata_text_event_level_candidate_count'] == 0
          assert m['ckan_dedicated_2024_package_evidence']['metadata_text_event_level_candidate_count'] == 0
          assert m['aggregate_ckan_impact_resources_promoted_as_event_rows'] is False
          assert m['zero_rows_interpreted_as_zero_disaster_occurrence'] is False
          assert m['zero_rows_interpreted_as_zero_observed_impact'] is False
          assert m['target_impact_values_inspected_for_resource_selection'] is False
          assert m['event_level_observed_impact_qualified'] is False
          assert m['stage2b_promotion_authorized'] is False
          assert m['impact_aggregation_authorized'] is False
          assert m['automatic_duplicate_collapse_authorized'] is False
          assert m['cross_component_temporal_aggregation_authorized'] is False
          assert m['risk_synthesis_authorized'] is False
          assert m['statistical_model_fit_authorized'] is False
          assert m['causal_claim_authorized'] is False
          assert m['monetary_loss_inference_authorized'] is False
          assert m['monetary_wasted_potential_estimate_authorized'] is False
          PY
      - name: Commit deterministic decision
        run: |
          git add data/manifests/milestone26_stage2_observed_impact_decision.json
          if git diff --cached --quiet; then
            echo 'Observed-impact decision unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm26: hold event-level observed impact after transport qualification'
          git pull --rebase origin agent/milestone26-disaster-risk-chain
          git push origin HEAD:agent/milestone26-disaster-risk-chain
