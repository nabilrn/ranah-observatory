name: Public Product Claim Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - site/**
      - docs/PRODUCT_V0_1_SPEC.md
      - scripts/validate_public_product.py
      - scripts/build_public_district_explorer.py
      - tests/test_public_product.py
      - tests/test_public_district_explorer.py
      - .github/workflows/public-product.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restrict product workstream scope
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          allowed_exact = {
              'docs/PRODUCT_V0_1_SPEC.md',
              'scripts/validate_public_product.py',
              'scripts/build_public_district_explorer.py',
              'tests/test_public_product.py',
              'tests/test_public_district_explorer.py',
              '.github/workflows/public-product.yml',
          }
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          offenders = [
              path for path in changed
              if path not in allowed_exact and not path.startswith('site/')
          ]
          assert not offenders, offenders
          print({'changed_files': len(changed), 'unauthorized_paths': 0})
          PY

      - name: Build deterministic district explorer candidate
        run: python scripts/build_public_district_explorer.py

      - name: Validate public narrative against frozen claim ledger
        run: python scripts/validate_public_product.py

      - name: Run product contract tests
        run: |
          python -m unittest tests.test_public_product -v
          python -m unittest tests.test_public_district_explorer -v

      - name: Check browser JavaScript syntax
        run: node --check site/app.js

      - name: Require static product files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/explorer.css
          test -s site/app.js
          test -s site/data/overview.json
          test -s site/data/districts.json
          grep -q 'id="temuan"' site/index.html
          grep -q 'id="daerah"' site/index.html
          grep -q 'id="batas"' site/index.html
          grep -q 'id="metode"' site/index.html

      - name: One-time freeze district explorer data
        if: github.event_name == 'pull_request'
        run: |
          git add site/data/districts.json
          if git diff --cached --quiet; then
            echo "district explorer data already frozen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze public district explorer data"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Protect frozen science and publication package
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code origin/main...HEAD -- \
            data \
            publication/v0.1 \
            research
