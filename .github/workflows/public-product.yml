name: Public Product Claim Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - site/**
      - docs/PRODUCT_V0_1_SPEC.md
      - scripts/validate_public_product.py
      - scripts/validate_public_readiness.py
      - scripts/build_public_district_explorer.py
      - scripts/build_public_indicator_catalog.py
      - tests/test_public_product.py
      - tests/test_public_district_explorer.py
      - tests/test_public_glossary.py
      - tests/test_public_readiness.py
      - tests/test_public_indicator_catalog.py
      - .github/workflows/public-product.yml
      - .github/workflows/deploy-public-product.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restrict product workstream scope
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          allowed_exact = {
              'docs/PRODUCT_V0_1_SPEC.md',
              'scripts/validate_public_product.py',
              'scripts/validate_public_readiness.py',
              'scripts/build_public_district_explorer.py',
              'scripts/build_public_indicator_catalog.py',
              'tests/test_public_product.py',
              'tests/test_public_district_explorer.py',
              'tests/test_public_glossary.py',
              'tests/test_public_readiness.py',
              'tests/test_public_indicator_catalog.py',
              '.github/workflows/public-product.yml',
              '.github/workflows/deploy-public-product.yml',
          }
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          offenders = [
              path for path in changed
              if path not in allowed_exact and not path.startswith('site/')
          ]
          assert not offenders, offenders
          print({'changed_files': len(changed), 'unauthorized_paths': 0})
          PY

      - name: Rebuild deterministic district explorer candidate
        run: |
          cp site/data/districts.json /tmp/districts-frozen.json
          python scripts/build_public_district_explorer.py
          diff -u /tmp/districts-frozen.json site/data/districts.json

      - name: Rebuild deterministic indicator catalog candidate
        run: |
          cp site/data/indicators.json /tmp/indicators-frozen.json
          python scripts/build_public_indicator_catalog.py
          diff -u /tmp/indicators-frozen.json site/data/indicators.json

      - name: Validate public narrative against frozen claim ledger
        run: python scripts/validate_public_product.py

      - name: Validate public research readiness against frozen M18 synthesis
        run: python scripts/validate_public_readiness.py

      - name: Run product contract tests
        run: |
          python -m unittest tests.test_public_product -v
          python -m unittest tests.test_public_district_explorer -v
          python -m unittest tests.test_public_glossary -v
          python -m unittest tests.test_public_readiness -v
          python -m unittest tests.test_public_indicator_catalog -v

      - name: Check browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/glossary.js
          node --check site/readiness.js
          node --check site/catalog.js

      - name: Validate Pages workflow safety contract
        run: |
          grep -q 'pages: write' .github/workflows/deploy-public-product.yml
          grep -q 'id-token: write' .github/workflows/deploy-public-product.yml
          grep -q 'actions/configure-pages@v5' .github/workflows/deploy-public-product.yml
          grep -q 'actions/upload-pages-artifact@v4' .github/workflows/deploy-public-product.yml
          grep -q 'actions/deploy-pages@v4' .github/workflows/deploy-public-product.yml
          grep -q 'path: site' .github/workflows/deploy-public-product.yml
          grep -q 'python scripts/validate_public_product.py' .github/workflows/deploy-public-product.yml
          grep -q 'python scripts/validate_public_readiness.py' .github/workflows/deploy-public-product.yml
          grep -q 'python scripts/build_public_district_explorer.py' .github/workflows/deploy-public-product.yml
          grep -q 'python scripts/build_public_indicator_catalog.py' .github/workflows/deploy-public-product.yml

      - name: Require static product files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/explorer.css
          test -s site/readiness.css
          test -s site/catalog.css
          test -s site/glossary.css
          test -s site/app.js
          test -s site/readiness.js
          test -s site/catalog.js
          test -s site/glossary.js
          test -s site/data/overview.json
          test -s site/data/districts.json
          test -s site/data/readiness.json
          test -s site/data/indicators.json
          test -s site/data/glossary.json
          test -f site/.nojekyll
          grep -q 'id="temuan"' site/index.html
          grep -q 'id="status-riset"' site/index.html
          grep -q 'id="katalog"' site/index.html
          grep -q 'id="daerah"' site/index.html
          grep -q 'id="batas"' site/index.html
          grep -q 'id="glosarium"' site/index.html
          grep -q 'id="metode"' site/index.html

      - name: Protect frozen science and publication package
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code origin/main...HEAD -- \
            data \
            publication/v0.1 \
            research
