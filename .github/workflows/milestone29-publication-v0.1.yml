name: Milestone 29 Publication v0.1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/milestone29-publication-v0.1.yml
      - data/manifests/milestone29_publication_design_gate.json
      - publication/v0.1/**
      - research/MILESTONE29_PUBLICATION_FREEZE_V0_1_SPEC.md
      - scripts/audit_milestone29_publication_v0_1.py

permissions:
  contents: read

jobs:
  certify-publication-v0-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require publication-only branch scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          allowed_exact = {
              '.github/workflows/milestone29-publication-v0.1.yml',
              '.github/workflows/milestone31-publication-submission.yml',
              'data/manifests/milestone29_publication_design_gate.json',
              'research/MILESTONE29_PUBLICATION_FREEZE_V0_1_SPEC.md',
              'scripts/audit_milestone29_publication_v0_1.py',
          }
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          offenders = [
              path for path in changed
              if path not in allowed_exact and not path.startswith('publication/v0.1/')
          ]
          assert not offenders, f'unauthorized publication paths changed: {offenders}'
          print({'changed_files': len(changed), 'unauthorized_paths': 0})
          PY

      - name: Audit frozen publication registry and manuscript
        run: python scripts/audit_milestone29_publication_v0_1.py

      - name: Require all publication asset plans materialized
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          pub = Path('publication/v0.1')
          for filename, expected in [('table-plan.csv', 7), ('figure-plan.csv', 6)]:
              with (pub/filename).open(encoding='utf-8', newline='') as h:
                  rows = list(csv.DictReader(h))
              assert len(rows) == expected, (filename, len(rows))
              assert all(row['status'] == 'materialized' for row in rows), filename
          print({'tables_materialized': 7, 'figures_materialized': 6})
          PY

      - name: Rebuild deterministic publication tables and figures
        run: python publication/v0.1/tools/build_assets.py

      - name: Validate generated asset contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('publication/v0.1/rendered')
          manifest = json.loads((root/'render-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/publication-v0.1-render-manifest/v1'
          assert manifest['table_count'] == 7
          assert manifest['figure_count'] == 6
          assert manifest['new_source_acquisition'] is False
          assert manifest['new_statistical_or_ml_model_fit'] is False
          assert len(list((root/'tables').glob('T*.csv'))) == 7
          assert len(list((root/'figures').glob('F*.svg'))) == 6
          print({'tables': 7, 'figures': 6, 'asset_generation': 'passed'})
          PY

      - name: Require byte-identical canonical publication assets
        shell: bash
        run: |
          git diff --exit-code -- publication/v0.1/rendered
          test -z "$(git status --porcelain -- publication/v0.1/rendered)"

      - name: Upload verified rendered publication assets
        uses: actions/upload-artifact@v4
        with:
          name: publication-v0.1-rendered
          path: publication/v0.1/rendered
          retention-days: 7

      - name: Require no upstream analytical artifacts changed
        run: |
          git diff --exit-code origin/main...HEAD -- \
            data/analysis \
            data/processed \
            data/registries \
            docs \
            research/MILESTONE0* \
            research/MILESTONE1* \
            research/MILESTONE2[0-8]* \
            scripts/build_milestone* \
            scripts/finalize_milestone*

      - name: Publication certificate summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cert = json.loads(Path('publication/v0.1/completeness-certificate.json').read_text(encoding='utf-8'))
          print({
              'release': cert['release'],
              'claims': cert['claim_count'],
              'states': cert['state_counts'],
              'negative_results_retained': cert['required_negative_results_retained'],
              'blocked_claims_retained': cert['all_nine_m18_blocked_claims_retained'],
              'offline_verification_passed': cert['offline_verification_passed'],
          })
          PY
