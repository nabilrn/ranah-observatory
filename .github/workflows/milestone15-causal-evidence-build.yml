name: Milestone 15 Causal Evidence Build

on:
  push:
    branches:
      - agent/milestone15-causal-evidence-expansion
    paths:
      - "research/MILESTONE15_CAUSAL_EVIDENCE_EXPANSION_SPEC.md"
      - "scripts/build_milestone15_causal_evidence_expansion.py"
      - ".github/workflows/milestone15-causal-evidence-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone15-causal-evidence-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone15-causal-evidence-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fail-closed causal evidence library
        run: python -m scripts.build_milestone15_causal_evidence_expansion
      - name: Commit deterministic outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/engine/causal_evidence_v1 data/manifests/milestone15_causal_evidence_expansion.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: materialize milestone15 causal evidence library"
          git pull --rebase origin agent/milestone15-causal-evidence-expansion
          git push origin HEAD:agent/milestone15-causal-evidence-expansion
