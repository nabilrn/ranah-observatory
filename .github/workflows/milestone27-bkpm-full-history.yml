name: Milestone 27 BKPM Full History Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - data/manifests/milestone27_bkpm_full_history.json
      - data/manifests/milestone27_bkpm_stage1_qualification.json
      - data/analysis/engine/investment_realization_v1/m27-bkpm-quarterly-history.csv
      - data/analysis/engine/investment_realization_v1/m27-bkpm-quarter-audit.csv
      - scripts/materialize_milestone27_bkpm_full_history.py
      - .github/workflows/milestone27-bkpm-full-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded frozen history state
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone27_bkpm_full_history.json').read_text(encoding='utf-8'))
          q = json.loads(Path('data/manifests/milestone27_bkpm_stage1_qualification.json').read_text(encoding='utf-8'))
          assert m['quarter_count'] == 64
          assert m['qualified_quarter_count'] == 63
          assert m['failed_quarter_count'] == 1
          failed = [r for r in m['quarter_results'] if not r['qualified']]
          assert len(failed) == 1 and failed[0]['year'] == 2024 and failed[0]['quarter'] == 'I'
          assert failed[0]['fail_reasons'] == ['duplicate_complete_source_dimension_tuple']
          assert q['bounded_quarterly_history_qualified'] is True
          assert q['continuous_64_quarter_history_qualified'] is False
          assert q['numeric_qualified_quarter_count'] == 63
          rows = list(csv.DictReader(Path('data/analysis/engine/investment_realization_v1/m27-bkpm-quarterly-history.csv').open(encoding='utf-8')))
          assert len(rows) == 1440
          assert m['missing_values_coerced_to_zero'] is False
          assert m['pma_pmdn_combination_performed'] is False
          assert m['cross_quarter_addition_performed'] is False
          assert m['annual_sum_performed'] is False
          assert m['external_fx_conversion_performed'] is False
          assert m['statistical_model_fit'] is False
          assert m['causal_claim_created'] is False
          assert m['monetary_wasted_potential_estimated'] is False
          print({'qualified_quarters': 63, 'held_quarter': '2024-Q1', 'observations': len(rows)})
          PY
