name: Milestone 20 historical climate trend reproducibility

on:
  pull_request:
    paths:
      - research/MILESTONE20_HISTORICAL_CLIMATE_TREND_SPEC.md
      - docs/MILESTONE20_HISTORICAL_CLIMATE_TREND.md
      - data/manifests/milestone20_design_gate.json
      - data/manifests/milestone20_historical_climate_trend.json
      - data/analysis/engine/historical_climate_trend_v1/**
      - scripts/build_milestone20_historical_climate_trend.py
      - scripts/audit_milestone20_historical_climate_trend.py
      - tests/test_milestone20_historical_climate_trend.py
      - .github/workflows/milestone20-historical-climate-trend-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve committed M20 artifacts
        run: |
          mkdir -p /tmp/m20-committed
          cp -a data/analysis/engine/historical_climate_trend_v1 /tmp/m20-committed/historical_climate_trend_v1
          cp data/manifests/milestone20_historical_climate_trend.json /tmp/m20-committed/milestone20_historical_climate_trend.json

      - name: Rebuild M20 artifacts
        run: python scripts/build_milestone20_historical_climate_trend.py

      - name: Audit M20 outputs
        run: python scripts/audit_milestone20_historical_climate_trend.py

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused M20 tests
        run: python -m pytest -q tests/test_milestone20_historical_climate_trend.py

      - name: Verify byte-identical outputs
        shell: bash
        run: |
          set -euo pipefail
          diff -r /tmp/m20-committed/historical_climate_trend_v1 data/analysis/engine/historical_climate_trend_v1
          cmp /tmp/m20-committed/milestone20_historical_climate_trend.json data/manifests/milestone20_historical_climate_trend.json
          git diff --exit-code -- \
            data/analysis/engine/historical_climate_trend_v1 \
            data/manifests/milestone20_historical_climate_trend.json
