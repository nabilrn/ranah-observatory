name: Milestone 22 hierarchical trajectory reproducibility

on:
  pull_request:
    paths:
      - research/MILESTONE22_HIERARCHICAL_SOCIOECONOMIC_TRAJECTORY_SPEC.md
      - docs/MILESTONE22_HIERARCHICAL_SOCIOECONOMIC_TRAJECTORY.md
      - data/manifests/milestone22_design_gate.json
      - data/manifests/milestone22_hierarchical_socioeconomic_trajectory.json
      - data/analysis/engine/hierarchical_trajectory_v1/**
      - scripts/build_milestone22_hierarchical_socioeconomic_trajectory.py
      - scripts/audit_milestone22_hierarchical_socioeconomic_trajectory.py
      - tests/test_milestone22_hierarchical_socioeconomic_trajectory.py
      - .github/workflows/milestone22-hierarchical-trajectory-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve committed M22 artifacts
        run: |
          mkdir -p /tmp/m22-committed
          cp -a data/analysis/engine/hierarchical_trajectory_v1 /tmp/m22-committed/hierarchical_trajectory_v1
          cp data/manifests/milestone22_hierarchical_socioeconomic_trajectory.json /tmp/m22-committed/milestone22_hierarchical_socioeconomic_trajectory.json
      - name: Rebuild M22 artifacts
        run: python scripts/build_milestone22_hierarchical_socioeconomic_trajectory.py
      - name: Audit M22 outputs
        run: python scripts/audit_milestone22_hierarchical_socioeconomic_trajectory.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused M22 tests
        run: python -m pytest -q tests/test_milestone22_hierarchical_socioeconomic_trajectory.py
      - name: Verify byte-identical outputs
        shell: bash
        run: |
          set -euo pipefail
          diff -r /tmp/m22-committed/hierarchical_trajectory_v1 data/analysis/engine/hierarchical_trajectory_v1
          cmp /tmp/m22-committed/milestone22_hierarchical_socioeconomic_trajectory.json data/manifests/milestone22_hierarchical_socioeconomic_trajectory.json
          git diff --exit-code -- \
            data/analysis/engine/hierarchical_trajectory_v1 \
            data/manifests/milestone22_hierarchical_socioeconomic_trajectory.json
