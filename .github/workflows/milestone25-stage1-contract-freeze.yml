name: Milestone 25 lock Stage 1 fiscal contracts

# Temporary writer. Re-runs Stage 0 and locks Stage 1 exact-label contracts before any cross-geography extraction.
on:
  pull_request:
    paths:
      - .github/workflows/milestone25-stage1-contract-freeze.yml
      - scripts/lock_milestone25_stage1_contracts.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild Stage 0 evidence from official DJPK pages
        run: python scripts/probe_milestone25_djpk_taxonomy.py
      - name: Lock Stage 1 exact-label contracts
        run: python scripts/lock_milestone25_stage1_contracts.py
      - name: Assert lock precedes cross-geography extraction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone25_stage1_contracts.json').read_text())
          assert m['contracts_locked'] is True
          assert m['cross_geography_values_inspected_before_lock'] is False
          assert m['explicit_bridge_promoted'] is False
          assert m['derived_ratio_authorized'] is False
          assert m['promoted_exact_label_family_count'] >= 1
          PY
      - name: Commit Stage 0 evidence and Stage 1 contract lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/djpk_finance_v1/m25-taxonomy-discovery.csv \
            data/analysis/engine/djpk_finance_v1/m25-account-presence.csv \
            data/manifests/milestone25_taxonomy_discovery.json \
            data/processed/djpk/taxonomy_probe \
            data/registries/djpk_m25_stage1_account_contracts.csv \
            data/manifests/milestone25_stage1_contracts.json
          if git diff --cached --quiet; then
            echo 'No Stage 0/contract changes'
            exit 0
          fi
          git commit -m "Lock Milestone 25 DJPK Stage 1 fiscal contracts"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
