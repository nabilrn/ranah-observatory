name: Milestone 26 statistics transport equivalence

on:
  pull_request:
    paths:
      - data/manifests/milestone26_stage1_statistics_transport_probe_contract.json
      - data/manifests/milestone26_stage1_statistics_transport_probe_amendment_v2.json
      - scripts/probe_milestone26_statistics_transport.py
      - scripts/probe_milestone26_statistics_transport_v2.py
      - scripts/probe_milestone26_statistics_transport_v3.py
      - tests/test_milestone26_statistics_transport.py
      - tests/test_milestone26_statistics_transport_v2.py
      - tests/test_milestone26_statistics_transport_v3.py
      - .github/workflows/milestone26-statistics-transport-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-statistics-transport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused spatial dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy shapely pyproj rasterio

      - name: Compile statistics transport probes
        run: |
          python -m py_compile scripts/probe_milestone26_statistics_transport.py
          python -m py_compile scripts/probe_milestone26_statistics_transport_v2.py
          python -m py_compile scripts/probe_milestone26_statistics_transport_v3.py

      - name: Run locked transport tests before live probe
        run: |
          python -m pytest -q \
            tests/test_milestone26_statistics_transport.py \
            tests/test_milestone26_statistics_transport_v2.py \
            tests/test_milestone26_statistics_transport_v3.py

      - name: Compare official server statistics with exact-center references
        run: python -m scripts.probe_milestone26_statistics_transport_v3

      - name: Assert equivalence qualification and claim boundaries
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest_path = Path('data/manifests/milestone26_stage1_statistics_transport_probe.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-stage1-statistics-transport-probe/v2'
          assert manifest['capacity_tiff_getsamples_bridge_equivalent'] is True
          assert manifest['both_sources_getsamples_compute_statistics_equivalent'] is True
          assert manifest['statistics_transport_qualified_for_stage1'] is True
          assert manifest['cross_geography_substantive_values_inspected'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          assert set(manifest['source_results']) == {'inarisk_capacity_2021', 'inarisk_population_2020'}

          capacity = manifest['source_results']['inarisk_capacity_2021']
          assert capacity['capacity_tiff_getsamples_bridge']['all_bridge_gates_passed'] is True

          for source_id, result in manifest['source_results'].items():
              eq = result['getsamples_compute_statistics_equivalence']
              assert eq['all_equivalence_gates_passed'] is True
              assert eq['count_match'] is True
              assert eq['sum_match'] is True
              assert eq['mean_match'] is True
              assert eq['skip_match'] is True
              assert eq['range_match'] is True
              assert eq['coverage_match'] is True
              assert result['getsamples_reference_statistics']['valid_fraction'] >= 0.99
              server_path = Path(result['server_statistics']['path'])
              assert server_path.exists()
              assert hashlib.sha256(server_path.read_bytes()).hexdigest() == result['server_statistics']['sha256']
              for snapshot in result['getsamples_snapshots']:
                  path = Path(snapshot['path'])
                  assert path.exists()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == snapshot['sha256']

          capacity_tiff = Path(capacity['capacity_tiff_reference']['path'])
          assert capacity_tiff.exists()
          assert hashlib.sha256(capacity_tiff.read_bytes()).hexdigest() == capacity['capacity_tiff_reference']['sha256']
          PY

      - name: Re-run focused tests after live probe
        run: |
          python -m pytest -q \
            tests/test_milestone26_statistics_transport.py \
            tests/test_milestone26_statistics_transport_v2.py \
            tests/test_milestone26_statistics_transport_v3.py

      - name: Commit frozen transport-equivalence evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            data/processed/bnpb/m26_statistics_transport_probe \
            data/manifests/milestone26_stage1_statistics_transport_probe.json
          if git diff --cached --quiet; then
            echo 'No statistics transport probe changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 statistics transport equivalence"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
