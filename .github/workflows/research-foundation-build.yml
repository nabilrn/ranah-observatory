name: Research Foundation Build

on:
  push:
    branches:
      - agent/milestone9-hydroclimate-case-study
    paths:
      - "scripts/build_research_foundation_closure.py"
      - "scripts/audit_milestone9_hydroclimate_case_study.py"
      - "data/manifests/milestone9_hydroclimate_case_study.json"
      - ".github/workflows/research-foundation-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-foundation-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone9-hydroclimate-case-study
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Milestone 9 audit
        run: python -m scripts.audit_milestone9_hydroclimate_case_study --require-complete

      - name: Build nine-criterion foundation closure
        run: python -m scripts.build_research_foundation_closure

      - name: Commit closure manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/research_foundation_complete.json
          if git diff --cached --quiet; then
            echo "Research foundation closure unchanged."
            exit 0
          fi
          git commit -m "research: materialize nine-criterion foundation closure"
          git pull --rebase origin agent/milestone9-hydroclimate-case-study
          git push origin HEAD:agent/milestone9-hydroclimate-case-study
