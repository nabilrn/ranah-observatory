name: Milestone 26 population transport capabilities

on:
  pull_request:
    paths:
      - data/manifests/milestone26_population_transport_capability_diagnostic_contract.json
      - scripts/probe_milestone26_population_transport_capabilities.py
      - tests/test_milestone26_population_transport_capabilities.py
      - .github/workflows/milestone26-population-transport-capabilities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused spatial dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy shapely pyproj rasterio

      - name: Compile capability diagnostic
        run: python -m py_compile scripts/probe_milestone26_population_transport_capabilities.py

      - name: Run diagnostic contract tests
        run: python -m pytest -q tests/test_milestone26_population_transport_capabilities.py

      - name: Probe population ImageServer operation surface
        run: python -m scripts.probe_milestone26_population_transport_capabilities

      - name: Assert diagnostic footprint and non-promotion boundary
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('data/manifests/milestone26_population_transport_capability_diagnostic.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['operation_count'] == 3
          assert set(manifest['operation_outcomes']) == {'computeStatisticsHistograms', 'getSamples', 'identify'}
          assert manifest['substantive_value_promotion_performed'] is False
          assert manifest['equivalence_decision_performed'] is False
          assert manifest['cross_geography_numeric_extraction_performed'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          for result in manifest['operation_outcomes'].values():
              body_path = Path(result['response_body_path'])
              assert body_path.exists()
              assert hashlib.sha256(body_path.read_bytes()).hexdigest() == result['response_body_sha256']
          PY

      - name: Re-run focused tests after live diagnostic
        run: python -m pytest -q tests/test_milestone26_population_transport_capabilities.py

      - name: Commit frozen transport capability evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            data/processed/bnpb/m26_population_transport_capability_diagnostic \
            data/manifests/milestone26_population_transport_capability_diagnostic.json
          if git diff --cached --quiet; then
            echo 'No transport capability diagnostic changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 population transport diagnostics"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
