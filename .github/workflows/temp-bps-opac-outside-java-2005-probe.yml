name: Temporary BPS OPAC Outside-Java 2005 Probe

on:
  pull_request:
    paths:
      - "scripts/probe_bps_opac_construction_profile_outside_java_2005.py"
      - "scripts/probe_bps_opac_verified_softcopy_outside_java_2005.py"
      - ".github/workflows/temp-bps-opac-outside-java-2005-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe verified target softcopy locator
        run: python scripts/probe_bps_opac_verified_softcopy_outside_java_2005.py
      - name: Refresh exact-title OPAC search trace
        continue-on-error: true
        run: python scripts/probe_bps_opac_construction_profile_outside_java_2005.py
      - name: Upload bounded probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bps-opac-outside-java-2005-probe
          path: probe-output/
          if-no-files-found: error
