name: Milestone 11 Expected Performance Build

on:
  push:
    branches:
      - agent/phase2-m11-expected-performance-v2
    paths:
      - "scripts/build_milestone11_expected_performance_v2.py"
      - "research/MILESTONE11_EXPECTED_PERFORMANCE_V2_SPEC.md"
      - "data/manifests/milestone11_design_gate.json"
      - "data/analysis/engine/panel_v1/**"
      - "data/manifests/milestone10_analytical_panel.json"
      - ".github/workflows/milestone11-expected-performance-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone11-expected-performance-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Milestone 11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-m11-expected-performance-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build preregistered cross-fitted engine
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.build_milestone11_expected_performance_v2 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 14 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 11 build failure::$message"
          exit 1

      - name: Commit deterministic M11 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/expected_performance_v2 \
            data/manifests/milestone11_expected_performance_v2.json
          if git diff --cached --quiet; then
            echo "Milestone 11 artifacts unchanged."
            exit 0
          fi
          git commit -m "analysis: materialize milestone11 expected-performance v2"
          git pull --rebase origin agent/phase2-m11-expected-performance-v2
          git push origin HEAD:agent/phase2-m11-expected-performance-v2
