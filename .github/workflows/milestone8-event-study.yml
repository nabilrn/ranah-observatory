name: Milestone 8 Earthquake Event Study

on:
  push:
    branches:
      - agent/milestone8-earthquake-quasi-causal
    paths:
      - "scripts/build_milestone8_event_study.py"
      - "data/analysis/quasi_causal/m8-real-grdp-panel-2005-2013-resolved.csv"
      - "data/analysis/quasi_causal/m8-shakemap-exposure-candidate.csv"
      - "data/manifests/milestone8_design_gate.json"
      - "research/MILESTONE8_INFERENCE_PROTOCOL.md"
      - ".github/workflows/milestone8-event-study.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone8-earthquake-event-study
  cancel-in-progress: true

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Milestone 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone8-earthquake-quasi-causal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.3.5

      - name: Fit locked event study and diagnostics
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if python -m scripts.build_milestone8_event_study 2>&1 | tee "$log"; then
            exit 0
          fi
          message="$(tail -n 20 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Milestone 8 event-study failure::$message"
          exit 1

      - name: Commit deterministic event-study artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/quasi_causal/m8-event-study-model-frame.csv \
            data/analysis/quasi_causal/m8-event-study-primary.csv \
            data/analysis/quasi_causal/m8-event-study-influence.csv \
            data/analysis/quasi_causal/m8-event-study-exposure-sensitivity.csv \
            data/manifests/milestone8_event_study.json
          if git diff --cached --quiet; then
            echo "Milestone 8 event-study artifacts unchanged."
            exit 0
          fi
          git commit -m "model: fit M8 earthquake event study"
          git pull --rebase origin agent/milestone8-earthquake-quasi-causal
          git push origin HEAD:agent/milestone8-earthquake-quasi-causal
