name: Milestone 27 BKPM frozen semantic audit

on:
  pull_request:
    paths:
      - data/manifests/milestone27_quarter_semantics_contract.json
      - scripts/audit_milestone27_bkpm_frozen_inventory.py
      - data/manifests/milestone27_bkpm_resource_inventory.json
      - data/analysis/engine/investment_realization_v1/m27-bkpm-resource-inventory.csv
      - data/processed/bkpm/m27_resource_inventory/detail/**
      - .github/workflows/milestone27-bkpm-semantic-audit.yml
  push:
    branches:
      - agent/milestone27-bkpm-investment-history
    paths:
      - data/manifests/milestone27_quarter_semantics_contract.json
      - scripts/audit_milestone27_bkpm_frozen_inventory.py
      - .github/workflows/milestone27-bkpm-semantic-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone27-bkpm-semantic-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone27-bkpm-investment-history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile frozen-evidence auditor
        run: python -m py_compile scripts/audit_milestone27_bkpm_frozen_inventory.py

      - name: Correct transport representation and audit 64 period pages offline
        run: python -m scripts.audit_milestone27_bkpm_frozen_inventory

      - name: Verify corrected fail-closed scientific state
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          m = json.loads(Path('data/manifests/milestone27_bkpm_resource_inventory.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone27-bkpm-resource-inventory/v2'
          assert m['candidate_detail_count'] == 64
          assert m['distinct_period_count'] == 64
          assert m['missing_period_count'] == 0
          assert m['duplicate_period_count'] == 0
          assert m['inventory_parser_transport_false_positive_corrected'] is True
          assert m['false_positive_locator_class'] == 'shared_storage_image_assets'
          assert m['direct_resource_transport_period_count'] == 0
          assert m['direct_resource_url_count'] == 0
          assert m['resource_download_action_period_count'] == 64
          assert m['resource_transport_endpoint_resolved_period_count'] == 0
          assert m['semantic_family_match_period_count'] + m['semantic_family_hold_period_count'] == 64
          assert m['semantic_family_match_period_count'] > 0
          assert m['quarter_specific_period_semantics_supported_by_page_text'] == (m['semantic_family_match_period_count'] == 64)
          assert m['incremental_reported_realization_semantics_supported_by_page_text'] == (m['semantic_family_match_period_count'] == 64)
          assert m['quarterly_flow_interpretation_authorized'] is False
          assert m['cross_quarter_additivity_authorized'] is False
          assert m['annual_sum_authorized'] is False
          assert m['resource_transport_endpoint_qualified'] is False
          assert m['resource_header_retrieval_authorized'] is False
          assert m['resource_file_download_performed'] is False
          assert m['target_investment_values_inspected'] is False
          assert m['investment_value_aggregation_performed'] is False
          assert m['statistical_model_fit'] is False
          assert m['causal_claim_created'] is False
          assert m['monetary_wasted_potential_estimated'] is False
          assert m['stage0_complete'] is False

          inventory = Path(m['outputs']['inventory'])
          audit = Path(m['outputs']['semantic_audit'])
          assert hashlib.sha256(inventory.read_bytes()).hexdigest() == m['outputs']['inventory_sha256']
          assert hashlib.sha256(audit.read_bytes()).hexdigest() == m['outputs']['semantic_audit_sha256']
          with inventory.open(newline='', encoding='utf-8') as h:
              rows = list(csv.DictReader(h))
          assert len(rows) == 64
          assert all(r['resource_format'] == 'CSV' for r in rows)
          assert all(r['resource_transport_locator_count'] == '0' for r in rows)
          assert all(r['resource_transport_endpoint_resolved'] == 'false' for r in rows)
          assert all(r['resource_download_action_count'] == '1' for r in rows)
          assert all(r['semantic_family_state'] in {'semantic_family_match', 'held_semantic_evidence_incomplete'} for r in rows)
          assert sum(r['semantic_family_state'] == 'semantic_family_match' for r in rows) == m['semantic_family_match_period_count']
          assert sum(r['semantic_family_state'] != 'semantic_family_match' for r in rows) == m['semantic_family_hold_period_count']
          assert all(r['promotion_state'] == 'metadata_qualified_resource_transport_pending' for r in rows)
          PY

      - name: Commit corrected frozen inventory audit
        run: |
          git add \
            data/analysis/engine/investment_realization_v1/m27-bkpm-resource-inventory.csv \
            data/analysis/engine/investment_realization_v1/m27-bkpm-semantic-audit.csv \
            data/manifests/milestone27_bkpm_resource_inventory.json
          if git diff --cached --quiet; then
            echo 'M27 semantic audit unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm27: correct transport representation and qualify semantic continuity'
          git pull --rebase origin agent/milestone27-bkpm-investment-history
          git push origin HEAD:agent/milestone27-bkpm-investment-history
