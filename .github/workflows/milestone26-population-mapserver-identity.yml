name: Milestone 26 population MapServer identity

on:
  pull_request:
    paths:
      - data/manifests/milestone26_population_mapserver_identity_contract.json
      - scripts/probe_milestone26_population_mapserver_identity.py
      - tests/test_milestone26_population_mapserver_identity.py
      - .github/workflows/milestone26-population-mapserver-identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile MapServer identity probe
        run: python -m py_compile scripts/probe_milestone26_population_mapserver_identity.py

      - name: Run locked tests before live probe
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_milestone26_population_mapserver_identity.py

      - name: Probe official BNPB MapServer identity and raw-pixel surface
        run: python -m scripts.probe_milestone26_population_mapserver_identity

      - name: Assert qualification boundaries and frozen evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('data/manifests/milestone26_population_mapserver_identity.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-population-mapserver-identity/v1'
          assert manifest['source_id'] == 'inarisk_population_2020'
          assert manifest['stage1_population_aggregation_authorized'] is False
          assert manifest['numeric_aggregation_performed'] is False
          assert manifest['substantive_value_promotion_performed'] is False
          assert manifest['cross_geography_numeric_extraction_performed'] is False
          assert manifest['aggregation_semantics_changed'] is False
          assert manifest['source_family_changed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['statistical_model_fit'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False
          for response in manifest['responses'].values():
              evidence = Path(response['body_path'])
              assert evidence.exists()
              assert hashlib.sha256(evidence.read_bytes()).hexdigest() == response['body_sha256']
          PY

      - name: Re-run focused tests after live probe
        run: python -m pytest -q tests/test_milestone26_population_mapserver_identity.py

      - name: Commit frozen MapServer qualification evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            data/processed/bnpb/m26_population_mapserver_identity \
            data/manifests/milestone26_population_mapserver_identity.json
          if git diff --cached --quiet; then
            echo 'No MapServer identity evidence changes'
            exit 0
          fi
          git commit -m "Freeze Milestone 26 population MapServer identity"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
