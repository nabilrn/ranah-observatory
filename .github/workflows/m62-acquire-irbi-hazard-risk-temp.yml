name: M62 Acquire IRBI Hazard Risk TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/acquire_milestone62_irbi_hazard_risk_2024.py'
      - 'scripts/finalize_milestone62_irbi_hazard_risk_2024.py'
      - '.github/workflows/m62-acquire-irbi-hazard-risk-temp.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and finalize official M62 hazard-risk tables
        run: |
          python scripts/acquire_milestone62_irbi_hazard_risk_2024.py
          python scripts/finalize_milestone62_irbi_hazard_risk_2024.py
      - name: Commit frozen M62 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bnpb/irbi_hazard_risk_2024 \
                  data/manifests/milestone62_irbi_hazard_risk_2024_acquisition.json \
                  data/manifests/milestone62_irbi_hazard_risk_2024_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize M62 IRBI hazard-risk table'
          git push origin HEAD:research/evidence
