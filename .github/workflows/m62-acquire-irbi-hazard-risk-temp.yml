name: M62 Finalize IRBI Hazard Risk TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/finalize_milestone62_irbi_hazard_risk_2024.py'
      - '.github/workflows/m62-acquire-irbi-hazard-risk-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize frozen M62 hazard-risk table
        run: python scripts/finalize_milestone62_irbi_hazard_risk_2024.py
      - name: Commit frozen M62 canonical output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bnpb/irbi_hazard_risk_2024/irbi-sumbar-hazard-risk-2024-canonical.csv \
                  data/manifests/milestone62_irbi_hazard_risk_2024_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair M62 canonical coverage summary'
          git push origin HEAD:research/evidence
