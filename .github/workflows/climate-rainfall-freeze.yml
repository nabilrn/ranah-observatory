name: Climate rainfall freeze

on:
  pull_request:
    paths:
      - "scripts/freeze_chirps_rainfall.py"
      - "scripts/validate_chirps_rainfall_freeze.py"
      - "scripts/run_chirps_rainfall_production_resilient.py"
      - ".github/workflows/climate-rainfall-freeze.yml"
      - "scripts/materialize_chirps_rainfall.py"
      - "scripts/build_chirps_rainfall_production.py"
      - "scripts/build_chirps_rainfall_sample.py"
      - "data/registries/big_geography_map.csv"
      - "data/registries/geographies.csv"
      - "data/registries/indicators.csv"
      - "data/processed/climate/rainfall/**"
      - "docs/CLIMATE_RAINFALL_FREEZE.md"

permissions:
  contents: write

jobs:
  generate-validate-and-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            rasterio==1.5.0 \
            shapely==2.1.2 \
            pyproj==3.7.2

      - name: Re-run materialization regression tests
        run: python -m unittest tests.test_chirps_rainfall_materialization -v

      - name: Validate repository-freeze idempotence guards
        run: python -m unittest tests.test_chirps_rainfall_freeze -v

      - name: Validate bounded raster retry behavior
        run: python -m unittest tests.test_chirps_raster_retry -v

      - name: Rebuild full 1981-2025 rainfall candidates with bounded fresh-process retry
        run: |
          set -uo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "CHIRPS production attempt ${attempt}/3"
            rm -rf artifacts/chirps-rainfall-production
            if python -m scripts.run_chirps_rainfall_production_resilient \
              --output-dir artifacts/chirps-rainfall-production; then
              success=1
              break
            fi
            echo "Attempt ${attempt}/3 failed before a complete 540-COG production manifest."
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "${success}" -ne 1 ]; then
            echo "All three fresh-process CHIRPS production attempts failed."
            exit 1
          fi

      - name: Rebuild canonical candidate
        run: |
          python -m scripts.materialize_chirps_rainfall \
            artifacts/chirps-rainfall-production/chirps_rainfall_production_annual.csv \
            artifacts/chirps-rainfall-production/chirps_rainfall_production_manifest.json \
            --output-dir artifacts/chirps-rainfall-materialization

      - name: Freeze or reuse repository baseline
        run: |
          python -m scripts.freeze_chirps_rainfall \
            artifacts/chirps-rainfall-materialization \
            --output-dir data/processed/climate/rainfall

      - name: Validate frozen repository baseline
        run: python -m scripts.validate_chirps_rainfall_freeze

      - name: Commit generated baseline to PR branch only when content actually changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/rainfall/
          if git diff --cached --quiet; then
            echo "Frozen baseline already matches generated output; no baseline commit needed."
            exit 0
          fi
          git commit -m "data: freeze CHIRPS annual rainfall baseline"
          git push origin "HEAD:${HEAD_REF}"
