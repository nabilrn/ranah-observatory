name: M66 Product Preflight TEMP

on:
  push:
    branches: [release/publication]
    paths:
      - '.github/workflows/m66-wire-risk-mitigation-temp.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/publication
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type and Svelte checks
        run: npm run check
      - name: Build static product with v4 data promotion
        run: npm run build
      - name: Validate generated public v4 artifact
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('web/static/data/disaster-summary.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema'] == 'ranah-observatory/public-disaster-summary/v4'
          rm = data['risk_mitigation_2024']
          assert rm['risk']['row_count'] == 124
          assert len(rm['risk']['hazard_ids']) == 9
          assert rm['risk']['absent_source_pairs'] == 47
          assert rm['recommendations']['action_count'] == 49
          assert rm['recommendations']['hazard_count'] == 9
          assert len(rm['unmatched_krb_hazards']) == 5
          assert rm['boundaries']['lookup_join_authorized'] is True
          for key in (
              'global_taxonomy_equivalence_authorized',
              'numeric_value_equivalence_authorized',
              'event_taxonomy_join_authorized',
              'prediction_claim_authorized',
              'recommendations_are_implementation_evidence',
              'absent_irbi_pair_means_zero_risk',
          ):
              assert rm['boundaries'][key] is False
          print({'schema': data['schema'], 'risk_rows': 124, 'actions': 49})
          PY
