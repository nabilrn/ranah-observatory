name: Deploy Public Product

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - scripts/validate_public_product.py
      - scripts/validate_public_readiness.py
      - scripts/validate_public_history.py
      - scripts/build_public_history.py
      - scripts/build_public_district_explorer.py
      - scripts/build_public_indicator_catalog.py
      - publication/v0.1/claim-ledger.csv
      - data/analysis/engine/hierarchical_trajectory_v1/m22-geography-trajectories.csv
      - data/analysis/engine/panel_v3/m46-indicator-metadata.csv
      - data/analysis/engine/panel_v3/m46-indicator-coverage.csv
      - data/manifests/milestone18_final_analytical_synthesis.json
      - data/analysis/engine/final_synthesis_v1/m18-research-question-readiness.csv
      - data/validation/climate/station/m36/**
      - data/validation/historical/public_finance_2000/bps_construction_establishment_count_trajectory_2002_2006.json
      - data/validation/historical/public_finance_2000/bps_construction_se06_listing_boundary_2006.json
      - data/validation/historical/public_finance_2000/bps_construction_qualification_semantic_bridge_boundary_2003_2005.json
      - .github/workflows/deploy-public-product.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-product-pages
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate public narrative claim gating
        run: python scripts/validate_public_product.py

      - name: Validate public research readiness against frozen M18 synthesis
        run: python scripts/validate_public_readiness.py

      - name: Validate bounded public historical context
        run: python scripts/validate_public_history.py

      - name: Rebuild and require deterministic district explorer
        run: |
          cp site/data/districts.json /tmp/districts-frozen.json
          python scripts/build_public_district_explorer.py
          diff -u /tmp/districts-frozen.json site/data/districts.json

      - name: Rebuild and require deterministic indicator catalog
        run: |
          cp site/data/indicators.json /tmp/indicators-frozen.json
          python scripts/build_public_indicator_catalog.py
          diff -u /tmp/indicators-frozen.json site/data/indicators.json

      - name: Rebuild and require deterministic historical context
        run: |
          python scripts/build_public_history.py --output /tmp/history-rebuilt.json
          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path('site/data/history.json').read_text(encoding='utf-8'))
          rebuilt = json.loads(Path('/tmp/history-rebuilt.json').read_text(encoding='utf-8'))
          assert frozen == rebuilt, 'site/data/history.json drifted from canonical manifests'
          print({'history_contract_match': True})
          PY

      - name: Validate static product surface
        run: |
          node --check site/app.js
          node --check site/readiness.js
          node --check site/catalog.js
          node --check site/history.js
          node --check site/glossary.js
          test -s site/index.html
          test -s site/styles.css
          test -s site/explorer.css
          test -s site/readiness.css
          test -s site/catalog.css
          test -s site/history.css
          test -s site/glossary.css
          test -s site/app.js
          test -s site/readiness.js
          test -s site/catalog.js
          test -s site/history.js
          test -s site/glossary.js
          test -s site/data/overview.json
          test -s site/data/districts.json
          test -s site/data/readiness.json
          test -s site/data/indicators.json
          test -s site/data/history.json
          test -s site/data/glossary.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload public product artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
