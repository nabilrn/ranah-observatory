name: M60 Acquire BPBD Profile 2014-2024 TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/acquire_milestone60_bpbd_profile_2014_2024.py'
      - '.github/workflows/m60-acquire-bpbd-profile-2014-2024-temp.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Freeze official M60 JPEG and audit crops
        run: python scripts/acquire_milestone60_bpbd_profile_2014_2024.py
      - name: Commit frozen M60 artifact and crops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/bpbd/m60_profile_2014_2024 data/processed/bpbd/disaster_profile_2014_2024 data/manifests/milestone60_bpbd_profile_2014_2024_acquisition.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze M60 BPBD historical disaster profile'
          git push origin HEAD:research/evidence
