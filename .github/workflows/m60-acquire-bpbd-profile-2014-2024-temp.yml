name: M60 Acquire BPBD Profile 2014-2024 TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/acquire_milestone60_bpbd_profile_2014_2024.py'
      - '.github/workflows/m60-acquire-bpbd-profile-2014-2024-temp.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Rebuild official M60 JPEG and audit crops
        run: python scripts/acquire_milestone60_bpbd_profile_2014_2024.py
      - name: One diagnostic OCR pass on enlarged annual table
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter
          from pathlib import Path
          src = Path('data/processed/bpbd/disaster_profile_2014_2024/annual-chart-table-audit-crop.png')
          out = Path('/tmp/m60-ocr-input.png')
          im = Image.open(src).convert('L')
          im = ImageOps.autocontrast(im)
          im = ImageEnhance.Contrast(im).enhance(2.0)
          im = ImageOps.invert(im)
          im = im.filter(ImageFilter.SHARPEN)
          im.save(out)
          PY
          tesseract /tmp/m60-ocr-input.png stdout --psm 6 2>/dev/null > data/processed/bpbd/disaster_profile_2014_2024/diagnostic-ocr.txt
      - name: Commit diagnostic OCR text only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bpbd/disaster_profile_2014_2024/diagnostic-ocr.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add M60 diagnostic OCR transcript'
          git push origin HEAD:research/evidence
