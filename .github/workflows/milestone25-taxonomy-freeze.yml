name: Milestone 25 freeze DJPK taxonomy

# Temporary writer for public, credential-free DJPK Stage 0 evidence. Remove before merge.
on:
  pull_request:
    paths:
      - .github/workflows/milestone25-taxonomy-freeze.yml
      - scripts/probe_milestone25_djpk_taxonomy.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run locked Stage 0 taxonomy probe
        run: python scripts/probe_milestone25_djpk_taxonomy.py
      - name: Assert Stage 0 completion and five predeclared families
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone25_taxonomy_discovery.json').read_text())
          assert m['stage0_complete'] is True
          assert m['all_pages_pass'] is True
          assert m['page_count'] == 8
          assert len(m['conceptual_account_family_results']) == 5
          assert m['cross_geography_values_inspected_before_taxonomy_lock'] is False
          assert m['statistical_model_fit'] is False
          assert m['derived_ratio_created'] is False
          PY
      - name: Commit credential-free taxonomy evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/djpk_finance_v1/m25-taxonomy-discovery.csv \
            data/analysis/engine/djpk_finance_v1/m25-account-presence.csv \
            data/manifests/milestone25_taxonomy_discovery.json \
            data/processed/djpk/taxonomy_probe
          if git diff --cached --quiet; then
            echo 'No Stage 0 changes'
            exit 0
          fi
          git commit -m "Materialize Milestone 25 DJPK taxonomy discovery"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
