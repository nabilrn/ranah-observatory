name: Milestone 26 DIBI canonical crosswalk correction

on:
  pull_request:
    paths:
      - scripts/materialize_milestone26_dibi_occurrence_context_v2.py
      - data/manifests/milestone26_dibi_canonical_crosswalk_amendment.json
      - data/registries/bnpb_geography_map.csv
      - data/processed/bnpb/m26_dibi_occurrence_context/**
      - .github/workflows/milestone26-dibi-canonical-crosswalk-correction.yml
  push:
    branches:
      - agent/milestone26-disaster-risk-chain
    paths:
      - scripts/materialize_milestone26_dibi_occurrence_context_v2.py
      - data/manifests/milestone26_dibi_canonical_crosswalk_amendment.json
      - .github/workflows/milestone26-dibi-canonical-crosswalk-correction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-canonical-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile corrected materializer
        run: |
          python -m py_compile scripts/materialize_milestone26_dibi_occurrence_context.py
          python -m py_compile scripts/materialize_milestone26_dibi_occurrence_context_v2.py
      - name: Re-materialize only from already frozen DIBI evidence
        run: python -m scripts.materialize_milestone26_dibi_occurrence_context_v2 --mode offline
      - name: Verify exact crosswalk and no scientific expansion
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/manifests/milestone26_stage1_dibi_occurrence_context.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'ranah-observatory/milestone26-stage1-dibi-occurrence-context/v2'
          assert manifest['geography_count'] == 19
          assert manifest['observation_count'] == 19
          assert manifest['exact_source_key_set_pass'] is True
          assert manifest['exact_canonical_geography_set_pass'] is True
          assert manifest['source_geography_key'] == 'NO_KAB'
          assert manifest['source_key_assumed_canonical'] is False
          assert manifest['canonical_crosswalk_applied'] is True
          assert manifest['source_numeric_values_changed_by_crosswalk_correction'] is False
          assert manifest['historical_boundary_reconstruction_performed'] is False
          assert manifest['aggregate_2015_2024_source_values_repartitioned'] is False
          assert manifest['semantic_interpretation_of_abbreviated_field_names_performed'] is False
          assert manifest['observed_impact_inference_performed'] is False
          assert manifest['risk_synthesis_authorized'] is False
          assert manifest['causal_claim_created'] is False
          assert manifest['monetary_wasted_potential_estimated'] is False

          with Path(manifest['outputs']['component_frame']).open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          by_source = {int(row['NO_KAB']): row for row in rows}
          assert by_source[1307]['geography_id'] == 'idn.13.1308'
          assert by_source[1309]['geography_id'] == 'idn.13.1301'
          assert by_source[1310]['geography_id'] == 'idn.13.1311'
          assert by_source[1311]['geography_id'] == 'idn.13.1310'
          assert len({row['geography_id'] for row in rows}) == 19
          PY
      - name: Commit corrected derived identity only
        run: |
          git add \
            data/analysis/engine/disaster_risk_chain_v1/m26-stage1-dibi-occurrence-context.csv \
            data/analysis/engine/disaster_risk_chain_v1/m26-stage1-dibi-occurrence-provenance.csv \
            data/manifests/milestone26_stage1_dibi_occurrence_context.json
          if git diff --cached --quiet; then
            echo 'Canonicalized DIBI outputs unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm26: correct DIBI canonical geography identities'
          git push origin HEAD:agent/milestone26-disaster-risk-chain
