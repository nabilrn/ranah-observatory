name: Milestone 10 Analytical Panel Reproducibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Research Foundation 9/9 remains complete
        run: python -m scripts.audit_research_foundation_complete --require-complete

      - name: Rebuild Milestone 10 analytical panel
        run: python -m scripts.build_milestone10_analytical_panel

      - name: Enforce Milestone 10 completion audit
        run: python -m scripts.audit_milestone10_analytical_panel --require-complete

      - name: Run Milestone 10 tests
        run: python -m unittest tests.test_milestone10_analytical_panel -v

      - name: Revalidate canonical data foundation
        run: python scripts/validate_data_foundation.py

      - name: Revalidate historical reconstruction foundation
        run: python scripts/validate_historical_reconstruction.py

      - name: Require byte-identical committed outputs
        run: |
          git diff --exit-code -- \
            data/analysis/engine/panel_v1 \
            data/manifests/milestone10_analytical_panel.json
