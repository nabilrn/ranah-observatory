name: Milestone 23 data-value readiness reproducibility

on:
  pull_request:
    paths:
      - research/MILESTONE23_DATA_VALUE_MODEL_READINESS_SPEC.md
      - docs/MILESTONE23_DATA_VALUE_MODEL_READINESS.md
      - data/registries/m23-official-source-candidates.csv
      - data/manifests/milestone23_data_value_model_readiness.json
      - data/analysis/engine/data_value_readiness_v1/**
      - scripts/build_milestone23_data_value_model_readiness.py
      - scripts/audit_milestone23_data_value_model_readiness.py
      - tests/test_milestone23_data_value_model_readiness.py
      - .github/workflows/milestone23-data-value-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve committed M23 artifacts
        run: |
          mkdir -p /tmp/m23-committed
          cp -a data/analysis/engine/data_value_readiness_v1 /tmp/m23-committed/data_value_readiness_v1
          cp data/manifests/milestone23_data_value_model_readiness.json /tmp/m23-committed/milestone23_data_value_model_readiness.json
      - name: Rebuild M23 artifacts
        run: python scripts/build_milestone23_data_value_model_readiness.py
      - name: Audit M23 outputs
        run: python scripts/audit_milestone23_data_value_model_readiness.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused M23 tests
        run: python -m pytest -q tests/test_milestone23_data_value_model_readiness.py
      - name: Verify byte-identical outputs
        shell: bash
        run: |
          set -euo pipefail
          diff -r /tmp/m23-committed/data_value_readiness_v1 data/analysis/engine/data_value_readiness_v1
          cmp /tmp/m23-committed/milestone23_data_value_model_readiness.json data/manifests/milestone23_data_value_model_readiness.json
          git diff --exit-code -- data/analysis/engine/data_value_readiness_v1 data/manifests/milestone23_data_value_model_readiness.json
