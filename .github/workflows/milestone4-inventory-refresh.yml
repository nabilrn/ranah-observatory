name: Milestone 4 Inventory Refresh

on:
  push:
    branches:
      - agent/milestone4-indicator-batch-1
    paths:
      - ".github/workflows/milestone4-inventory-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone4-indicator-batch-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate inventory with hardened audit
        run: python scripts/audit_milestone4_indicators.py --require-complete

      - name: Require clean Milestone 4 integrity state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/manifests/milestone4_indicator_inventory.json').read_text())
          assert p['qualified_indicator_count'] == 40, p
          assert p['missing_observation_ids'] == [], p
          assert p['duplicate_observation_ids'] == [], p
          assert p['unresolved_provenance'] == [], p
          PY

      - name: Commit refreshed inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/milestone4_indicator_inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: refresh hardened milestone 4 inventory"
          git push origin HEAD:agent/milestone4-indicator-batch-1
