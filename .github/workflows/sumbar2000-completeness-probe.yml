name: Sumbar 2000 Official Artifact Completeness Probe

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar2000-completeness-probe.yml

permissions:
  contents: write

env:
  SUMBAR2000_URL: 'https://web-api.bps.go.id/download.php?f=LohU2NCB0%2BCnYSh%%3D'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch exact official BPS bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 240 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence acquisition' \
            "$SUMBAR2000_URL" -o /tmp/sumbar2000.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sumbar2000.pdf')
          b = p.read_bytes()
          assert p.stat().st_size > 10_000_000, p.stat().st_size
          assert b.startswith(b'%PDF-')
          assert b'%%EOF' in b[-16384:]
          print({'bytes': p.stat().st_size})
          PY

      - name: Build exact-artifact manifest and bounded raster preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p /tmp/sumbar2000-probe
          pages="$(pdfinfo /tmp/sumbar2000.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -gt 20
          mid="$(( (pages + 1) / 2 ))"
          sha="$(sha256sum /tmp/sumbar2000.pdf | awk '{print $1}')"
          bytes="$(stat -c %s /tmp/sumbar2000.pdf)"
          text_chars="$(pdftotext -layout /tmp/sumbar2000.pdf - 2>/dev/null | wc -c | tr -d ' ')"
          pdftoppm -f 1 -l 1 -singlefile -jpeg -r 90 /tmp/sumbar2000.pdf /tmp/sumbar2000-probe/page-1 >/dev/null 2>&1
          pdftoppm -f "$mid" -l "$mid" -singlefile -jpeg -r 90 /tmp/sumbar2000.pdf /tmp/sumbar2000-probe/page-mid >/dev/null 2>&1
          pdftoppm -f "$pages" -l "$pages" -singlefile -jpeg -r 90 /tmp/sumbar2000.pdf /tmp/sumbar2000-probe/page-last >/dev/null 2>&1
          python - <<PY
          import json
          from pathlib import Path
          manifest = {
            'schema': 'ranah-observatory/sumbar2000-official-artifact-probe/v1',
            'title': 'Sumatera Barat Dalam Angka Tahun 2000',
            'catalog_number': '1102001.13',
            'publication_number': '13000.2000',
            'issn_isbn': '0303-5328',
            'release_date': '2001-09-05',
            'official_page_url': 'https://sumbar.bps.go.id/id/publication/2001/09/05/e7d159765642b6b991651b12/sumatera-barat-dalam-angka-tahun-2000.html',
            'artifact_sha256': '$sha',
            'artifact_bytes': int('$bytes'),
            'pdf_page_count': int('$pages'),
            'builtin_text_char_count': int('$text_chars'),
            'sampled_pdf_pages': [1, int('$mid'), int('$pages')],
            'visual_completeness_review_pending': True,
            'full_publication_artifact_acquired': None,
            'numeric_extraction_started': False,
            'numeric_promotion_authorized': False,
          }
          Path('/tmp/sumbar2000-probe/manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(manifest)
          PY
          test "$(stat -c %s /tmp/sumbar2000-probe/page-1.jpg)" -lt 5000000
          test "$(stat -c %s /tmp/sumbar2000-probe/page-mid.jpg)" -lt 5000000
          test "$(stat -c %s /tmp/sumbar2000-probe/page-last.jpg)" -lt 5000000

      - uses: actions/upload-artifact@v4
        with:
          name: sumbar2000-completeness-probe
          path: /tmp/sumbar2000-probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retire one-time probe
        run: |
          rm .github/workflows/sumbar2000-completeness-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sumbar2000-completeness-probe.yml
          git commit -m 'Retire Sumbar 2000 completeness probe'
          git push origin HEAD:research/evidence
