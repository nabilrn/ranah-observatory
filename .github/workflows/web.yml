name: Web foundation

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'catalog/public-datasets.csv'
      - 'scripts/build_public_web_data.py'
      - 'scripts/promote_public_disaster_context.py'
      - 'data/processed/bnpb/disaster/**'
      - 'data/processed/bpbd/disaster_impact_2023/**'
      - 'data/processed/bpbd/disaster_impact_2024/**'
      - 'data/processed/bpbd/disaster_context_2024/**'
      - 'data/processed/geography/sumbar-big-kabkota.geojson'
      - 'data/registries/big_geography_map.csv'
      - 'data/manifests/sumbar_big_kabkota_boundary.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'catalog/public-datasets.csv'
      - 'scripts/build_public_web_data.py'
      - 'scripts/promote_public_disaster_context.py'
      - 'data/processed/bnpb/disaster/**'
      - 'data/processed/bpbd/disaster_impact_2023/**'
      - 'data/processed/bpbd/disaster_impact_2024/**'
      - 'data/processed/bpbd/disaster_context_2024/**'
      - 'data/processed/geography/sumbar-big-kabkota.geojson'
      - 'data/registries/big_geography_map.csv'
      - 'data/manifests/sumbar_big_kabkota_boundary.json'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type and Svelte checks
        run: npm run check
      - name: Static build
        run: npm run build
