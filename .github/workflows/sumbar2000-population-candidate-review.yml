name: Sumbar 2000 Population Candidate Review

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar2000-population-candidate-review.yml

permissions:
  contents: write

env:
  SUMBAR2000_URL: 'https://web-api.bps.go.id/download.php?f=LohU2NCB0%2BCnYSh%%3D'
  EXPECTED_SHA256: '689318d0760f99ff82a54866295b580a0159ed0e39051b4342b8b7e9d13648cf'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - name: Fetch exact frozen artifact
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 240 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence acquisition' \
            "$SUMBAR2000_URL" -o /tmp/sumbar2000.pdf
          test "$(sha256sum /tmp/sumbar2000.pdf | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Render and extract population candidate pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p /tmp/sumbar2000-population-review
          pdftotext -f 92 -l 96 -layout /tmp/sumbar2000.pdf /tmp/sumbar2000-population-review/pages-92-96.txt
          for page in 92 93 94 95 96; do
            pdftoppm -f "$page" -l "$page" -singlefile -jpeg -r 120 \
              /tmp/sumbar2000.pdf "/tmp/sumbar2000-population-review/page-$page" >/dev/null 2>&1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/sumbar2000-population-review/pages-92-96.txt').read_text(encoding='utf-8', errors='replace')
          review = {
            'schema': 'ranah-observatory/sumbar2000-population-candidate-review/v1',
            'artifact_sha256': '689318d0760f99ff82a54866295b580a0159ed0e39051b4342b8b7e9d13648cf',
            'pdf_pages': [92, 93, 94, 95, 96],
            'candidate_tables': ['3.1.1', '3.1.2', '3.1.3'],
            'text_layer_chars': len(text),
            'review_role': 'visual and text-layer cross-check only; no canonical numeric promotion yet',
          }
          Path('/tmp/sumbar2000-population-review/review_manifest.json').write_text(
              json.dumps(review, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert len(text) > 5000, len(text)
          print(review)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sumbar2000-population-candidate-review
          path: /tmp/sumbar2000-population-review/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retire one-time workflow
        run: |
          rm .github/workflows/sumbar2000-population-candidate-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sumbar2000-population-candidate-review.yml
          git commit -m 'Retire Sumbar 2000 population candidate review'
          git push origin HEAD:research/evidence
