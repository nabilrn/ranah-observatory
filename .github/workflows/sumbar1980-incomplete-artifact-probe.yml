name: Sumbar 1980 Official Artifact Completeness Probe

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar1980-incomplete-artifact-probe.yml

permissions:
  contents: write

env:
  SUMBAR1980_URL: 'https://web-api.bps.go.id/download.php?f=cy3hBAoIAHpWQKME%%3D'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch exact official BPS bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 180 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence acquisition' \
            "$SUMBAR1980_URL" -o /tmp/sumbar1980.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sumbar1980.pdf')
          b = p.read_bytes()
          assert p.stat().st_size > 1_000_000, p.stat().st_size
          assert b.startswith(b'%PDF-')
          assert b'%%EOF' in b[-16384:]
          print({'bytes': p.stat().st_size})
          PY

      - name: Verify digital artifact is front matter only
        run: |
          if ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pages="$(pdfinfo /tmp/sumbar1980.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" = '22'
          echo "official_pdf_pages=$pages"

      - name: Freeze incomplete-artifact provenance
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          pdf = Path('/tmp/sumbar1980.pdf')
          digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
          out = Path('data/validation/historical/sumbar1980')
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              'schema': 'ranah-observatory/sumbar1980-incomplete-official-artifact/v1',
              'source': 'BAPPEDA Tingkat I Sumatera Barat + Kantor Sensus dan Statistik Provinsi Sumatera Barat / BPS',
              'title': 'Sumatera Barat Dalam Angka Tahun 1980',
              'catalog_number': '1102001.13',
              'publication_number': '13000.1981',
              'issn_isbn': '0303-5328',
              'release_date': '1981-08-18',
              'official_page_url': 'https://sumbar.bps.go.id/id/publication/1981/08/18/a41db922f366817818a2a68a/sumatera-barat-dalam-angka-tahun-1980.html',
              'official_direct_artifact_url': os.environ['SUMBAR1980_URL'],
              'artifact_sha256': digest,
              'artifact_bytes': pdf.stat().st_size,
              'pdf_page_count': 22,
              'retrieved_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'retrieval_surface': 'web-api.bps.go.id public direct download',
              'visual_completeness_review': {
                  'cover_present': True,
                  'table_of_contents_present': True,
                  'last_pdf_page_is_table_of_contents': True,
                  'toc_references_population_table_start_printed_page': 103,
                  'toc_references_regional_income_tables_through_printed_page': 788,
                  'data_table_body_present_in_downloaded_pdf': False,
                  'review_method': 'manual visual review of exact official PDF screenshots',
              },
              'full_publication_artifact_acquired': False,
              'artifact_role': 'official digitized front matter / table-of-contents fragment only',
              'numeric_extraction_started': False,
              'numeric_promotion_authorized': False,
              'historical_anchor_satisfied': False,
              'next_gate': 'locate a complete official BPS softcopy/archive containing the referenced table body before numeric extraction',
          }
          (out / 'incomplete_artifact_manifest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print({'sha256': digest, 'bytes': pdf.stat().st_size, 'pages': 22})
          PY

      - name: Validate fail-closed completeness boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/validation/historical/sumbar1980/incomplete_artifact_manifest.json').read_text())
          assert m['pdf_page_count'] == 22
          assert m['visual_completeness_review']['last_pdf_page_is_table_of_contents'] is True
          assert m['visual_completeness_review']['toc_references_regional_income_tables_through_printed_page'] == 788
          assert m['visual_completeness_review']['data_table_body_present_in_downloaded_pdf'] is False
          assert m['full_publication_artifact_acquired'] is False
          assert m['numeric_extraction_started'] is False
          assert m['numeric_promotion_authorized'] is False
          assert m['historical_anchor_satisfied'] is False
          print({'completeness_gate': 'blocked_as_expected'})
          PY

      - name: Commit rejection evidence and retire probe
        run: |
          rm .github/workflows/sumbar1980-incomplete-artifact-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/historical/sumbar1980/incomplete_artifact_manifest.json \
            .github/workflows/sumbar1980-incomplete-artifact-probe.yml
          git commit -m 'Freeze incomplete official Sumbar 1980 artifact finding'
          git push origin HEAD:research/evidence
