name: Milestone 21 materialize

on:
  push:
    branches:
      - agent/milestone21-climate-regime-shift
    paths:
      - research/MILESTONE21_CLIMATE_REGIME_SHIFT_SPEC.md
      - data/manifests/milestone21_design_gate.json
      - scripts/build_milestone21_climate_regime_shift.py
      - tests/test_milestone21_climate_regime_shift.py
      - .github/workflows/milestone21-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build M21 artifacts
        run: python scripts/build_milestone21_climate_regime_shift.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused M21 tests
        run: python -m pytest -q tests/test_milestone21_climate_regime_shift.py
      - name: Commit deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/analysis/engine/climate_regime_shift_v1/m21-rolling-backtest.csv \
            data/analysis/engine/climate_regime_shift_v1/m21-breakpoint-candidates.csv \
            data/analysis/engine/climate_regime_shift_v1/m21-full-series-regime.csv \
            data/manifests/milestone21_climate_regime_shift.json
          if git diff --cached --quiet; then
            echo "No materialization changes"
            exit 0
          fi
          git commit -m "Materialize Milestone 21 climate regime-shift outputs"
          git push origin HEAD:${GITHUB_REF_NAME}
