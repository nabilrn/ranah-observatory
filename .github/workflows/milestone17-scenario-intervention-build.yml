name: Milestone 17 Scenario Intervention Build

on:
  push:
    branches:
      - agent/milestone17-scenario-intervention
    paths:
      - "research/MILESTONE17_SCENARIO_INTERVENTION_SPEC.md"
      - "scripts/build_milestone17_scenario_intervention.py"
      - ".github/workflows/milestone17-scenario-intervention-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone17-scenario-intervention-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out M17 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone17-scenario-intervention
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build scenario and intervention engine
        run: python -m scripts.build_milestone17_scenario_intervention

      - name: Commit deterministic M17 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/engine/scenario_intervention_v1 data/manifests/milestone17_scenario_intervention.json
          if git diff --cached --quiet; then
            echo "Milestone 17 outputs unchanged."
            exit 0
          fi
          git commit -m "research: materialize milestone17 scenario engine"
          git pull --rebase origin agent/milestone17-scenario-intervention
          git push origin HEAD:agent/milestone17-scenario-intervention
