name: Milestone 28 Stage 2B Offline Reproducibility Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - data/processed/bps/m28_stage2b_full_history/**
      - data/analysis/engine/broader_panel_v1/m28-broader-panel-observations.csv
      - data/analysis/engine/broader_panel_v1/m28-broader-panel-provenance.csv
      - data/analysis/engine/broader_panel_v1/m28-full-history-audit.csv
      - data/analysis/engine/broader_panel_v1/m28-indicator-year-coverage.csv
      - data/manifests/milestone28_stage2b_full_history.json
      - data/manifests/milestone28_stage2b_offline_reproducibility.json
      - scripts/audit_milestone28_stage2b_offline_rebuild.py
      - .github/workflows/milestone28-stage2b-offline-reproducibility.yml

permissions:
  contents: read

jobs:
  rebuild-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild all canonical outputs offline
        run: python scripts/audit_milestone28_stage2b_offline_rebuild.py
      - name: Verify byte-identical certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone28_stage2b_offline_reproducibility.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone28-stage2b-offline-reproducibility/v1'
          assert m['offline_only'] is True
          assert m['network_requests_performed'] is False
          assert m['raw_snapshot_count_verified'] == 49
          assert m['replayed_candidate_year_count'] == 49
          assert m['qualified_candidate_year_count'] == 49
          assert m['structured_missing_candidate_year_count'] == 7
          assert m['promoted_observation_count'] == 931
          assert m['all_outputs_byte_identical'] is True
          assert m['rebuild_success'] is True
          assert all(v['byte_identical'] for v in m['outputs'].values())
          print({'rebuild_success': True, 'observations': 931})
          PY
