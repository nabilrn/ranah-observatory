name: M57 Materialize BPBD Events 2023 TEMP

on:
  push:
    branches:
      - research/evidence
    paths:
      - 'scripts/acquire_milestone57_bpbd_events_2023.py'
      - 'scripts/finalize_milestone57_bpbd_events_2023.py'
      - '.github/workflows/m57-materialize-bpbd-events-2023-temp.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and finalize M57
        run: |
          python scripts/acquire_milestone57_bpbd_events_2023.py
          python scripts/finalize_milestone57_bpbd_events_2023.py
      - name: Commit M57 manifests and outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bpbd/disaster_events_2023 data/manifests/milestone57_bpbd_events_2023.json data/manifests/milestone57_bpbd_events_2023_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize M57 BPBD 2023 event matrix'
          git push origin HEAD:research/evidence
