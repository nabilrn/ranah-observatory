name: Milestone 26 DIBI occurrence context (parked)

# Numeric extraction is intentionally parked after the preregistered exact-key
# query returned 3 rather than 19 Sumbar features. Run the identifier-only
# geography representation probe and amend the representation contract first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain parked gate
        run: |
          echo 'DIBI numeric production extraction is parked.'
          echo 'Reason: preregistered id_kab_bps representation returned 3/19 features.'
          echo 'No Total_* values were committed by the failed production run.'
          echo 'Next gate: identifier-only geography representation probe.'
