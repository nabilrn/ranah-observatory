name: Temporary Sumbar Yearbooks Construction Qualification Probe

on:
  pull_request:
    paths:
      - "scripts/probe_sumbar_yearbooks_construction_qualification_2004_2007.py"
      - ".github/workflows/temp-sumbar-yearbooks-construction-qualification-probe.yml"

permissions:
  contents: read

jobs:
  probe-targeted-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install embedded-text PDF extractor
        run: python -m pip install --disable-pip-version-check --no-cache-dir pypdf==6.0.0
      - name: Inspect acquired official 2004-2005 yearbook
        run: python scripts/probe_sumbar_yearbooks_construction_qualification_2004_2007.py
      - name: Upload targeted context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumbar-yearbook-2004-2005-targeted-context-probe
          path: probe-output/sumbar-yearbook-2004-2005-targeted-context-probe.json
          if-no-files-found: error
