name: Temporary Sumbar Yearbooks Construction Qualification Probe

on:
  pull_request:
    paths:
      - "scripts/probe_sumbar_yearbooks_deep_search_2004_2007.py"
      - ".github/workflows/temp-sumbar-yearbooks-construction-qualification-probe.yml"

permissions:
  contents: read

jobs:
  probe-deep-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official BPS Deep Search yearbooks
        run: python scripts/probe_sumbar_yearbooks_deep_search_2004_2007.py
      - name: Upload bounded Deep Search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumbar-yearbooks-deep-search-probe
          path: probe-output/sumbar-yearbooks-deep-search-probe.json
          if-no-files-found: error
