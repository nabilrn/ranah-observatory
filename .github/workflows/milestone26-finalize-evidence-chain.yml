name: Milestone 26 finalize disaster-risk evidence chain

on:
  pull_request:
    paths:
      - scripts/finalize_milestone26_disaster_risk_chain.py
      - data/manifests/milestone26_source_qualification.json
      - data/manifests/milestone26_stage1_population_component.json
      - data/manifests/milestone26_stage1_capacity_component.json
      - data/manifests/milestone26_stage1_dibi_occurrence_context.json
      - data/manifests/milestone26_stage2_observed_impact_decision.json
      - .github/workflows/milestone26-finalize-evidence-chain.yml
  push:
    branches:
      - agent/milestone26-disaster-risk-chain
    paths:
      - scripts/finalize_milestone26_disaster_risk_chain.py
      - data/manifests/milestone26_stage2_observed_impact_decision.json
      - .github/workflows/milestone26-finalize-evidence-chain.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone26-disaster-risk-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile finalizer
        run: python -m py_compile scripts/finalize_milestone26_disaster_risk_chain.py
      - name: Build M26 completion artifacts
        run: python -m scripts.finalize_milestone26_disaster_risk_chain
      - name: Verify completion semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone26_disaster_risk_chain_complete.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone26-disaster-risk-chain-complete/v1'
          assert m['milestone26_evidence_qualification_complete'] is True
          assert m['completion_semantics'] == 'staged_evidence_qualification_complete_composite_risk_model_not_authorized'
          assert m['geography_count'] == 19
          assert m['promoted_numeric_component_count'] == 3
          assert m['materialized_component_observation_count'] == 57
          assert m['components']['population_exposure']['observation_count'] == 19
          assert m['components']['capacity']['observation_count'] == 19
          assert m['components']['recorded_occurrence_context']['observation_count'] == 19
          assert m['components']['observed_impact']['observation_count_promoted'] == 0
          assert m['event_level_observed_impact_promoted'] is False
          assert m['undated_hazard_or_vulnerability_raster_aggregated'] is False
          assert m['dibi_abbreviated_fields_semantically_reinterpreted'] is False
          assert m['historical_boundary_reconstruction_performed'] is False
          assert m['cross_component_temporal_aggregation_performed'] is False
          assert m['risk_synthesis_authorized'] is False
          assert m['statistical_model_fit'] is False
          assert m['causal_claim_created'] is False
          assert m['monetary_loss_inferred'] is False
          assert m['monetary_wasted_potential_estimated'] is False
          assert Path('docs/MILESTONE26_DISASTER_RISK_CHAIN.md').exists()
          PY
      - name: Commit final M26 manifest and documentation
        run: |
          git add \
            data/manifests/milestone26_disaster_risk_chain_complete.json \
            docs/MILESTONE26_DISASTER_RISK_CHAIN.md
          if git diff --cached --quiet; then
            echo 'M26 completion artifacts unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm26: complete staged disaster-risk evidence qualification'
          git pull --rebase origin agent/milestone26-disaster-risk-chain
          git push origin HEAD:agent/milestone26-disaster-risk-chain
