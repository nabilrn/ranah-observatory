name: Milestone 21 climate regime-shift reproducibility

on:
  pull_request:
    paths:
      - research/MILESTONE21_CLIMATE_REGIME_SHIFT_SPEC.md
      - docs/MILESTONE21_CLIMATE_REGIME_SHIFT.md
      - data/manifests/milestone21_design_gate.json
      - data/manifests/milestone21_climate_regime_shift.json
      - data/analysis/engine/climate_regime_shift_v1/**
      - scripts/build_milestone21_climate_regime_shift.py
      - scripts/audit_milestone21_climate_regime_shift.py
      - tests/test_milestone21_climate_regime_shift.py
      - .github/workflows/milestone21-climate-regime-shift-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve committed M21 artifacts
        run: |
          mkdir -p /tmp/m21-committed
          cp -a data/analysis/engine/climate_regime_shift_v1 /tmp/m21-committed/climate_regime_shift_v1
          cp data/manifests/milestone21_climate_regime_shift.json /tmp/m21-committed/milestone21_climate_regime_shift.json
      - name: Rebuild M21 artifacts
        run: python scripts/build_milestone21_climate_regime_shift.py
      - name: Audit M21 outputs
        run: python scripts/audit_milestone21_climate_regime_shift.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused M21 tests
        run: python -m pytest -q tests/test_milestone21_climate_regime_shift.py
      - name: Verify byte-identical outputs
        shell: bash
        run: |
          set -euo pipefail
          diff -r /tmp/m21-committed/climate_regime_shift_v1 data/analysis/engine/climate_regime_shift_v1
          cmp /tmp/m21-committed/milestone21_climate_regime_shift.json data/manifests/milestone21_climate_regime_shift.json
          git diff --exit-code -- \
            data/analysis/engine/climate_regime_shift_v1 \
            data/manifests/milestone21_climate_regime_shift.json
