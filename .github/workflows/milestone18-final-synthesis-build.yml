name: Milestone 18 Final Synthesis Build

on:
  push:
    branches:
      - agent/milestone18-final-analytical-synthesis
    paths:
      - "research/MILESTONE18_FINAL_ANALYTICAL_SYNTHESIS_SPEC.md"
      - "scripts/build_milestone18_final_analytical_synthesis.py"
      - ".github/workflows/milestone18-final-synthesis-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone18-final-synthesis-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out M18 branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone18-final-analytical-synthesis
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build final analytical synthesis
        run: python -m scripts.build_milestone18_final_analytical_synthesis

      - name: Commit deterministic M18 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/engine/final_synthesis_v1 data/manifests/milestone18_final_analytical_synthesis.json
          if git diff --cached --quiet; then
            echo "Milestone 18 outputs unchanged."
            exit 0
          fi
          git commit -m "research: materialize milestone18 final synthesis"
          git pull --rebase origin agent/milestone18-final-analytical-synthesis
          git push origin HEAD:agent/milestone18-final-analytical-synthesis
