name: Milestone 25 Stage0 taxonomy transport recovery

# Micro-stage recovery: qualify only the 8-page Kota Padang taxonomy reference.
on:
  pull_request:
    paths:
      - .github/workflows/milestone25-recovery-freeze-v2.yml
      - scripts/probe_milestone25_djpk_taxonomy_export.py
      - scripts/apply_milestone25_transport_recovery.py
      - data/manifests/milestone25_transport_recovery_decision.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply transport-only recovery amendment
        run: python scripts/apply_milestone25_transport_recovery.py

      - name: Compile Stage0 transport code
        run: >-
          python -m py_compile
          scripts/probe_milestone25_djpk_taxonomy_export.py
          scripts/apply_milestone25_transport_recovery.py

      - name: Run Stage0 contract tests
        run: >-
          python -m pytest -q
          tests/test_milestone25_djpk_taxonomy.py
          tests/test_milestone25_djpk_export.py
          tests/test_milestone25_djpk_html_compat.py
          tests/test_milestone25_djpk_identity_aliases.py

      - name: Stage0 — freeze taxonomy from same-selector SpreadsheetML
        run: python scripts/probe_milestone25_djpk_taxonomy_export.py

      - name: Lock Stage1 exact-label contracts from recovered taxonomy
        run: python scripts/lock_milestone25_stage1_contracts.py

      - name: Assert Stage0 recovery footprint only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('data/manifests/milestone25_transport_amendment.json').read_text())
          m = json.loads(Path('data/manifests/milestone25_taxonomy_discovery.json').read_text())
          c = json.loads(Path('data/manifests/milestone25_stage1_contracts.json').read_text())
          assert t['scientific_design_changed'] is False
          assert t['amendment_revision'] == 2
          assert m['stage0_complete'] is True
          assert m['all_pages_pass'] is True
          assert m['page_count'] == 8
          assert m['taxonomy_primary_representation'] == 'djpk_csv_apbd_spreadsheetml_exact_rupiah'
          assert m['html_body_table_required'] is False
          assert m['spreadsheetml_account_table_required'] is True
          assert m['cross_geography_values_inspected_before_taxonomy_lock'] is False
          assert c['contracts_locked'] is True
          assert c['promoted_exact_label_family_count'] == 4
          assert set(c['promoted_exact_label_families']) == {
              'total_revenue', 'own_source_revenue_pad', 'total_expenditure', 'capital_expenditure'
          }
          assert c['held_families'] == ['central_transfer_revenue']
          assert not Path('data/manifests/milestone25_djpk_public_finance_complete.json').exists()
          PY

      - name: Commit recovered Stage0 evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/manifests/milestone25_transport_amendment.json \
            data/manifests/milestone25_transport_recovery_decision.json \
            data/manifests/milestone25_taxonomy_discovery.json \
            data/manifests/milestone25_stage1_contracts.json \
            data/registries/djpk_m25_stage1_account_contracts.csv \
            data/analysis/engine/djpk_finance_v1/m25-taxonomy-discovery.csv \
            data/analysis/engine/djpk_finance_v1/m25-account-presence.csv \
            data/processed/djpk/taxonomy_probe \
            scripts/probe_milestone25_djpk_taxonomy_export.py \
            scripts/apply_milestone25_transport_recovery.py \
            .github/workflows/milestone25-recovery-freeze-v2.yml
          if git diff --cached --quiet; then
            echo 'No Stage0 recovery changes'
            exit 0
          fi
          git commit -m "Recover Milestone 25 Stage0 taxonomy transport"
          target_branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:${target_branch}"
