name: M25 HTML realization-period triage

on:
  pull_request:
    paths:
      - .github/workflows/m25-html-period-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect source-reported realization period for persistent failures
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import probe_milestone25_djpk_stage1 as stage1

          keys = [
              ('01', 2021), ('02', 2021), ('04', 2021), ('06', 2021),
              ('07', 2021), ('07', 2022), ('08', 2021), ('10', 2021),
              ('11', 2021), ('13', 2021), ('14', 2021), ('15', 2021), ('16', 2021),
          ]
          crosswalk = {r['djpk_pemda_selector']: r for r in stage1.validate_crosswalk(Path('data/registries/djpk_sumbar_pemda.csv'))}

          def inspect(key):
              pemda, year = key
              url = stage1.build_url(pemda, year)
              status, body, final = stage1.fetch_url(url)
              parser = stage1.HTMLTableParser()
              parser.feed(body.decode('utf-8', errors='replace'))
              text = parser.all_text
              matches = re.findall(
                  r'[^.]{0,120}realisasi\s+apbd\s+s\.?\s*d\.?\s+([A-Za-z]+)[^.]{0,160}',
                  text,
                  flags=re.I,
              )
              return {
                  'pemda': pemda,
                  'source_name': crosswalk[pemda]['djpk_source_name'],
                  'year': year,
                  'http_status': status,
                  'requested_period_selector': '12',
                  'reported_realization_months': matches,
                  'december_match': any(m.casefold() == 'desember' for m in matches),
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=13) as pool:
              rows = list(pool.map(inspect, keys))
          for row in sorted(rows, key=lambda r: (r['year'], int(r['pemda']))):
              print('M25_PERIOD ' + json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
