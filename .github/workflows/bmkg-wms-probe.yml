name: BMKG Rainfall WMS Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bmkg-hazard-acquisition
    paths:
      - ".github/workflows/bmkg-wms-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official BMKG rainfall WMS once
        run: python scripts/probe_bmkg_wms.py --output /tmp/bmkg-wms-probe.json

      - name: Upload credential-free probe result
        uses: actions/upload-artifact@v4
        with:
          name: bmkg-rainfall-wms-probe
          path: /tmp/bmkg-wms-probe.json
          if-no-files-found: error
          retention-days: 14
