name: Final Clean Main Reproducibility Sweep

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 \
            rasterio==1.5.0 \
            shapely==2.1.2 \
            pyproj==3.7.2 \
            pytest

      - name: Validate frozen release, open gates, and model-testing contract
        run: |
          python scripts/validate_final_model_testing.py
          python scripts/validate_final_open_gates.py
          python scripts/validate_release_readiness.py
          python -m unittest tests.test_final_model_testing -v
          python -m unittest tests.test_final_open_gates -v
          python -m unittest tests.test_release_readiness -v

      - name: Rebuild deterministic public product data
        run: |
          cp site/data/districts.json /tmp/districts-frozen.json
          cp site/data/indicators.json /tmp/indicators-frozen.json
          python scripts/build_public_district_explorer.py
          python scripts/build_public_indicator_catalog.py
          python scripts/build_public_history.py --output /tmp/history-rebuilt.json
          diff -u /tmp/districts-frozen.json site/data/districts.json
          diff -u /tmp/indicators-frozen.json site/data/indicators.json
          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path('site/data/history.json').read_text(encoding='utf-8'))
          rebuilt = json.loads(Path('/tmp/history-rebuilt.json').read_text(encoding='utf-8'))
          assert frozen == rebuilt, 'site/data/history.json drifted semantically from canonical manifests'
          print({'history_contract_match': True})
          PY

      - name: Validate public product contracts
        run: |
          python scripts/validate_public_product.py
          python scripts/validate_public_readiness.py
          python scripts/validate_public_history.py
          python -m unittest tests.test_public_product -v
          python -m unittest tests.test_public_district_explorer -v
          python -m unittest tests.test_public_glossary -v
          python -m unittest tests.test_public_readiness -v
          python -m unittest tests.test_public_indicator_catalog -v
          python -m unittest tests.test_public_history -v
          node --check site/app.js
          node --check site/glossary.js
          node --check site/readiness.js
          node --check site/catalog.js
          node --check site/history.js

      - name: Validate historical reconstruction chain
        run: |
          python scripts/validate_data_foundation.py
          python scripts/validate_bps_foundation.py
          python scripts/validate_historical_reconstruction.py
          python scripts/validate_historical_batch.py
          python scripts/validate_bps_historical_anchor.py
          python scripts/validate_sp1961_official_anchor.py
          python scripts/validate_sumbar1970_official_artifact.py
          python scripts/validate_sumbar1980_incomplete_artifact.py
          python scripts/validate_sumbar1990_incomplete_artifact.py
          python scripts/validate_sumbar2000_official_anchor.py
          python scripts/validate_sumbar2000_apbd_construction_anchor.py
          python scripts/validate_sumbar2000_construction_financing_composition.py
          python scripts/validate_sumbar_construction_financing_revision_audit.py
          python scripts/validate_sumbar_construction_major_release_break.py
          python scripts/validate_sumbar_construction_legacy_var216_retention_boundary.py
          python scripts/validate_sumbar_construction_qualification_semantic_bridge_boundary.py

      - name: Rebuild and audit Milestone 10 analytical panel
        run: |
          python -m scripts.audit_research_foundation_complete --require-complete
          python -m scripts.build_milestone10_analytical_panel
          python -m scripts.audit_milestone10_analytical_panel --require-complete
          python -m unittest tests.test_milestone10_analytical_panel -v

      - name: Rebuild and audit Milestone 11 expected-performance model
        run: |
          python -m scripts.build_milestone11_expected_performance_v2
          python -m scripts.audit_milestone11_expected_performance_v2 --require-complete
          python -m unittest tests.test_milestone11_expected_performance_v2 -v

      - name: Rebuild and audit Milestone 19 strict forecast backtest
        run: |
          python scripts/build_milestone19_dynamic_forecast_engine.py
          python scripts/audit_milestone19_dynamic_forecast_engine.py
          python -m pytest -q tests/test_milestone19_dynamic_forecast_engine.py

      - name: Require byte-identical analytical outputs and clean tracked tree
        run: |
          git diff --exit-code -- \
            site/data/districts.json \
            site/data/indicators.json \
            site/data/history.json \
            data/analysis/engine/panel_v1 \
            data/manifests/milestone10_analytical_panel.json \
            data/analysis/engine/expected_performance_v2 \
            data/manifests/milestone11_expected_performance_v2.json \
            data/analysis/engine/dynamic_forecast_v1 \
            data/manifests/milestone19_dynamic_forecast_engine.json

      - name: Confirm Pages release evidence remains satisfied
        run: |
          grep -q '"deploy_pages": "success"' publication/pages-deployment.json
          grep -q 'https://nabilrn.github.io/ranah-observatory/' publication/pages-deployment.json
