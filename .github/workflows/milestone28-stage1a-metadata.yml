name: Milestone 28 Stage 1A Metadata Probe

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/milestone28-stage1a-metadata.yml

concurrency:
  group: milestone28-stage1a-metadata-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: research/evidence
          fetch-depth: 0

      - name: Compile Stage 1A probe
        run: python -m py_compile scripts/probe_milestone28_stage1a_metadata.py

      - name: Probe periods and selector metadata only
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: python scripts/probe_milestone28_stage1a_metadata.py

      - name: Verify Stage 1A boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone28_stage1a_metadata_probe.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone28-stage1a-metadata-probe/v1'
          assert m['candidate_count'] == 8
          assert m['metadata_only'] is True
          assert m['allowed_api_models_used'] == ['th', 'turvar', 'turth']
          assert m['dynamic_observation_requested'] is False
          assert m['target_values_inspected'] is False
          assert m['target_values_persisted'] is False
          assert m['credential_persisted'] is False
          for key in ('global_window_shortening_performed','imputation_performed','missing_values_coerced_to_zero','derived_indicator_materialized','statistical_model_fit','causal_claim_created','monetary_wasted_potential_estimated'):
              assert m[key] is False, key
          print({'candidate_count': m['candidate_count'], 'classifications': m['classification_counts']})
          PY

      - name: Commit frozen Stage 1A metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/bps/m28_stage1a_metadata \
            data/analysis/engine/broader_panel_v1/m28-stage1a-metadata-audit.csv \
            data/manifests/milestone28_stage1a_metadata_probe.json
          if git diff --cached --quiet; then
            echo "No Stage 1A metadata changes to commit"
            exit 0
          fi
          git commit -m "Freeze M28 Stage 1A selector metadata"
          git push origin HEAD:research/evidence
