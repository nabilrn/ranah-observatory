name: Milestone 31 Publication Submission Package

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/milestone31-publication-submission.yml
      - publication/v0.1/MILESTONE31_SUBMISSION_PACKAGE.md
      - publication/v0.1/tools/build_submission.py
      - publication/v0.1/submission/**

permissions:
  contents: write

jobs:
  certify-submission-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Require M31 publication-only scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/milestone31-publication-submission.yml',
              'publication/v0.1/MILESTONE31_SUBMISSION_PACKAGE.md',
              'publication/v0.1/tools/build_submission.py',
          }
          changed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          offenders = [p for p in changed if p not in allowed and not p.startswith('publication/v0.1/submission/')]
          assert not offenders, offenders
          print({'changed_files': len(changed), 'unauthorized_paths': 0})
          PY

      - name: Preserve certified scientific publication package
        run: python scripts/audit_milestone29_publication_v0_1.py

      - name: Rebuild and verify canonical M30 assets
        run: |
          python publication/v0.1/tools/build_assets.py
          git diff --exit-code -- publication/v0.1/rendered
          test -z "$(git status --porcelain -- publication/v0.1/rendered)"

      - name: Generate submission package
        run: python publication/v0.1/tools/build_submission.py

      - name: Validate submission contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          sub = Path('publication/v0.1/submission')
          required = {'README.md','asset-index.csv','manuscript-with-assets.md','metadata.json','submission-manifest.json'}
          assert {p.name for p in sub.iterdir() if p.is_file()} == required
          with (sub/'asset-index.csv').open(encoding='utf-8', newline='') as h:
              assets = list(csv.DictReader(h))
          assert len(assets) == 13
          assert sum(r['asset_type']=='table_csv' for r in assets) == 7
          assert sum(r['asset_type']=='figure_svg' for r in assets) == 6
          assert all(r['status']=='materialized' for r in assets)
          meta = json.loads((sub/'metadata.json').read_text(encoding='utf-8'))
          assert meta['new_source_acquisition'] is False
          assert meta['new_statistical_or_ml_model_fit'] is False
          assert meta['claim_upgrade_performed'] is False
          assert meta['author_record_status'] == 'pending_final_confirmation'
          manifest = json.loads((sub/'submission-manifest.json').read_text(encoding='utf-8'))
          assert manifest['asset_count'] == 13
          assert manifest['table_count'] == 7 and manifest['figure_count'] == 6
          manuscript = (sub/'manuscript-with-assets.md').read_text(encoding='utf-8')
          for asset_id in [f'T{i:02d}' for i in range(1,8)] + [f'F{i:02d}' for i in range(1,7)]:
              assert asset_id in manuscript, asset_id
          print({'submission_outputs': 5, 'indexed_assets': 13, 'claim_upgrade': False})
          PY

      - name: Commit canonical submission package
        shell: bash
        run: |
          if git diff --quiet -- publication/v0.1/submission && git ls-files --error-unmatch publication/v0.1/submission/submission-manifest.json >/dev/null 2>&1; then
            echo "canonical submission package already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication/v0.1/submission
          git commit -m "Materialize v0.1 submission package"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload generated submission package
        uses: actions/upload-artifact@v4
        with:
          name: publication-v0.1-submission
          path: publication/v0.1/submission
          retention-days: 7

      - name: Require no upstream science changes
        run: |
          git diff --exit-code origin/main...HEAD -- \
            data \
            docs \
            research/MILESTONE0* \
            research/MILESTONE1* \
            research/MILESTONE2* \
            scripts/build_milestone* \
            scripts/finalize_milestone*
