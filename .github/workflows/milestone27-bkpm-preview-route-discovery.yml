name: Milestone 27 BKPM Preview Route Evidence

on:
  pull_request:
    paths:
      - .github/workflows/milestone27-bkpm-preview-route-discovery.yml
      - data/manifests/milestone27_preview_route_discovery_contract.json
      - data/manifests/milestone27_bkpm_preview_route_discovery.json
      - data/processed/bkpm/m27_preview_route_discovery/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-preview-route-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen evidence and scientific boundaries
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'data/manifests/milestone27_bkpm_preview_route_discovery.json').read_text(encoding='utf-8'))

          assert manifest['schema'] == 'ranah-observatory/milestone27-bkpm-preview-route-discovery/v1'
          assert manifest['pilot_count'] == 3
          assert manifest['preview_page_html_retrieved'] is True
          assert manifest['route_candidate_found'] is True
          assert 'https://data.bkpm.go.id/data' in manifest['common_route_literal_candidates']

          forbidden_false = [
              'table_header_extracted',
              'table_body_extracted',
              'table_cell_text_extracted',
              'client_side_data_endpoint_requested',
              'zip_resource_requested',
              'interactive_disclaimer_form_submitted',
              'synthetic_personal_information_submitted',
              'target_investment_values_inspected',
              'period_column_inspected',
              'csv_schema_inspected',
              'investment_value_aggregation_performed',
              'quarterly_flow_interpretation_authorized',
              'cross_quarter_additivity_authorized',
              'annual_sum_authorized',
              'geography_mapping_authorized',
              'statistical_model_fit',
              'causal_claim_created',
              'monetary_wasted_potential_estimated',
          ]
          for key in forbidden_false:
              assert manifest[key] is False, key

          pilots = {(r['year'], r['quarter']) for r in manifest['pilot_results']}
          assert pilots == {(2010, 'I'), (2025, 'II'), (2025, 'IV')}

          for row in manifest['pilot_results']:
              assert row['title_match'] is True
              assert row['client_side_data_endpoint_requested'] is False
              assert row['target_investment_values_inspected'] is False
              for path_key, sha_key in (
                  ('response_path', 'response_sha256'),
                  ('script_route_evidence_path', 'script_route_evidence_sha256'),
              ):
                  path = root / row[path_key]
                  assert path.is_file(), path
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert digest == row[sha_key], (path, digest, row[sha_key])

          print('frozen M27 preview-route evidence verified')
          PY
