name: Sumbar 1970 Structural Discovery Index

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar1970-structural-index.yml

permissions:
  contents: write

env:
  SUMBAR1970_URL: 'https://web-api.bps.go.id/download.php?%3D'
  EXPECTED_SHA256: 'f0a441692e25b68f0ac8f4559509d14d707f527c20471832eb06c9a949eae325'

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch exact frozen artifact
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 180 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence discovery' \
            "$SUMBAR1970_URL" -o /tmp/sumbar1970.pdf
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/sumbar1970.pdf | sha256sum --check --strict

      - name: Extract built-in text layer only
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdftotext -layout /tmp/sumbar1970.pdf /tmp/sumbar1970.txt
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/sumbar1970.txt').read_text(encoding='utf-8', errors='replace')
          print({'text_chars': len(text), 'formfeed_pages': text.count('\f') + 1})
          PY

      - name: Build bounded structural discovery index
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          text = Path('/tmp/sumbar1970.txt').read_text(encoding='utf-8', errors='replace')
          pages = text.split('\f')
          terms = {
              'population': ['penduduk', 'population'],
              'education': ['sekolah', 'murid', 'guru', 'pendidikan'],
              'health': ['rumah sakit', 'puskesmas', 'dokter', 'kesehatan'],
              'agriculture': ['padi', 'sawah', 'produksi', 'panen'],
              'transport': ['jalan', 'kendaraan', 'angkutan'],
              'trade': ['perdagangan', 'ekspor', 'impor'],
              'public_finance': ['anggaran', 'pendapatan daerah', 'belanja'],
              'industry': ['industri', 'perusahaan'],
          }

          def compact(line: str) -> str:
              return re.sub(r'\s+', ' ', line).strip()[:220]

          result = {}
          for domain, needles in terms.items():
              matches = []
              for page_no, page in enumerate(pages, start=1):
                  lines = page.splitlines()
                  for i, line in enumerate(lines):
                      folded = line.casefold()
                      hit = next((n for n in needles if n.casefold() in folded), None)
                      if not hit:
                          continue
                      context = ' | '.join(
                          compact(x) for x in lines[max(0, i-1):min(len(lines), i+2)] if compact(x)
                      )
                      matches.append({'pdf_page_index': page_no, 'matched_term': hit, 'context': context})
                      if len(matches) >= 12:
                          break
                  if len(matches) >= 12:
                      break
              result[domain] = matches

          payload = {
              'schema': 'ranah-observatory/sumbar1970-structural-discovery-index/v1',
              'artifact_sha256': 'f0a441692e25b68f0ac8f4559509d14d707f527c20471832eb06c9a949eae325',
              'source_pdf_page_count': 138,
              'text_layer_char_count': len(text),
              'text_layer_page_chunks': len(pages),
              'extraction_method': 'pdftotext-layout-built-in-text-layer-only-no-ocr',
              'evidentiary_role': 'page discovery only; snippets are not canonical numeric observations',
              'numeric_promotion_authorized': False,
              'domains': result,
          }
          out = Path('data/validation/historical/sumbar1970/structural_index.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print({k: len(v) for k, v in result.items()})
          PY

      - name: Validate bounded index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/validation/historical/sumbar1970/structural_index.json')
          x = json.loads(p.read_text())
          assert x['artifact_sha256'] == 'f0a441692e25b68f0ac8f4559509d14d707f527c20471832eb06c9a949eae325'
          assert x['source_pdf_page_count'] == 138
          assert x['numeric_promotion_authorized'] is False
          assert x['extraction_method'].endswith('no-ocr')
          assert set(x['domains']) == {'population','education','health','agriculture','transport','trade','public_finance','industry'}
          assert all(len(v) <= 12 for v in x['domains'].values())
          print({'index': 'ok', 'text_chars': x['text_layer_char_count']})
          PY

      - name: Commit index and retire one-time workflow
        run: |
          rm .github/workflows/sumbar1970-structural-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/historical/sumbar1970/structural_index.json \
            .github/workflows/sumbar1970-structural-index.yml
          git commit -m 'Freeze bounded Sumbar 1970 structural discovery index'
          git push origin HEAD:research/evidence
