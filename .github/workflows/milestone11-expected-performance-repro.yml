name: Milestone 11 Expected Performance Reproducibility

on:
  pull_request:
    paths:
      - ".github/workflows/milestone11-expected-performance-repro.yml"
      - "research/MILESTONE11_EXPECTED_PERFORMANCE_V2_SPEC.md"
      - "scripts/build_milestone11_expected_performance_v2.py"
      - "scripts/audit_milestone11_expected_performance_v2.py"
      - "tests/test_milestone11_expected_performance_v2.py"
      - "docs/MILESTONE11_EXPECTED_PERFORMANCE_V2.md"
      - "data/manifests/milestone11_design_gate.json"
      - "data/manifests/milestone11_expected_performance_v2.json"
      - "data/analysis/engine/expected_performance_v2/**"
      - "data/analysis/engine/panel_v1/**"
      - "data/manifests/milestone10_analytical_panel.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/milestone11-expected-performance-repro.yml"
      - "research/MILESTONE11_EXPECTED_PERFORMANCE_V2_SPEC.md"
      - "scripts/build_milestone11_expected_performance_v2.py"
      - "scripts/audit_milestone11_expected_performance_v2.py"
      - "tests/test_milestone11_expected_performance_v2.py"
      - "docs/MILESTONE11_EXPECTED_PERFORMANCE_V2.md"
      - "data/manifests/milestone11_design_gate.json"
      - "data/manifests/milestone11_expected_performance_v2.json"
      - "data/analysis/engine/expected_performance_v2/**"
      - "data/analysis/engine/panel_v1/**"
      - "data/manifests/milestone10_analytical_panel.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Research Foundation 9/9 remains complete
        run: python -m scripts.audit_research_foundation_complete --require-complete

      - name: Require Milestone 10 analytical substrate remains complete
        run: python -m scripts.audit_milestone10_analytical_panel --require-complete

      - name: Rebuild Milestone 11 cross-fitted engine
        run: python -m scripts.build_milestone11_expected_performance_v2

      - name: Enforce Milestone 11 completion audit
        run: python -m scripts.audit_milestone11_expected_performance_v2 --require-complete

      - name: Run Milestone 11 focused tests
        run: python -m unittest tests.test_milestone11_expected_performance_v2 -v

      - name: Revalidate canonical data foundation
        run: python scripts/validate_data_foundation.py

      - name: Revalidate historical reconstruction foundation
        run: python scripts/validate_historical_reconstruction.py

      - name: Require byte-identical committed M11 outputs
        run: |
          git diff --exit-code -- \
            data/analysis/engine/expected_performance_v2 \
            data/manifests/milestone11_expected_performance_v2.json
