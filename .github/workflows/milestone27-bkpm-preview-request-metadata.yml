name: Milestone 27 BKPM Preview Request Metadata

on:
  push:
    branches:
      - agent/milestone27-bkpm-investment-history
    paths:
      - .github/workflows/milestone27-bkpm-preview-request-metadata.yml
      - data/manifests/milestone27_preview_request_metadata_contract.json
      - scripts/audit_milestone27_bkpm_preview_request_metadata.py
  workflow_dispatch:

concurrency:
  group: milestone27-bkpm-preview-request-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-request-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone27-bkpm-investment-history
          fetch-depth: 0

      - name: Compile audit
        run: python -m py_compile scripts/audit_milestone27_bkpm_preview_request_metadata.py

      - name: Audit request construction from frozen HTML only
        run: python scripts/audit_milestone27_bkpm_preview_request_metadata.py

      - name: Verify boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path('data/manifests/milestone27_bkpm_preview_request_metadata.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'ranah-observatory/milestone27-bkpm-preview-request-metadata/v1'
          assert m['pilot_count'] == 3
          assert m['target_route'] == 'https://data.bkpm.go.id/data'
          assert m['offline_frozen_html_only'] is True
          assert {(r['year'], r['quarter']) for r in m['pilot_results']} == {(2010, 'I'), (2025, 'II'), (2025, 'IV')}
          for key in (
              'request_parameter_values_extracted',
              'csrf_or_token_values_extracted',
              'table_column_names_extracted',
              'table_header_extracted',
              'table_body_extracted',
              'table_cell_text_extracted',
              'client_side_data_endpoint_requested',
              'preview_page_live_requested',
              'zip_resource_requested',
              'interactive_disclaimer_form_submitted',
              'synthetic_personal_information_submitted',
              'target_investment_values_inspected',
              'period_column_inspected',
              'csv_schema_inspected',
              'investment_value_aggregation_performed',
              'quarterly_flow_interpretation_authorized',
              'cross_quarter_additivity_authorized',
              'annual_sum_authorized',
              'geography_mapping_authorized',
              'statistical_model_fit',
              'causal_claim_created',
              'monetary_wasted_potential_estimated',
          ):
              assert m[key] is False, key
          print({
              'resolved': m['request_metadata_resolved'],
              'consistent': m['request_metadata_consistent_across_pilots'],
              'methods': sorted({r['http_method'] for r in m['pilot_results']}),
              'parameter_keys': sorted({tuple(r['request_parameter_key_names']) for r in m['pilot_results']}),
          })
          PY

      - name: Commit deterministic request-metadata evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/milestone27_bkpm_preview_request_metadata.json
          if git diff --cached --quiet; then
            echo "No request-metadata changes to commit"
            exit 0
          fi
          git commit -m "Freeze M27 BKPM preview request metadata"
          git push origin HEAD:agent/milestone27-bkpm-investment-history
