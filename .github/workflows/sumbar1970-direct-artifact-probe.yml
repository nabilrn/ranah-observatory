name: Sumbar 1970 Official Direct Artifact Probe

on:
  push:
    branches:
      - research/evidence
    paths:
      - .github/workflows/sumbar1970-direct-artifact-probe.yml

permissions:
  contents: write

env:
  SUMBAR1970_URL: 'https://web-api.bps.go.id/download.php?%3D'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/evidence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch exact official BPS PDF bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 20 --max-time 180 \
            -H 'User-Agent: Ranah-Observatory/1.0 evidence acquisition' \
            "$SUMBAR1970_URL" -o /tmp/sumbar1970.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sumbar1970.pdf')
          b = p.read_bytes()
          assert p.stat().st_size > 1_000_000, p.stat().st_size
          assert b.startswith(b'%PDF-')
          assert b'%%EOF' in b[-16384:]
          print({'bytes': p.stat().st_size})
          PY

      - name: Inspect official artifact structure
        run: |
          if ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdfinfo /tmp/sumbar1970.pdf

      - name: Freeze artifact provenance only
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          pdf = Path('/tmp/sumbar1970.pdf')
          digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
          info = subprocess.check_output(['pdfinfo', str(pdf)], text=True, errors='replace')
          parsed = {}
          for line in info.splitlines():
              if ':' not in line:
                  continue
              key, value = line.split(':', 1)
              parsed[key.strip()] = value.strip()
          pages = int(parsed['Pages'])
          assert pages > 10

          out_dir = Path('data/validation/historical/sumbar1970')
          out_dir.mkdir(parents=True, exist_ok=True)
          manifest = {
              'schema': 'ranah-observatory/sumbar1970-official-artifact/v1',
              'source': 'Kantor Sensus dan Statistik Provinsi Sumatera Barat / BPS',
              'title': 'Sumatera Barat Dalam Angka Tahun 1970',
              'catalog_number': '1102001.13',
              'publication_number': '13000.1970',
              'issn_isbn': '0303-5328',
              'release_date': '1971-09-01',
              'official_page_url': 'https://sumbar.bps.go.id/id/publication/1971/09/01/596696f5adf6201742791a61/sumatera-barat-dalam-angka-tahun-1970.html',
              'official_direct_artifact_url': os.environ['SUMBAR1970_URL'],
              'artifact_sha256': digest,
              'artifact_bytes': pdf.stat().st_size,
              'pdf_page_count': pages,
              'retrieved_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'retrieval_surface': 'web-api.bps.go.id public direct download',
              'raw_pdf_committed': False,
              'raw_storage_policy': 'raw PDFs remain ignored; exact official bytes are fingerprinted by SHA-256 and re-retrievable from the official URL',
              'publication_scope': 'multidomain regional statistics',
              'numeric_extraction_started': False,
              'numeric_promotion_authorized': False,
              'table_semantics_verified': False,
              'current_boundary_mapping_authorized': False,
              'next_gate': 'inspect source-native table structure and select defensible historical indicators before any numeric extraction',
          }
          (out_dir / 'artifact_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print({'sha256': digest, 'bytes': pdf.stat().st_size, 'pages': pages})
          PY

      - name: Validate provenance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/validation/historical/sumbar1970/artifact_manifest.json')
          m = json.loads(p.read_text())
          assert len(m['artifact_sha256']) == 64
          assert m['artifact_bytes'] > 1_000_000
          assert m['pdf_page_count'] > 10
          assert m['official_page_url'].startswith('https://sumbar.bps.go.id/')
          assert m['official_direct_artifact_url'].startswith('https://web-api.bps.go.id/download.php?f=')
          assert m['raw_pdf_committed'] is False
          assert m['numeric_extraction_started'] is False
          assert m['numeric_promotion_authorized'] is False
          assert m['table_semantics_verified'] is False
          assert m['current_boundary_mapping_authorized'] is False
          print({'provenance': 'ok'})
          PY

      - name: Commit provenance and retire one-time probe
        run: |
          rm .github/workflows/sumbar1970-direct-artifact-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/historical/sumbar1970/artifact_manifest.json \
            .github/workflows/sumbar1970-direct-artifact-probe.yml
          git commit -m 'Freeze official Sumbar 1970 artifact provenance'
          git push origin HEAD:research/evidence
