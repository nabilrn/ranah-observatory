name: M63 Acquire BPBD Mitigation Plan TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/acquire_milestone63_bpbd_mitigation_plan_2026.py'
      - '.github/workflows/m63-acquire-bpbd-mitigation-plan-temp.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Freeze official BPBD 2026 Renja evidence
        run: python scripts/acquire_milestone63_bpbd_mitigation_plan_2026.py
      - name: Commit frozen M63 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/raw/bpbd/m63_renja_2026
          git add data/processed/bpbd/mitigation_plan_2026/renja-bpbd-2026-pages-51-64.txt \
                  data/manifests/milestone63_bpbd_mitigation_plan_2026_acquisition.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze M63 BPBD 2026 mitigation-plan evidence'
          git push origin HEAD:research/evidence
