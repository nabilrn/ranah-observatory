name: M63 Finalize BPBD Mitigation Plan TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/materialize_milestone63_bpbd_mitigation_plan_2026.py'
      - '.github/workflows/m63-acquire-bpbd-mitigation-plan-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize frozen M63 planning context
        run: python scripts/materialize_milestone63_bpbd_mitigation_plan_2026.py
      - name: Commit M63 canonical planning context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/bpbd/mitigation_plan_2026/bpbd-mitigation-targets-2026.csv \
                  data/processed/bpbd/mitigation_plan_2026/bpbd-mitigation-gaps-2026.csv \
                  data/manifests/milestone63_bpbd_mitigation_plan_2026_final.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize M63 BPBD mitigation planning context'
          git push origin HEAD:research/evidence
