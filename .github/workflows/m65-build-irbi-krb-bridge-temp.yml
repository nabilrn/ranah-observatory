name: M65 Build IRBI KRB Bridge TEMP

on:
  push:
    branches: [research/evidence]
    paths:
      - 'scripts/materialize_milestone65_irbi_krb_lookup_bridge.py'
      - '.github/workflows/m65-build-irbi-krb-bridge-temp.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize M65 lookup bridge
        run: python scripts/materialize_milestone65_irbi_krb_lookup_bridge.py
      - name: Commit M65 bridge outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mappings/milestone65_irbi_krb_hazard_lookup_crosswalk.csv \
                  data/processed/bnpb/irbi_krb_bridge_2024/irbi-risk-mitigation-lookup-index-2024.csv \
                  data/manifests/milestone65_irbi_krb_lookup_bridge.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize M65 IRBI KRB lookup bridge'
          git push origin HEAD:research/evidence
