name: Climate rainfall PoC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_chirps_rainfall_poc.py"
      - "tests/test_chirps_rainfall_poc.py"
      - ".github/workflows/climate-rainfall-poc.yml"
      - "data/registries/big_geography_map.csv"
      - "docs/CLIMATE_RAINFALL_POC.md"

permissions:
  contents: read

jobs:
  validate-and-run-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            rasterio==1.5.0 \
            shapely==2.1.2 \
            pyproj==3.7.2

      - name: Run offline aggregation tests
        run: python -m unittest tests.test_chirps_rainfall_poc -v

      - name: Run bounded 1981 CHIRPS/BIG live PoC
        run: python scripts/build_chirps_rainfall_poc.py --output-dir artifacts/chirps-rainfall-poc

      - name: Enforce PoC evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/chirps-rainfall-poc/chirps_rainfall_poc_manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["scope"]["not_canonical_materialization"], payload
          assert payload["scope"]["year"] == 1981, payload
          assert payload["scope"]["geography_count"] == 3, payload
          assert payload["scope"]["monthly_row_count"] == 36, payload
          assert payload["scope"]["annual_row_count"] == 3, payload
          assert payload["method"]["claim_type"] == "model_estimate", payload
          assert not payload["method"]["historical_boundary_continuity_claimed"], payload
          assert payload["big_geometry"]["source_edition"] == "Juni 2026", payload
          assert payload["chirps_grid"]["crs"] in {"EPSG:4326", "OGC:CRS84"}, payload
          assert abs(payload["chirps_grid"]["pixel_width_degrees"] - 0.05) < 1e-7, payload
          assert abs(payload["chirps_grid"]["pixel_height_degrees"] - 0.05) < 1e-7, payload
          assert all(payload["gates"].values()), payload
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chirps-rainfall-poc-1981
          path: artifacts/chirps-rainfall-poc/
