name: Diagnose M55 BPBD LKj 2022 artifact

on:
  push:
    branches:
      - research/evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Freeze current official LKj BPBD 2022 artifact diagnostics
        run: |
          set -euo pipefail
          base='https://bpbd.sumbarprov.go.id'
          endpoint="$base/web-api/api/category/laporan-kinerja-instansi-pemerintah/2696"
          curl --fail --silent --show-error --location "$endpoint" -o /tmp/category.json
          current_url=$(python - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path('/tmp/category.json').read_text())
          rows=p.get('data') or []
          row=next(r for r in rows if '2022' in str(r.get('title') or ''))
          path=str(row['gambar'])
          print('https://bpbd.sumbarprov.go.id/web-api'+path)
          PY
          )
          echo "current_url=$current_url"
          curl --fail --silent --show-error --location --dump-header /tmp/current.headers "$current_url" -o /tmp/current.pdf
          echo '--- headers ---'
          cat /tmp/current.headers
          echo '--- diagnostics ---'
          test "$(head -c 4 /tmp/current.pdf)" = '%PDF'
          wc -c /tmp/current.pdf
          sha256sum /tmp/current.pdf
          file /tmp/current.pdf
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo /tmp/current.pdf | grep -E '^(Pages|Page size|PDF version):'
          fi

      - name: Confirm legacy path is no longer the raw artifact
        run: |
          set -euo pipefail
          legacy='https://bpbd.sumbarprov.go.id/images/2023/05/file/LKJ_BPBD_TAHUN_2022.pdf'
          curl --silent --show-error --location --dump-header /tmp/legacy.headers "$legacy" -o /tmp/legacy.bin
          test "$(head -c 4 /tmp/legacy.bin)" != '%PDF'
          wc -c /tmp/legacy.bin
          sha256sum /tmp/legacy.bin
          file /tmp/legacy.bin
          grep -i '^content-type:' /tmp/legacy.headers
