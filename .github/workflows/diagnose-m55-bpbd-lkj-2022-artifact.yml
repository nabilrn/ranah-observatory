name: Diagnose M55 BPBD LKj 2022 artifact

on:
  push:
    branches:
      - research/evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect official LKj BPBD 2022 transport
        run: |
          set -euo pipefail
          url='https://bpbd.sumbarprov.go.id/images/2023/05/file/LKJ_BPBD_TAHUN_2022.pdf'
          curl --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            --dump-header /tmp/headers.txt "$url" -o /tmp/response.bin
          echo '--- response headers ---'
          cat /tmp/headers.txt
          echo '--- byte diagnostics ---'
          wc -c /tmp/response.bin
          sha256sum /tmp/response.bin
          file /tmp/response.bin
          echo '--- first bytes ---'
          python - <<'PY'
          from pathlib import Path
          data = Path('/tmp/response.bin').read_bytes()
          print(repr(data[:500]))
          PY
          if [ "$(head -c 4 /tmp/response.bin)" = '%PDF' ]; then
            echo 'artifact_state=pdf'
            if command -v pdfinfo >/dev/null 2>&1; then
              pdfinfo /tmp/response.bin | grep -E '^(Pages|Page size|PDF version):'
            fi
          else
            echo 'artifact_state=non_pdf_transport_response'
          fi
