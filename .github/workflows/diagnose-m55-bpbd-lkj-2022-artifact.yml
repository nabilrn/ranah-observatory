name: Diagnose M55 BPBD LKj 2022 artifact

on:
  push:
    branches:
      - research/evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare encoded current library file transport
        run: |
          set -euo pipefail
          base='https://bpbd.sumbarprov.go.id'
          endpoint="$base/web-api/api/category/laporan-kinerja-instansi-pemerintah/2696"
          curl --fail --silent --show-error --location "$endpoint" -o /tmp/category.json
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, urllib.parse, hashlib

          base='https://bpbd.sumbarprov.go.id'
          rows=(json.loads(Path('/tmp/category.json').read_text()).get('data') or [])
          summary=[]
          for i,row in enumerate(rows):
              title=str(row.get('title') or '')
              path=str(row.get('gambar') or '')
              encoded=urllib.parse.quote(path, safe='/:')
              url=base+'/web-api'+encoded
              out=f'/tmp/encoded-{i}.bin'
              hdr=f'/tmp/encoded-{i}.hdr'
              p=subprocess.run(['curl','--silent','--show-error','--location','--max-time','120','--dump-header',hdr,'--output',out,'--write-out','%{http_code}',url],text=True,capture_output=True)
              body=Path(out).read_bytes() if Path(out).exists() else b''
              headers=Path(hdr).read_text(encoding='utf-8',errors='replace') if Path(hdr).exists() else ''
              ctype=''
              for line in headers.splitlines():
                  if line.lower().startswith('content-type:'):
                      ctype=line.split(':',1)[1].strip()
              rec={
                  'title':title,'metadata_path':path,'resolved_url':url,
                  'http':p.stdout.strip(),'curl_rc':p.returncode,'bytes':len(body),
                  'content_type':ctype,'is_pdf':body.startswith(b'%PDF'),
                  'sha256':hashlib.sha256(body).hexdigest() if body else None,
                  'body_prefix':None if body.startswith(b'%PDF') else body[:160].decode('utf-8',errors='replace')
              }
              summary.append(rec)
              print(json.dumps(rec,ensure_ascii=False,sort_keys=True))
              if rec['is_pdf']:
                  subprocess.run(['file',out],check=True)
          print('SUMMARY_JSON='+json.dumps(summary,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          PY

      - name: Confirm legacy 2022 path is SPA fallback
        run: |
          set -euo pipefail
          legacy='https://bpbd.sumbarprov.go.id/images/2023/05/file/LKJ_BPBD_TAHUN_2022.pdf'
          curl --silent --show-error --location --dump-header /tmp/legacy.headers "$legacy" -o /tmp/legacy.bin
          test "$(head -c 4 /tmp/legacy.bin)" != '%PDF'
          wc -c /tmp/legacy.bin
          sha256sum /tmp/legacy.bin
          file /tmp/legacy.bin
          grep -i '^content-type:' /tmp/legacy.headers
