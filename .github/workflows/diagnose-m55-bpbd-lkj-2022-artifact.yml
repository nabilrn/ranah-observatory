name: Diagnose M55 BPBD LKj 2022 artifact

on:
  push:
    branches:
      - research/evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Search current BPBD library categories for DIBI 2022
        run: |
          set -euo pipefail
          base='https://bpbd.sumbarprov.go.id'
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          base='https://bpbd.sumbarprov.go.id'
          slugs=[
              'download','laporan-kinerja-instansi-pemerintah','infografis',
              'edukasi-bencana','rencana-strategis','rencana-kerja',
              'perjanjian-kinerja','rencana-kinerja-tahunan','sop',
              'indikator-kinerja-individu','renaksi','skp','iku'
          ]
          hits=[]
          for slug in slugs:
              url=f'{base}/web-api/api/category/{slug}/2696'
              p=subprocess.run(['curl','--fail','--silent','--show-error','--location',url],text=True,capture_output=True)
              if p.returncode:
                  print('category_error',slug,p.stderr.strip())
                  continue
              try:
                  payload=json.loads(p.stdout)
              except Exception as exc:
                  print('category_non_json',slug,type(exc).__name__)
                  continue
              rows=payload.get('data') or []
              print('category',slug,'rows',len(rows))
              for row in rows:
                  blob=json.dumps(row,ensure_ascii=False).lower()
                  if 'dibi' in blob or ('2022' in blob and ('bencana' in blob or 'kebencanaan' in blob)):
                      hits.append({'category_slug':slug,'row':row})
          print('DIBI_HITS='+json.dumps(hits,ensure_ascii=False,sort_keys=True,indent=2))
          PY
