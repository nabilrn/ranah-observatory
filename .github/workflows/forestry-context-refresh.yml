name: Refresh official forestry context

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize_forestry_land_cover_sumbar.py
      - .github/workflows/forestry-context-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forestry-context-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.16.2
      - name: Materialize validated Sumbar land-cover context
        run: python scripts/materialize_forestry_land_cover_sumbar.py
      - name: Commit validated forestry context artifacts
        run: |
          git config user.name "ranah-observatory-bot"
          git config user.email "116415990+nabilrn@users.noreply.github.com"
          git add \
            data/processed/forestry/land_cover/sumbar-land-cover-2022-2023.csv \
            data/manifests/sumbar_forestry_land_cover_2022_2023.json
          if git diff --cached --quiet; then
            echo "No forestry context changes to commit"
            exit 0
          fi
          git commit -m "[skip ci] [data-refresh] Refresh official Sumbar forestry context"
          git push origin HEAD:main
