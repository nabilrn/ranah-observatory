name: Milestone 4 Population Growth

on:
  push:
    branches:
      - agent/milestone4-indicator-batch-1
    paths:
      - "data/registries/bps_population_growth_2010_2020_publication.csv"
      - "data/registries/geographies.csv"
      - "scripts/validate_bps_population_growth_publication.py"
      - "scripts/materialize_bps_population_growth.py"
      - ".github/workflows/milestone4-population-growth.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone4-population-growth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone4-indicator-batch-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revalidate publication source contract
        run: >-
          python scripts/validate_bps_population_growth_publication.py
          --output /tmp/bps-population-growth-source-contract.json

      - name: Materialize canonical population growth
        run: python scripts/materialize_bps_population_growth.py

      - name: Revalidate frozen output
        run: python scripts/materialize_bps_population_growth.py --validate-only

      - name: Enforce exact promotion contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/processed/bps/demography/population-growth-2010-2020.manifest.json').read_text())
          assert p['canonical_observation_count'] == 19, p
          assert p['canonical_provenance_count'] == 1, p
          assert p['formula_match_count'] == 19, p
          assert p['indicator_id'] == 'population_growth', p
          assert p['claim_type'] == 'derived', p
          assert p['interval_months'] == 124, p
          assert p['canonical_promotion_performed'] is True, p
          PY

      - name: Commit deterministic canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/bps/demography/
          if git diff --cached --quiet; then
            echo "Population-growth canonical output already matches Git."
            exit 0
          fi
          git commit -m "data: freeze BPS population growth"
          git push origin HEAD:agent/milestone4-indicator-batch-1
