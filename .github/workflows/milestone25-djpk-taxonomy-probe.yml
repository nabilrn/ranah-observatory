name: Milestone 25 DJPK taxonomy probe

on:
  pull_request:
    paths:
      - research/MILESTONE25_DJPK_PUBLIC_FINANCE_SPEC.md
      - data/manifests/milestone25_design_gate.json
      - data/registries/djpk_sumbar_pemda.csv
      - scripts/probe_milestone25_djpk_taxonomy.py
      - tests/test_milestone25_djpk_taxonomy.py
      - .github/workflows/milestone25-djpk-taxonomy-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run M25 offline contract tests
        run: python -m pytest -q tests/test_milestone25_djpk_taxonomy.py

  live-taxonomy-probe:
    needs: offline-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Kota Padang December APBD taxonomy 2018-2025
        run: >-
          python scripts/probe_milestone25_djpk_taxonomy.py
          --discovery /tmp/m25/m25-taxonomy-discovery.csv
          --presence /tmp/m25/m25-account-presence.csv
          --manifest /tmp/m25/milestone25_taxonomy_discovery.json
          --raw-dir /tmp/m25/raw
      - name: Upload credential-free DJPK taxonomy evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone25-djpk-taxonomy
          path: /tmp/m25
          if-no-files-found: error
          retention-days: 14
