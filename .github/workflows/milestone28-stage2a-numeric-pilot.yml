name: Milestone 28 Stage 2A Numeric Pilot Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - data/processed/bps/m28_stage2a_numeric_pilot/**
      - data/analysis/engine/broader_panel_v1/m28-stage2a-pilot-observations.csv
      - data/analysis/engine/broader_panel_v1/m28-stage2a-pilot-provenance.csv
      - data/analysis/engine/broader_panel_v1/m28-stage2a-pilot-audit.csv
      - data/manifests/milestone28_stage2a_numeric_pilot.json
      - data/manifests/milestone28_stage2a_numeric_pilot_contract.json
      - scripts/materialize_milestone28_stage2a_numeric_pilot.py
      - .github/workflows/milestone28-stage2a-numeric-pilot.yml

permissions:
  contents: read

jobs:
  verify-frozen-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pilot certificate and raw checksums
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path('data/manifests/milestone28_stage2a_numeric_pilot.json').read_text(encoding='utf-8'))
          assert m['pilot_success'] is True
          assert m['candidate_pass_count'] == 7
          assert m['candidate_hold_count'] == 0
          assert m['promoted_observation_count'] == 133
          assert m['full_history_materialization_authorized'] is False
          for item in m['raw_snapshots']:
              p = Path(item['path'])
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item['sha256']
          for key in ('observations_csv','provenance_csv','audit_csv'):
              item = m[key]
              p = Path(item['path'])
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item['sha256']
          print({'pilot_success': True, 'observations': 133})
          PY
